<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>지진파로 지구 속 보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef;--card:#ffffff;--ink:#1d2025;--sub:#4a5059;--line:#d9d5cc;--accent:#2f5d8a;
  --land:#e4dcc8;--landline:#a89c80;--sea:#dce8f0;--grid:#e3e0d8;--grid2:#c9c4b8;
  --pc:#1f5fbf;--sc:#c4362b;--trace:#22262c;
  --c0:#0f8a7a;--c1:#8a3fb0;--c2:#c27a00;--core:#efb26a;--icore:#d9893a;
  --okbg:#e3f3e6;--okfg:#1d6b33;--warnbg:#fff4c8;--warnfg:#6b5200;--hintbg:#fdeceb;--hintfg:#8a2a22;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15181c;--card:#1f242a;--ink:#eef0f2;--sub:#b4bac2;--line:#363d46;--accent:#8db8e6;
  --land:#3a3a33;--landline:#6d6a5c;--sea:#1b2a36;--grid:#2a3038;--grid2:#434b56;
  --pc:#6fa8ff;--sc:#ff7a6e;--trace:#e6e8ea;
  --c0:#3fd0bc;--c1:#c88cf0;--c2:#f2b33d;--core:#7a5226;--icore:#a8682c;
  --okbg:#183a24;--okfg:#9fe0b0;--warnbg:#3d3410;--warnfg:#f5dc7a;--hintbg:#3e1f1c;--hintfg:#ffb4ab;
}}
:root[data-theme="dark"]{
  --bg:#15181c;--card:#1f242a;--ink:#eef0f2;--sub:#b4bac2;--line:#363d46;--accent:#8db8e6;
  --land:#3a3a33;--landline:#6d6a5c;--sea:#1b2a36;--grid:#2a3038;--grid2:#434b56;
  --pc:#6fa8ff;--sc:#ff7a6e;--trace:#e6e8ea;
  --c0:#3fd0bc;--c1:#c88cf0;--c2:#f2b33d;--core:#7a5226;--icore:#a8682c;
  --okbg:#183a24;--okfg:#9fe0b0;--warnbg:#3d3410;--warnfg:#f5dc7a;--hintbg:#3e1f1c;--hintfg:#ffb4ab;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
.wrap{max-width:720px;margin:0 auto}
header{padding:12px 16px 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header h1{font-size:19px;margin:0;font-weight:700}
.code{font-size:13px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--sub)}
.themebtn{margin-left:auto;background:none;border:1px solid var(--line);color:var(--sub);border-radius:8px;padding:4px 8px;font:inherit;font-size:13px}
nav.tabs{display:flex;gap:4px;padding:6px 16px 0;overflow-x:auto;scrollbar-width:none}
nav.tabs button{flex:0 0 auto;font:inherit;font-size:14px;font-weight:600;padding:8px 10px;border:1px solid var(--line);border-bottom:none;border-radius:10px 10px 0 0;background:transparent;color:var(--sub)}
nav.tabs button.on{background:var(--card);color:var(--ink)}
.stage{position:sticky;top:0;z-index:5;background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 16px 8px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-size:14px;font-weight:600;padding:6px 10px;border:none;background:transparent;color:var(--sub)}
.seg button.on{background:var(--accent);color:var(--card)}
.tag{font-size:12px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap}
.tag.model{background:var(--warnbg);color:var(--warnfg)}
.tag.real{background:var(--okbg);color:var(--okfg)}
canvas{display:block;width:100%;touch-action:none;border-radius:8px}
#cv{height:min(42vh,330px);min-height:240px;margin-top:6px;background:var(--bg)}
.src{font-size:12px;color:var(--sub);margin-top:4px;min-height:18px}
.tools{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
.tools button,.btn{font:inherit;font-size:15px;font-weight:600;min-height:40px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.tools button.sel{outline:2px solid var(--accent)}
.btn.primary{background:var(--accent);color:var(--card);border-color:var(--accent)}
main{padding:12px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:17px}
.card p{margin:6px 0}
.muted{color:var(--sub);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{font:inherit;font-size:15px;font-weight:600;padding:6px 10px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-height:40px}
.chip.on{border-color:var(--accent)}
.chip .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:1px}
.read{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.read div{background:var(--bg);border-radius:10px;padding:6px 10px}
.read b{font-size:20px}
.read .lab{font-size:13px;color:var(--sub);display:block}
.inp{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:18px;font-weight:600}
.inp span{white-space:nowrap}
.inp input{font:inherit;font-size:24px;font-weight:700;flex:1 1 auto;min-width:0;height:56px;padding:6px 12px;border-radius:12px;border:2px solid var(--accent);background:var(--bg);color:var(--ink)}
.inp input:disabled{border-color:var(--line)}
.inp .btn{min-height:56px;padding:6px 16px;font-size:18px;white-space:nowrap;flex:0 0 auto}
.inp input::-webkit-inner-spin-button,.inp input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.inp input{-moz-appearance:textfield}
body.typing .stage{position:static}
@media (max-width:480px){#cv{height:min(36vh,300px)}}
.fb{margin-top:8px;padding:8px 10px;border-radius:10px;font-size:15px}
.fb.ok{background:var(--okbg);color:var(--okfg)}
.fb.hint{background:var(--hintbg);color:var(--hintfg)}
.fb.note{background:var(--warnbg);color:var(--warnfg)}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.opts button{font:inherit;font-size:15px;text-align:left;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:42px}
.opts button.picked{border:2px solid var(--accent)}
table.res{width:100%;border-collapse:collapse;font-size:15px;margin-top:6px}
table.res td,table.res th{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:12px}
details summary{font-weight:700;cursor:pointer}
.diff{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.diff td,.diff th{border:1px solid var(--line);padding:6px;vertical-align:top;text-align:left}
.diff th{background:var(--bg)}
#cv3{height:min(88vw,50vh,560px);min-height:280px;margin-top:6px;background:var(--bg)}
.sl{margin-top:8px}.sl label{font-weight:600;display:block}.sl input{width:100%;height:40px;accent-color:var(--accent)}
.dif summary{font-size:16px}
.dcard{border-top:1px solid var(--line);padding:12px 0 6px;margin-top:8px}
.dt{font-weight:700;font-size:16px;margin-bottom:6px}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dc{border-radius:10px;padding:8px;font-size:14px;line-height:1.45}
.dc p{margin:4px 0 0}
.dc.sim{background:var(--warnbg)}.dc.real{background:var(--okbg)}
.dl{font-size:12px;font-weight:700;display:block}
.dc.sim .dl{color:var(--warnfg)}.dc.real .dl{color:var(--okfg)}
.fig{width:100%;height:auto;display:block;margin-top:4px;background:var(--card);border-radius:6px}
.fig .ln{fill:none;stroke:var(--ink);stroke-width:1.4}.fig .p{stroke:var(--pc);stroke-width:2}.fig .s{stroke:var(--sc);stroke-width:2;stroke-dasharray:4 3}
.fig .st{fill:var(--accent)}.fig .eq{fill:var(--sc)}.fig .bg{fill:var(--sea)}.fig .gr{fill:var(--land)}.fig .dash{stroke:var(--ink);stroke-dasharray:3 3}.fig .pt{fill:var(--ink)}
.fig .tx{font-size:11px;font-weight:700;fill:var(--ink);text-anchor:middle}.fig .big{font-size:20px;font-weight:700;fill:var(--ink);text-anchor:middle}
.fig .l1{fill:#d8cba8}.fig .l2{fill:#c9a36b}.fig .l3{fill:#e2a35a}.fig .hot{fill:#d8463a;opacity:.75}.fig .cold{fill:#3a6fd8;opacity:.75}
.fig .on{fill:var(--sc)}.fig .off{fill:var(--grid2)}.fig .g1{stop-color:var(--sc)}.fig .g2{stop-color:var(--grid2)}
.fig .ry{fill:none;stroke:var(--sc);stroke-width:1.3}.fig .ry2{fill:none;stroke:var(--pc);stroke-width:1.3;stroke-dasharray:3 2}
#g1{position:relative;height:min(44vh,340px);min-height:240px;margin-top:6px;border-radius:8px;background:var(--bg);overflow:hidden;touch-action:none}
#g1 canvas{border-radius:8px;position:absolute;left:0;top:0;width:100%;height:100%}
.lab3{position:absolute;left:0;top:0;font-size:13px;font-weight:700;color:var(--ink);background:var(--card);padding:1px 6px;border-radius:6px;pointer-events:none;margin:-10px 0 0 -18px;opacity:.9}
.nogl{padding:30px 16px;text-align:center;color:var(--sub)}
#tr1{height:76px;margin-top:6px;background:var(--bg)}
.seg button:disabled{opacity:.35}
#cv4{height:min(62vh,470px);min-height:360px;margin-top:6px;background:var(--bg)}
#cv5{height:min(56vh,430px);min-height:330px;margin-top:6px;background:var(--bg)}
.soon{text-align:center;padding:40px 10px;color:var(--sub)}
.term{font-weight:700}
/* ---------- 모드 (탐구 / 시뮬레이션) ---------- */
.modeSw{flex-basis:100%;display:flex;justify-content:flex-end;align-items:center;gap:6px}
.modeSw .now{font-size:12px;font-weight:800;color:var(--ink);background:var(--card);border:1px solid var(--line);padding:3px 10px;border-radius:999px;white-space:nowrap}
.modeSw a{font-size:12px;font-weight:600;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:3px 10px;text-decoration:none;white-space:nowrap}
html.sim .opts:not([data-lt]),html.sim p:has(+ .opts:not([data-lt])),html.sim .fb.hint,
html.sim [data-a=reguess],html.sim [data-a=core],html.sim [data-a=h],html.sim [data-a=calc]{display:none!important}
html.sim .wrap{max-width:960px}
</style>
<script>
/* 모드는 주소로만 정한다: ?mode=sim 이면 시뮬레이션 모드(질문 없이 모든 단계를 연 상태), 없으면 탐구 모드.
   시뮬레이션 모드에서는 탐구 기록(localStorage)을 읽지도 쓰지도 않는다 → 학생 기록이 지워지지 않음 */
var ESS_SIM=(function(){try{return new URLSearchParams(location.search).get('mode')==='sim';}catch(e){return false;}})();
if(ESS_SIM)document.documentElement.classList.add('sim');
function essSimText(h){if(!ESS_SIM)return h;
  return h.replace(/(맞아요|찾았어요|좋아요)[.!]\s*/g,'').replace('<h3>1. 예측하기</h3>','<h3>1. 세 파의 도착 순서</h3>')
    .replace('<h3>예측 확인</h3>','<h3>거리와 PS시</h3>').replace('<th>내가 구한 거리</th>','<th>거리</th>').replace('<h3>3. 지각의 두께 맞히기</h3>','<h3>3. 지각의 두께</h3>');}
</script>
</head>
<body>
<div class="wrap">
<header>
  <div class="modeSw"><span class="now" id="modeNow">탐구 모드</span><a id="modeBtn" href="?mode=sim">시뮬레이션 모드로</a></div>
  <h1>지진파로 지구 속 보기</h1>
  <span class="code">지구시스템과학 [12지시01-05]</span>
  <button class="themebtn" id="themeBtn" aria-label="밝기 바꾸기">밝기</button>
</header>
<nav class="tabs" id="tabs">
  <button data-t="1" class="on">① 세 가지 파</button>
  <button data-t="2">② 진앙 찾기</button>
  <button data-t="3">③ 지구 속</button>
  <button data-t="4">④ 지각의 두께</button>
  <button data-t="5">⑤ 속도 구조</button>
</nav>
<div id="tab1">
  <div class="stage">
    <div class="row"><div class="seg" id="v1Seg"><button data-v="2d">2D</button><button data-v="3d">3D</button></div><div class="seg" id="w1Seg"><button data-w="P">P파</button><button data-w="S">S파</button><button data-w="L">L파</button><button data-w="ALL">차례로 보기</button></div></div>
    <div id="g1"></div>
    <canvas id="tr1"></canvas>
    <div class="tools"><button id="pp1">⏸ 멈춤</button><button id="sp1">느리게</button><div class="seg" id="m1Seg" style="margin-left:auto"><button data-m="solid">고체</button><button data-m="liquid">액체</button></div></div>
    <div class="src"><span class="tag model">모형</span> 흔들림 약 10만 배 과장 · 3D는 끌어서 돌리기 <b id="msg1" style="color:var(--sc)"></b></div>
  </div>
  <main id="cards1"></main>
</div>
<div id="tab2" hidden>
  <div class="stage">
    <div class="row">
      <div class="seg" id="missionSeg">
        <button data-m="gj">미션 1 경주</button><button data-m="th">미션 2 동일본</button>
      </div>
    </div>
    <div class="row" style="margin-top:6px">
      <div class="seg" id="viewSeg">
        <button data-v="wave">파형</button><button data-v="curve">주시 곡선</button><button data-v="map">지도</button>
      </div>
      <span class="tag" id="viewTag"></span>
    </div>
    <canvas id="cv"></canvas>
    <div class="tools" id="tools"></div>
    <div class="src" id="srcLine"></div>
  </div>
  <main id="cards"></main>
</div>
<div id="tab3" hidden>
  <div class="stage">
    <div class="row"><div class="seg" id="v3Seg"><button data-w="S">S파 보기</button><button data-w="P">P파 보기</button></div><span class="tag" id="tag3"></span><button class="btn" id="replay3" hidden style="margin-left:auto;min-height:36px;padding:4px 10px;font-size:14px">▶ 다시 보기</button></div>
    <canvas id="cv3"></canvas>
    <div id="slider3" class="sl" hidden><label for="rcIn">핵 반지름 <b id="rcVal"></b></label><input id="rcIn" type="range" min="1500" max="5500" step="10"></div>
    <div class="src" id="src3"></div>
  </div>
  <main id="cards3"></main>
</div>
<div id="tab4" hidden>
  <div class="stage">
    <div class="row"><span class="tag" id="tag4"></span><span class="muted">지각·맨틀 두 층 모형</span></div>
    <canvas id="cv4"></canvas>
    <div id="slider4" class="sl" hidden><label for="hIn">모호면 깊이 <b id="hVal"></b></label><input id="hIn" type="range" min="10" max="60" step="1"></div>
  </div>
  <main id="cards4"></main>
</div>
<div id="tab5" hidden>
  <div class="stage">
    <div class="row"><div class="seg" id="m5Seg"><button data-m="v">깊이별 속도</button><button data-m="s">단층 촬영</button></div><span class="tag" id="tag5"></span></div>
    <div class="row" style="margin-top:6px"><div class="seg" id="s5Seg"><button data-s="0">한반도·일본</button><button data-s="1">아프리카</button></div><button class="btn" id="z5" style="min-height:36px;padding:4px 10px;font-size:14px"></button></div>
    <canvas id="cv5"></canvas>
    <div class="src" id="src5"></div>
  </div>
  <main id="cards5"></main>
</div>
<div id="tabOther" hidden><main><div class="card soon" id="soonMsg"></div></main></div>
</div>

<script>
/* ===== '실제와 다른 점' 카드 (모든 탭 공용) ===== */
const FIG=(()=>{
  const sv=(b)=>`<svg viewBox="0 0 120 64" class="fig" aria-hidden="true">${b}</svg>`;
  const r=(s=>()=>{s=(s*16807)%2147483647;return s/2147483647;})(7);
  const wave=(noisy)=>{let d='M2 32';for(let x=2;x<=118;x+=1.5){let y=32;if(x>40)y+=Math.sin(x*1.3)*(x>70?18:7)*Math.exp(-(x-(x>70?70:40))/40);if(noisy)y+=(r()-0.5)*(x<40?9:6);d+=` L${x.toFixed(1)} ${y.toFixed(1)}`;}
    return `<path d="${d}" class="ln"/>`+(noisy?'':`<line x1="40" y1="6" x2="40" y2="58" class="p"/><line x1="70" y1="6" x2="70" y2="58" class="s"/>`);};
  const tri=(x,y)=>`<path d="M${x} ${y-5}l4.5 8h-9z" class="st"/>`;
  const star=(x,y)=>`<path d="M${x} ${y-6}l1.8 4 4.2.4-3.2 2.8 1 4.2-3.8-2.3-3.8 2.3 1-4.2-3.2-2.8 4.2-.4z" class="eq"/>`;
  return {
    waveClean:sv(wave(false)),waveNoisy:sv(wave(true)),
    staFew:sv(`<rect x="2" y="2" width="116" height="60" rx="6" class="bg"/>${tri(30,20)}${tri(88,24)}${tri(60,52)}${star(62,32)}`),
    staMany:sv(`<rect x="2" y="2" width="116" height="60" rx="6" class="bg"/>${Array.from({length:26},(_,i)=>tri(10+(i*37)%100,10+((i*23)%46)+4)).join('')}${star(62,32)}`),
    depthSurf:sv(`<rect x="2" y="22" width="116" height="40" class="gr"/><line x1="2" y1="22" x2="118" y2="22" class="ln"/>${star(60,22)}<text x="60" y="12" class="tx">진원 = 진앙</text>`),
    depthDeep:sv(`<rect x="2" y="22" width="116" height="40" class="gr"/><line x1="2" y1="22" x2="118" y2="22" class="ln"/><line x1="60" y1="22" x2="60" y2="46" class="dash"/><circle cx="60" cy="22" r="3" class="pt"/>${star(60,48)}<text x="60" y="12" class="tx">진앙</text><text x="84" y="50" class="tx">진원</text>`),
    layerFlat:sv(`<rect x="2" y="4" width="116" height="18" class="l1"/><rect x="2" y="22" width="116" height="20" class="l2"/><rect x="2" y="42" width="116" height="20" class="l3"/>`),
    layerLumpy:sv(`<rect x="2" y="4" width="116" height="18" class="l1"/><rect x="2" y="22" width="116" height="20" class="l2"/><rect x="2" y="42" width="116" height="20" class="l3"/><ellipse cx="30" cy="34" rx="14" ry="7" class="hot"/><ellipse cx="84" cy="30" rx="18" ry="6" class="cold"/><ellipse cx="62" cy="52" rx="12" ry="7" class="hot"/>`),
    edgeSharp:sv(`<rect x="4" y="22" width="56" height="16" class="on"/><rect x="60" y="22" width="56" height="16" class="off"/><line x1="60" y1="14" x2="60" y2="46" class="ln"/><text x="60" y="58" class="tx">103°</text>`),
    edgeFuzzy:sv(`<defs><linearGradient id="gfz"><stop offset="0.35" class="g1"/><stop offset="0.7" class="g2"/></linearGradient></defs><rect x="4" y="22" width="112" height="16" fill="url(#gfz)"/><text x="40" y="58" class="tx">99°</text><text x="88" y="58" class="tx">흐릿함</text>`),
    pathFew:sv(`<circle cx="60" cy="70" r="62" class="gr"/>${[-44,-22,22,44].map(a=>`<path d="M60 8 Q${60+a*0.5} 58 ${60+a} ${(70-Math.sqrt(3844-a*a)).toFixed(1)}" class="ry"/>`).join('')}`),
    pathMany:sv(`<circle cx="60" cy="70" r="62" class="gr"/>${Array.from({length:14},(_,i)=>{const a=-52+i*8;return `<path d="M60 8 Q${60+a*0.5} ${50+(i%3)*6} ${60+a} ${(70-Math.sqrt(3844-a*a)).toFixed(1)}" class="ry"/>`;}).join('')}<path d="M60 8 L44 46 L24 ${(70-Math.sqrt(3844-1296)).toFixed(1)}" class="ry2"/><path d="M60 8 L78 50 L100 ${(70-Math.sqrt(3844-1600)).toFixed(1)}" class="ry2"/>`),

const CFG={

const blank=()=>({sel:0,stn:[0,1,2].map(()=>({pm:null,sm:null,ps:'',psOk:false,dist:'',distOk:false,fb:null,fb2:null})),

function simM(k){const m=blank();m.stn=m.stn.map((_,i)=>{const t=trueArr(k,i),ps=+(t.s-t.p).toFixed(k==='th'?0:1);
  return {pm:+t.p.toFixed(2),sm:+t.s.toFixed(2),ps:String(ps),psOk:true,dist:String(Math.round(distFromPS(k,ps))),distOk:true,fb:null,fb2:null};});

/* ---------- 주시 곡선 ---------- */
function psCurve(k){ // [[ps, distKm]]
  return D.tt[k].map(r=>[r[2]-r[1], k==='gj'?r[0]:r[0]*KM_PER_DEG]);
}
function distFromPS(k,ps){
  const c=[[0,0],...psCurve(k)];
  for(let i=1;i<c.length;i++){ if(ps<=c[i][0]){const a=c[i-1],b=c[i];return a[1]+(b[1]-a[1])*(ps-a[0])/(b[0]-a[0]);}}
  return c[c.length-1][1];
}
function trueArr(k,i){const s=D.st[k][i],o=OFF[k][i];return {p:s.p+o.p,s:s.s+o.s};}

/* ---------- 모형 파형 합성 ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const traceCache={};
function trace(k,i){
  const key=k+i; if(traceCache[key])return traceCache[key];
  const c=CFG[k],a=trueArr(k,i),st=D.st[k][i],R=rng(1000+i*77+(k==='th'?5:0));
  const N=Math.round(c.t1/c.dt),y=new Float32Array(N);
  const g=k==='th';
  const fP=g?[0.7,1.0,1.4]:[5,7,9], fS=g?[0.18,0.25,0.33]:[1.8,2.6,3.4], tauP=g?60:5, tauS=g?120:10;
  const ph=()=>R()*6.283;
  const pP=fP.map(ph),pS=fS.map(ph);
  const tL=g?st.km/3.9:null, fL=[0.05,0.065], pL=fL.map(ph);
  let n=0;
  for(let j=0;j<N;j++){
    const t=j*c.dt; n=0.85*n+0.15*(R()*2-1); let v=n*0.25;
    if(t>a.p){const u=t-a.p;const e=0.28*(1-Math.exp(-u/(g?1.5:0.08)))*(Math.exp(-u/tauP)*0.8+0.2);
      v+=e*(Math.sin(6.283*fP[0]*u+pP[0])+0.6*Math.sin(6.283*fP[1]*u+pP[1])+0.4*Math.sin(6.283*fP[2]*u+pP[2]))/2;}
    if(t>a.s){const u=t-a.s;const e=1.0*(1-Math.exp(-u/(g?4:0.2)))*(Math.exp(-u/tauS)*0.75+0.25);
      v+=e*(Math.sin(6.283*fS[0]*u+pS[0])+0.7*Math.sin(6.283*fS[1]*u+pS[1])+0.4*Math.sin(6.283*fS[2]*u+pS[2]))/2;}
    if(g&&t>tL){const u=t-tL;const e=1.5*(1-Math.exp(-u/30))*Math.exp(-u/260);
      v+=e*(Math.sin(6.283*fL[0]*u+pL[0])+0.6*Math.sin(6.283*fL[1]*u+pL[1]))/1.6;}
    y[j]=v;
  }
  let mx=0;for(const v of y)mx=Math.max(mx,Math.abs(v));for(let j=0;j<N;j++)y[j]/=mx;
  return traceCache[key]=y;
}

/* ---------- 캔버스 ---------- */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0;
function fit(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);draw();}
window.addEventListener('resize',fit);
const view={wave:{gj:null,th:null},map:{gj:null,th:null}};
function waveWin(){const k=S.mission;if(!view.wave[k])view.wave[k]={t0:0,t1:CFG[k].t1};return view.wave[k];}
function fitView(k){const L=D.st[k].map(s=>[k==='th'&&s.lon<0?s.lon+360:s.lon,s.lat]);
  const lo=L.map(p=>p[0]),la=L.map(p=>p[1]),lonc=(Math.min(...lo)+Math.max(...lo))/2,latc=(Math.min(...la)+Math.max(...la))/2;
  const span=Math.max(Math.max(...la)-Math.min(...la),(Math.max(...lo)-Math.min(...lo))*Math.cos(latc*Math.PI/180))*1.35;return {lonc,latc,span};}
function mapView(){const k=S.mission;if(!view.map[k])view.map[k]=fitView(k);return view.map[k];}
let activeMark='p';

function niceStep(range,px,minPx){const raw=range*minPx/px,p=Math.pow(10,Math.floor(Math.log10(raw)));for(const m of [1,2,5,10]){if(m*p>=raw)return m*p;}return 10*p;}
function fmtT(t,k){return k==='th'?t.toFixed(0):t.toFixed(1);}
function txt(s,x,y,col,size,align,weight,halo){ctx.font=`${weight||600} ${size||13}px "IBM Plex Sans KR",sans-serif`;ctx.textAlign=align||'left';ctx.textBaseline='middle';
  if(halo){ctx.lineWidth=4;ctx.strokeStyle=css('--card');ctx.lineJoin='round';ctx.strokeText(s,x,y);}ctx.fillStyle=col;ctx.fillText(s,x,y);}

function lab(s,x,y,col,size,weight){ctx.font=`${weight||700} ${size||13}px "IBM Plex Sans KR",sans-serif`;const w=ctx.measureText(s).width;
  if(x+w>W-4)txt(s,x-20-w,y,col,size,'left',weight||700,true);else txt(s,x,y,col,size,'left',weight||700,true);}
function drawWave(){
  const k=S.mission,m=M(),i=m.sel,st=m.stn[i],win=waveWin(),c=CFG[k];
  const L=8,R=W-8,T=34,B=H-40,X=t=>L+(t-win.t0)/(win.t1-win.t0)*(R-L);
  // grid
  const step=niceStep(win.t1-win.t0,R-L,60),minor=step/5;
  ctx.strokeStyle=css('--grid');ctx.lineWidth=1;
  for(let t=Math.ceil(win.t0/minor)*minor;t<=win.t1;t+=minor){const x=X(t);ctx.beginPath();ctx.moveTo(x,T);ctx.lineTo(x,B);ctx.stroke();}
  ctx.strokeStyle=css('--grid2');
  for(let t=Math.ceil(win.t0/step)*step;t<=win.t1+1e-9;t+=step){const x=X(t);ctx.beginPath();ctx.moveTo(x,T);ctx.lineTo(x,B+4);ctx.stroke();txt(fmtT(t,k).replace(/\.0$/,''),x,B+14,css('--sub'),13,'center',600);}
  txt('지진 발생 후 시간(초)',R,H-8,css('--sub'),12,'right',400);
  // trace (min/max per px)
  const y=trace(k,i),mid=(T+B)/2,amp=(B-T)/2*0.92;
  ctx.strokeStyle=css('--trace');ctx.lineWidth=1;ctx.beginPath();
  for(let px=Math.floor(L);px<R;px++){
    const ta=win.t0+(px-L)/(R-L)*(win.t1-win.t0),tb=win.t0+(px+1-L)/(R-L)*(win.t1-win.t0);
    let ja=Math.max(0,Math.floor(ta/c.dt)),jb=Math.min(y.length-1,Math.ceil(tb/c.dt));let lo=1,hi=-1;
    for(let j=ja;j<=jb;j++){if(y[j]<lo)lo=y[j];if(y[j]>hi)hi=y[j];}
    if(hi<lo)continue;ctx.moveTo(px+0.5,mid-hi*amp);ctx.lineTo(px+0.5,mid-lo*amp+0.5);
  }
  ctx.stroke();
  txt(D.st[k][i].n+' 관측소',R,T-18,css('--ink'),14,'right',700,true);
  // markers
  for(const w of ['p','s']){
    const t=w==='p'?st.pm:st.sm;if(t==null)continue;const x=X(t);if(x<L-2||x>R+2)continue;
    const col=css(w==='p'?'--pc':'--sc');
    ctx.strokeStyle=col;ctx.lineWidth=activeMark===w?3:2;ctx.setLineDash(w==='s'?[7,5]:[]);
    ctx.beginPath();ctx.moveTo(x,T-6);ctx.lineTo(x,B);ctx.stroke();ctx.setLineDash([]);
    // handle
    ctx.fillStyle=col;const hw=26,hh=24;ctx.beginPath();ctx.roundRect(x-hw/2,T-30,hw,hh,6);ctx.fill();
    txt(w.toUpperCase(),x,T-18,css('--card'),15,'center',700);
  }
}

function drawCurve(){
  const k=S.mission,m=M(),c=CFG[k],st=m.stn[m.sel];
  const L=58,R=W-12,T=14,B=H-38;
  const X=v=>L+v/c.psMax*(R-L),Y=d=>B-d/c.dMax*(B-T);
  ctx.strokeStyle=css('--grid');ctx.lineWidth=1;
  for(let d=0;d<=c.dMax;d+=c.dStep){ctx.beginPath();ctx.moveTo(L,Y(d));ctx.lineTo(R,Y(d));ctx.stroke();}
  for(let v=0;v<=c.psMax;v+=c.psStep){ctx.beginPath();ctx.moveTo(X(v),T);ctx.lineTo(X(v),B);ctx.stroke();}
  ctx.strokeStyle=css('--grid2');
  for(let d=0;d<=c.dMax;d+=c.dLab){ctx.beginPath();ctx.moveTo(L-4,Y(d));ctx.lineTo(R,Y(d));ctx.stroke();txt(String(d),L-6,Y(d),css('--sub'),13,'right',600);}
  for(let v=0;v<=c.psMax;v+=c.psLab){ctx.beginPath();ctx.moveTo(X(v),T);ctx.lineTo(X(v),B+4);ctx.stroke();txt(String(v),X(v),B+14,css('--sub'),13,'center',600);}
  txt('PS시(초)',R,H-8,css('--sub'),12,'right',400);
  ctx.save();ctx.translate(12,(T+B)/2);ctx.rotate(-Math.PI/2);txt('진앙 거리(km)',0,0,css('--sub'),12,'center',400);ctx.restore();
  // curve
  const pts=[[0,0],...psCurve(k)].filter(p=>p[1]<=c.dMax*1.01);
  ctx.strokeStyle=css('--accent');ctx.lineWidth=3;ctx.beginPath();pts.forEach((p,j)=>j?ctx.lineTo(X(p[0]),Y(p[1])):ctx.moveTo(X(p[0]),Y(p[1])));ctx.stroke();
  // ruler at student's PS
  const ps=parseFloat(st.ps);
  if(st.psOk&&isFinite(ps)){
    const d=distFromPS(k,ps),x=X(ps),y=Y(d),col=css(STC[m.sel]);
    ctx.strokeStyle=col;ctx.lineWidth=2;ctx.setLineDash([6,4]);
    ctx.beginPath();ctx.moveTo(x,B);ctx.lineTo(x,y);ctx.lineTo(L,y);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fill();
    lab(D.st[k][m.sel].n.replace(/\(.+\)/,'')+' PS시 '+ps+'초',x+6,B-12,col,13);
  }
}

/* --- 지도 --- */
function proj(){const v=mapView(),k=S.mission;const cl=Math.cos(v.latc*Math.PI/180);const sc=Math.min(W,H)/v.span;
  return {f:(lon,lat)=>{if(k==='th'){while(lon<v.lonc-180)lon+=360;while(lon>v.lonc+180)lon-=360;}return [W/2+(lon-v.lonc)*cl*sc,H/2-(lat-v.latc)*sc];},
          inv:(x,y)=>[v.lonc+(x-W/2)/(cl*sc),v.latc-(y-H/2)/sc]};}
function dest(lat,lon,brg,dkm){const r=Math.PI/180,d=dkm/6371,p1=lat*r,l1=lon*r,t=brg*r;
  const p2=Math.asin(Math.sin(p1)*Math.cos(d)+Math.cos(p1)*Math.sin(d)*Math.cos(t));
  const l2=l1+Math.atan2(Math.sin(t)*Math.sin(d)*Math.cos(p1),Math.cos(d)-Math.sin(p1)*Math.sin(p2));return [l2/r,p2/r];}
function hav(a,b,c,d){const r=Math.PI/180;const x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 2*6371*Math.asin(Math.sqrt(x));}
function drawMap(){
  const k=S.mission,m=M(),P=proj();
  ctx.fillStyle=css('--sea');ctx.fillRect(0,0,W,H);
  ctx.fillStyle=css('--land');ctx.strokeStyle=css('--landline');ctx.lineWidth=0.8;
  for(const poly of D.land[k]){ctx.beginPath();poly.forEach((p,j)=>{const q=P.f(p[0],p[1]);j?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]);});ctx.closePath();ctx.fill();ctx.stroke();}
  // circles
  D.st[k].forEach((s,i)=>{const st=m.stn[i];if(!st.distOk)return;const dk=parseFloat(st.dist),col=css(STC[i]);
    ctx.beginPath();let prev=null;
    for(let b=0;b<=360;b+=2){const g=dest(s.lat,s.lon,b,dk),q=P.f(g[0],g[1]);
      if(prev&&Math.abs(q[0]-prev[0])>W*0.6)ctx.moveTo(q[0],q[1]);else if(b)ctx.lineTo(q[0],q[1]);else ctx.moveTo(q[0],q[1]);prev=q;}
    ctx.globalAlpha=0.1;ctx.fillStyle=col;ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.stroke();});
  // stations
  D.st[k].forEach((s,i)=>{const q=P.f(s.lon,s.lat),col=css(STC[i]);
    ctx.fillStyle=col;ctx.strokeStyle=css('--card');ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(q[0],q[1]-9);ctx.lineTo(q[0]+8,q[1]+6);ctx.lineTo(q[0]-8,q[1]+6);ctx.closePath();ctx.fill();ctx.stroke();
    const st=m.stn[i];lab(s.n.replace(/\(.+\)/,'')+(st.distOk?' '+Math.round(parseFloat(st.dist))+' km':''),q[0]+10,q[1]+16,col,13);});
  if(m.guess){const q=P.f(m.guess[0],m.guess[1]);ctx.strokeStyle=css('--ink');ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(q[0]-8,q[1]-8);ctx.lineTo(q[0]+8,q[1]+8);ctx.moveTo(q[0]+8,q[1]-8);ctx.lineTo(q[0]-8,q[1]+8);ctx.stroke();
    lab('내가 찾은 진앙',q[0]+11,q[1]-14,css('--ink'),13);}
  if(m.revealed){const e=D.ev[k],q=P.f(e.lon,e.lat);ctx.fillStyle=css('--sc');ctx.strokeStyle=css('--card');ctx.lineWidth=2;
    ctx.beginPath();for(let j=0;j<10;j++){const r=j%2?5:12,a=-Math.PI/2+j*Math.PI/5;ctx.lineTo(q[0]+r*Math.cos(a),q[1]+r*Math.sin(a));}ctx.closePath();ctx.fill();ctx.stroke();
    lab('발표된 진앙',q[0]+14,q[1]-30,css('--sc'),13);}
  // scale bar
  const v=mapView(),cl=Math.cos(v.latc*Math.PI/180),sc=Math.min(W,H)/v.span,kmpx=KM_PER_DEG/sc;
  const bar=niceStep(kmpx*90,90,90),bl=bar/kmpx;
  ctx.fillStyle=css('--ink');ctx.fillRect(12,H-16,bl,4);txt(bar+' km',12+bl+6,H-14,css('--ink'),12,'left',600,true);
  if(k==='th')txt('지도의 원은 둥근 지구 위에서 그린 원이라 찌그러져 보입니다',W-8,12,css('--sub'),11,'right',400,true);
}

function draw(){if(!W)return;ctx.clearRect(0,0,W,H);const v=M().view;if(v==='wave')drawWave();else if(v==='curve')drawCurve();else drawMap();}

/* ---------- 포인터 ---------- */
let drag=null;
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,v=M().view;cv.setPointerCapture(e.pointerId);
  if(v==='wave'){const st=M().stn[M().sel],win=waveWin(),X=t=>8+(t-win.t0)/(win.t1-win.t0)*(W-16);
    let best=null,bd=24;for(const w of ['p','s']){const t=w==='p'?st.pm:st.sm;if(t==null)continue;const d=Math.abs(X(t)-x);if(d<bd){bd=d;best=w;}}
    if(best){activeMark=best;drag={type:'mark',w:best};renderTools();}else drag={type:'pan',x0:x,t0:win.t0,t1:win.t1};}
  else if(v==='map'){const mv=mapView();drag={type:'map',x0:x,y0:y,lonc:mv.lonc,latc:mv.latc,moved:false};}
  draw();});
cv.addEventListener('pointermove',e=>{if(!drag)return;const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  if(drag.type==='mark'){const win=waveWin(),t=win.t0+(x-8)/(W-16)*(win.t1-win.t0),st=M().stn[M().sel];
    const tt=Math.max(0,Math.min(CFG[S.mission].t1,t));if(drag.w==='p')st.pm=+tt.toFixed(2);else st.sm=+tt.toFixed(2);st.fb=null;updateReadout();}
  else if(drag.type==='pan'){const win=waveWin(),span=drag.t1-drag.t0,dt=(x-drag.x0)/(W-16)*span;let a=drag.t0-dt;a=Math.max(0,Math.min(CFG[S.mission].t1-span,a));win.t0=a;win.t1=a+span;}
  else if(drag.type==='map'){if(Math.hypot(x-drag.x0,y-drag.y0)>6)drag.moved=true;if(drag.moved){const mv=mapView(),cl=Math.cos(mv.latc*Math.PI/180),sc=Math.min(W,H)/mv.span;
    mv.lonc=drag.lonc-(x-drag.x0)/(cl*sc);mv.latc=drag.latc+(y-drag.y0)/sc;}}
  draw();});
cv.addEventListener('pointerup',e=>{if(drag&&drag.type==='map'&&!drag.moved){const m=M();
    if(allCircles()&&m.q3&&!m.revealed){const r=cv.getBoundingClientRect();const g=proj().inv(e.clientX-r.left,e.clientY-r.top);
      if(S.mission==='th'){while(g[0]>180)g[0]-=360;}m.guess=g;save();renderCards();}}
  if(drag&&drag.type==='mark')save();drag=null;draw();});

/* ---------- 도구줄 ---------- */
function zoomWave(f){const win=waveWin(),c=CFG[S.mission],st=M().stn[M().sel];const ctr=(activeMark==='p'?st.pm:st.sm)??(win.t0+win.t1)/2;
  let span=Math.max(c.t1/60,Math.min(c.t1,(win.t1-win.t0)*f));let a=ctr-span/2;a=Math.max(0,Math.min(c.t1-span,a));win.t0=a;win.t1=a+span;draw();}
function zoomMap(f){const v=mapView();const b=fitView(S.mission).span;v.span=Math.max(b/15,Math.min(b*2,v.span*f));draw();}
function nudge(d){const st=M().stn[M().sel],c=CFG[S.mission];if(activeMark==='p')st.pm=+((st.pm||0)+d*c.nudge).toFixed(2);else st.sm=+((st.sm||0)+d*c.nudge).toFixed(2);st.fb=null;updateReadout();save();draw();}
function renderTools(){
  const v=M().view,t=document.getElementById('tools'),tag=document.getElementById('viewTag'),src=document.getElementById('srcLine'),k=S.mission;
  if(v==='wave'){
    t.innerHTML=`<button data-a="mp" class="${activeMark==='p'?'sel':''}" style="color:var(--pc)">P 선 고르기</button><button data-a="ms" class="${activeMark==='s'?'sel':''}" style="color:var(--sc)">S 선 고르기</button>
      <button data-a="nl" aria-label="왼쪽으로 조금">◀</button><button data-a="nr" aria-label="오른쪽으로 조금">▶</button>
      <button data-a="zi" aria-label="확대">＋</button><button data-a="zo" aria-label="축소">－</button><button data-a="za">전체</button>`;
    tag.className='tag model';tag.textContent='모형 파형';
    src.textContent='손잡이(P·S)를 끌어 도착 시각에 맞추세요. 빈 곳을 끌면 옆으로 움직입니다. ◀ ▶는 '+CFG[k].nudge+'초씩 움직입니다.';
  }else if(v==='curve'){t.innerHTML='';tag.className='tag real';tag.textContent='계산값';
    src.textContent='표준 지구 모형 iasp91로 계산(obspy.taup), 진원 깊이 0 km로 단순화';}
  else{t.innerHTML=`<button data-a="mi" aria-label="확대">＋</button><button data-a="mo" aria-label="축소">－</button><button data-a="mr">처음 위치</button>`;
    tag.className='tag real';tag.textContent='실제 위치';
    src.textContent='해안선: Natural Earth · 관측소 위치는 대략값 · '+(allCircles()?'지도를 눌러 진앙을 찍을 수 있어요':'끌어서 지도를 옮길 수 있어요');}
}
document.getElementById('tools').addEventListener('click',e=>{const a=e.target.closest('button')?.dataset.a;if(!a)return;
  ({mp:()=>{activeMark='p';},ms:()=>{activeMark='s';},nl:()=>nudge(-1),nr:()=>nudge(1),zi:()=>zoomWave(0.5),zo:()=>zoomWave(2),za:()=>{view.wave[S.mission]=null;},
    mi:()=>zoomMap(0.6),mo:()=>zoomMap(1/0.6),mr:()=>{view.map[S.mission]=null;}})[a]();renderTools();draw();});

/* ---------- 카드 ---------- */
const allCircles=()=>M().stn.every(s=>s.distOk);
function setView(v){M().view=v;save();syncSeg();renderTools();draw();}
function syncSeg(){document.querySelectorAll('#missionSeg button').forEach(b=>b.classList.toggle('on',b.dataset.m===S.mission));
  document.querySelectorAll('#viewSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===M().view));}
function fb(o){return o?`<div class="fb ${o.c}">${o.t}</div>`:'';}
function updateReadout(){const st=M().stn[M().sel],k=S.mission;
  const p=document.getElementById('rp'),s=document.getElementById('rs');
  if(p)p.textContent=st.pm==null?'—':fmtT(st.pm,k)+'초';if(s)s.textContent=st.sm==null?'—':fmtT(st.sm,k)+'초';
  const f=document.getElementById('fb1');if(f&&!st.fb)f.innerHTML='';}
function minSec(t){const m=Math.floor(t/60),s=Math.round(t-m*60);return m?`약 ${m}분 ${s}초`:`약 ${s}초`;}

function renderCards(){
  const k=S.mission,m=M(),c=CFG[k],i=m.sel,st=m.stn[i],sn=D.st[k],ev=D.ev[k];
  // 처음 고르면 손잡이를 기록 앞쪽에 둔다
  if(st.pm==null){const w=waveWin();st.pm=+(w.t0+(w.t1-w.t0)*0.06).toFixed(2);st.sm=+(w.t0+(w.t1-w.t0)*0.12).toFixed(2);}
  let h='';
  if(k==='gj'){
    h+=`<div class="card"><h3>미션 1 · ${ev.name}</h3><p>${ev.date}, 규모 ${ev.mag}. 세 관측소의 기록만으로 <span class="term">진앙</span>(진원 바로 위 땅 위의 점)을 찾아봅시다.</p>
      <p class="muted"><span class="term">진원</span>은 땅속에서 지진이 처음 시작된 곳입니다.</p></div>`;
    if(!ESS_SIM)h+=`<div class="card"><h3>먼저 예측하기</h3><p>진앙에서 <b>먼</b> 관측소일수록 <span class="term">PS시</span>(P파와 S파의 도착 시간 차이)는 어떻게 될까요?</p>
      <div class="opts" data-q="pred">${['길어진다','같다','짧아진다'].map(o=>`<button class="${m.pred===o?'picked':''}" data-v="${o}">${o}</button>`).join('')}</div>
      ${m.pred?'<p class="muted">예측을 기록했어요. 세 관측소를 모두 읽은 뒤 확인합니다.</p>':''}</div>`;
  }else{
    h+=`<div class="card"><h3>미션 2 · ${ev.name}</h3><p>${ev.date}, 규모 ${ev.mag}. 이번에는 수천 km 떨어진 관측소 기록입니다. 같은 방법으로 진앙을 찾아봅시다.</p>
      <p class="muted">시간이 길어서 초 단위 숫자가 큽니다. 확대(＋)해서 읽으세요.</p></div>`;
  }
  // station chips
  h+=`<div class="card"><h3>관측소 고르기</h3><div class="chips">${sn.map((s,j)=>{const t=m.stn[j];const mark=t.distOk?'✓ 원':t.psOk?'✓ PS시':'';
      return `<button class="chip ${j===i?'on':''}" data-st="${j}"><span class="dot" style="background:var(${STC[j]})"></span>${s.n.replace(/\(.+\)/,'')} ${mark}</button>`;}).join('')}</div>`;
  // step 1: read
  h+=`<h3 style="margin-top:10px">① 파형 읽기</h3>
    <p><span class="term" style="color:var(--pc)">P파</span>는 먼저 도착하는 파, <span class="term" style="color:var(--sc)">S파</span>는 뒤이어 도착하는 파입니다. 파형에서 두 파가 <b>도착하기 시작한 곳</b>에 손잡이를 맞추세요.</p>
    <div class="read"><div><span class="lab">P파 도착 시각</span><b id="rp" style="color:var(--pc)"></b></div><div><span class="lab">S파 도착 시각</span><b id="rs" style="color:var(--sc)"></b></div></div>
    <p>PS시를 계산해 적으세요.</p>
    <div class="inp"><span>PS시</span><input id="psIn" type="number" inputmode="decimal" step="any" placeholder="숫자" value="${st.ps}" ${st.psOk?'disabled':''}><span>초</span>
    ${st.psOk?'':'<button class="btn primary" data-a="chkps">확인</button>'}</div>
    <div id="fb1">${fb(st.fb)}</div>`;
  if(st.psOk){
    h+=`<h3 style="margin-top:14px">② 주시 곡선으로 거리 구하기</h3>
      <p><span class="term">주시 곡선</span>은 진앙 거리에 따라 PS시가 얼마인지 나타낸 그래프입니다. 위 화면의 <b>[주시 곡선]</b>에서 내 PS시의 점선을 따라 왼쪽 눈금(거리)을 읽으세요.</p>
      ${m.view!=='curve'&&!st.distOk?'<button class="btn" data-a="gocurve">주시 곡선 보기</button>':''}
      <div class="inp"><span>거리</span><input id="dIn" placeholder="숫자" type="number" inputmode="decimal" step="any" value="${st.dist}" ${st.distOk?'disabled':''}><span>km</span>
      ${st.distOk?'':'<button class="btn primary" data-a="chkd">확인</button>'}</div>${fb(st.fb2)}`;
  }
  if(st.distOk){const nxt=m.stn.findIndex(s=>!s.distOk);
    h+=`<div class="fb ok">지도에 ${sn[i].n.replace(/\(.+\)/,'')}을(를) 중심으로 반지름 ${st.dist} km인 원을 그렸어요.</div>

  h+=`</div>`;

  const nDone=m.stn.filter(s=>s.distOk).length;
  if(k==='gj'&&nDone>=1){
    h+=`<div class="card"><h3>생각하기</h3><p>원이 하나뿐일 때, 진앙을 한 곳으로 정할 수 있을까요?</p>
      <div class="opts" data-q="q1">${['정할 수 있다','정할 수 없다'].map(o=>`<button class="${m.q1===o?'picked':''}" data-v="${o}">${o}</button>`).join('')}</div>
      ${m.q1==='정할 수 없다'?fb({c:'ok',t:'맞아요. 관측소 하나로는 <b>거리</b>만 알고 <b>방향</b>은 모릅니다. 원 위의 모든 점이 진앙 후보예요. 그래서 관측소가 더 필요합니다.'}):
        m.q1?fb({c:'hint',t:'지도의 원을 보세요. 원 위의 점은 모두 관측소에서 같은 거리입니다. 그중 어느 점이 진앙인지 고를 수 있나요?'}):''}</div>`;
  }
  if(nDone===2)h+=`<div class="card">${fb({c:'note',t:'원이 두 개면 후보가 두 곳(두 원이 만나는 점)으로 줄어듭니다. 하나로 정하려면 원이 하나 더 필요해요.'})}</div>`;
  if(nDone===3){
    h+=`<div class="card"><h3>세 원 살펴보기</h3><p>지도를 확대해 보세요. 세 원이 <b>정확히 한 점</b>에서 만나나요?</p>
      <div class="opts" data-q="q3">${['정확히 한 점에서 만난다','한 점에서 만나지 않고 작은 영역이 생긴다'].map(o=>`<button class="${m.q3===o?'picked':''}" data-v="${o}">${o}</button>`).join('')}</div>`;
    if(m.q3&&m.q3.startsWith('정확히'))h+=fb({c:'hint',t:'지도에서 [＋]로 세 원이 겹치는 곳을 크게 보세요. 세 원의 선이 한 점을 지나나요?'});
    if(m.q3&&m.q3.startsWith('한 점')){
      h+=fb({c:'ok',t:'맞아요. 파형을 읽을 때 생기는 오차, 실제 지구 속이 곳곳마다 조금씩 다른 점 때문에 세 원은 보통 한 점에서 만나지 않습니다. 진앙은 <b>세 원이 겹치는 작은 영역 안</b>에 있다고 판단합니다.'});
      h+=ESS_SIM?`<p class="muted" style="margin-top:10px">지도에 발표된 진앙(${ev.src})을 함께 표시했어요.</p>`:`<p style="margin-top:10px"><b>지도에서 진앙이라고 생각하는 곳을 눌러 표시하세요.</b></p>`;
      if(m.guess&&!m.revealed)h+=`<button class="btn primary" data-a="reveal">발표된 진앙과 비교하기</button>`;
      if(m.revealed&&m.guess){const err=hav(m.guess[1],m.guess[0],ev.lat,ev.lon);
        h+=fb({c:err<(k==='gj'?20:300)?'ok':'note',t:`내가 찾은 진앙과 발표된 진앙(${ev.src})의 거리: <b>약 ${err<100?err.toFixed(0):Math.round(err/10)*10} km</b>. `+
          (err<(k==='gj'?20:300)?'관측소 세 곳만으로 이만큼 가깝게 찾았어요!':'세 원이 겹치는 영역 안을 다시 살펴보세요. 거리 읽기를 다시 해 보아도 좋아요.')});
        h+=`<button class="btn" data-a="reguess" style="margin-top:6px">다시 찍기</button>`;}
    }
    h+=`</div>`;
    if(k==='gj'){
      const rows=sn.map((s,j)=>({n:s.n,ps:parseFloat(m.stn[j].ps),d:parseFloat(m.stn[j].dist)})).sort((a,b)=>a.d-b.d);
      h+=`<div class="card"><h3>예측 확인</h3><table class="res"><tr><th>관측소</th><th>내가 구한 거리</th><th>PS시</th></tr>${rows.map(r=>`<tr><td>${r.n}</td><td>${r.d} km</td><td>${r.ps}초</td></tr>`).join('')}</table>
        ${ESS_SIM?'':`<p>내 예측: <b>${m.pred||'(예측 안 함)'}</b></p>`}
        ${fb({c:'ok',t:'먼 관측소일수록 PS시가 <b>길어집니다</b>. P파가 S파보다 빠르기 때문에, 멀리 갈수록 두 파의 간격이 점점 벌어집니다. 달리기에서 빠른 선수와 느린 선수의 차이가 거리가 길수록 커지는 것과 같아요.'})}</div>`;
    }else{
      h+=`<div class="card"><h3>곡선 비교하기</h3><p>[주시 곡선]을 다시 보세요. 미션 1(수백 km)의 곡선은 거의 곧았습니다. 미션 2(수천 km)의 곡선은 어떤가요?</p>
        <div class="opts" data-q="qc">${['곧은 직선이다','휘어 있다'].map(o=>`<button class="${m.qc===o?'picked':''}" data-v="${o}">${o}</button>`).join('')}</div>
        ${m.qc==='휘어 있다'?fb({c:'ok',t:'맞아요. 지구 속은 깊을수록 지진파가 빠릅니다. 멀리 가는 파는 깊고 빠른 곳을 지나 오기 때문에, 거리가 멀수록 PS시가 덜 늘어나 곡선이 휩니다. 그래서 주시 곡선을 <b>직선으로 늘려 읽으면</b> 거리가 틀립니다.'}):
          m.qc?fb({c:'hint',t:'곡선의 왼쪽 아래 끝과 오른쪽 위 끝을 자로 이어 보세요. 곡선이 그 직선 위에 그대로 놓이나요?'}):''}</div>`;
    }
  }
  if(k==='gj'&&nDone===3&&m.revealed&&S.th.stn.every(s=>!s.distOk))h+=`<button class="btn primary" data-a="m2" style="width:100%;margin-bottom:12px">미션 2 동일본 대지진으로 가기</button>`;
  // 모형 안내
  h+=diffHTML(DIFF2);
  document.getElementById('cards').innerHTML=essSimText(h);updateReadout();renderTools();
}

document.getElementById('cards').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const k=S.mission,m=M(),c=CFG[k];
  if(b.dataset.st!=null){m.sel=+b.dataset.st;if(!m.stn[m.sel].psOk)setView('wave');else if(!m.stn[m.sel].distOk)setView('curve');renderCards();draw();return;}
  const q=b.parentElement.dataset.q;if(q){m[q]=b.dataset.v;save();renderCards();if(q==='q3'&&b.dataset.v.startsWith('한 점'))setView('map');return;}
  const a=b.dataset.a,st=m.stn[m.sel],ta=trueArr(k,m.sel);
  if(a==='chkps'){const v=parseFloat(document.getElementById('psIn').value);st.ps=isFinite(v)?String(v):'';
    if(Math.abs(st.pm-ta.p)>c.tolP)st.fb={c:'hint',t:'<b>P 선</b>을 다시 보세요. 잔잔하던 기록이 <b>처음으로</b> 흔들리기 시작하는 곳이 P파 도착입니다. ＋로 확대하면 잘 보여요.'};
    else if(Math.abs(st.sm-ta.s)>c.tolS)st.fb={c:'hint',t:'<b>S 선</b>을 다시 보세요. P파가 온 뒤, 흔들림이 <b>갑자기 훨씬 커지는</b> 곳이 S파 도착입니다.'};
    else if(!isFinite(v))st.fb={c:'hint',t:'PS시를 숫자로 적어 주세요.'};
    else if(Math.abs(v-(st.sm-st.pm))>c.tolPS)st.fb={c:'hint',t:'S파 도착 시각에서 P파 도착 시각을 빼 보세요.'};
    else{st.psOk=true;st.fb={c:'ok',t:`좋아요! PS시 ${v}초`+(k==='th'?` (${minSec(v)})`:'')+'.'};setView('curve');}
    save();renderCards();}
  else if(a==='gocurve')setView('curve'),renderCards();
  else if(a==='chkd'){const v=parseFloat(document.getElementById('dIn').value),exp=distFromPS(k,parseFloat(st.ps));st.dist=isFinite(v)?String(v):'';
    const tol=k==='gj'?Math.max(6,exp*0.04):Math.max(200,exp*0.06);
    if(!isFinite(v))st.fb2={c:'hint',t:'거리를 숫자로 적어 주세요.'};
    else if(Math.abs(v-exp)>tol)st.fb2={c:'hint',t:'점선이 곡선과 만나는 점에서 <b>왼쪽 눈금</b>으로 수평선을 따라가 읽어 보세요. 가는 눈금 한 칸은 '+c.dStep+' km입니다.'};
    else{st.distOk=true;st.fb2=null;setView('map');}
    save();renderCards();}
  else if(a==='reveal'){m.revealed=true;save();renderCards();draw();}
  else if(a==='reguess'){m.guess=null;m.revealed=false;save();renderCards();draw();}
  else if(a==='m2'){S.mission='th';save();syncSeg();renderCards();draw();window.scrollTo(0,0);}
});
document.getElementById('missionSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.mission=b.dataset.m;save();syncSeg();renderCards();draw();});
document.getElementById('viewSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;setView(b.dataset.v);renderCards();});
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));const t=b.dataset.t,have=['1','2','3','4','5'];
  for(const k of have)document.getElementById('tab'+k).hidden=t!==k;document.getElementById('tabOther').hidden=have.includes(t);
  document.getElementById('soonMsg').textContent=b.textContent+' 탭은 다음 단계에서 만듭니다.';
  if(t==='1')T1.show();if(t==='2')fit();if(t==='3')T3.show();if(t==='4')T4.show();if(t==='5')T5.show();window.scrollTo(0,0);});
document.getElementById('themeBtn').addEventListener('click',()=>{const r=document.documentElement,cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  r.dataset.theme=cur==='dark'?'light':'dark';try{localStorage.setItem('ess-theme',r.dataset.theme);}catch(e){}draw();if(window.T3)T3.draw();if(window.T1)T1.colors();if(window.T4)T4.draw();if(window.T5)T5.draw();});
try{const t=localStorage.getItem('ess-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}
document.getElementById('cards').addEventListener('focusin',e=>{if(e.target.tagName!=='INPUT')return;document.body.classList.add('typing');setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),300);});
document.getElementById('cards').addEventListener('focusout',e=>{if(e.target.tagName==='INPUT')setTimeout(()=>{if(document.activeElement.tagName!=='INPUT')document.body.classList.remove('typing');},100);});
document.getElementById('cards').addEventListener('keydown',e=>{if(e.key!=='Enter'||e.target.tagName!=='INPUT')return;const b=e.target.parentElement.querySelector('.btn.primary');if(b){e.target.blur();b.click();}});
syncSeg();renderCards();fit();
if(document.fonts)document.fonts.ready.then(draw);
</script>

const T3=(()=>{
const R=6371,RC0=3482,RIC=1217;
let st={q1:null,q2:null,q3:null,rc:2200,coreOk:false,q5:null,w:'S',tries:0};
if(ESS_SIM)Object.assign(st,{q1:'all',q2:'103',obsOn:true,q3:'액체',coreOk:true,rc:3482,q5:'b'});else{try{const x=JSON.parse(localStorage.getItem('ess-seismic3-v1'));if(x)st=Object.assign(st,x);}catch(e){}}

const cv=document.getElementById('cv3'),ctx=cv.getContext('2d');let W=0,H=0;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* --- 맨틀 S파 속도(iasp91). 핵 반지름을 바꿀 때 3482 km보다 깊은 곳은 맨 아래 값을 그대로 쓴다(모형) --- */
const VS=D3.vel.filter(v=>v[0]>=RC0&&v[2]>0).map(v=>[v[0],v[2]]); // 위→아래
function vsAt(r){if(r<=RC0)return VS[VS.length-1][1];for(let i=1;i<VS.length;i++){const a=VS[i-1],b=VS[i];if(r<=a[0]&&r>=b[0]){if(a[0]===b[0])return b[1];return b[1]+(a[1]-b[1])*(r-b[0])/(a[0]-b[0]);}}return VS[0][1];}
// 깊이 방향 격자(불연속면은 두 값으로)
function grid(rc){const g=[];for(const v of VS){if(v[0]>rc)g.push([v[0],v[1]]);}
  // 촘촘하게
  const out=[];for(let i=0;i<g.length;i++){out.push(g[i]);const n=g[i+1];if(n&&g[i][0]-n[0]>20){const k=Math.ceil((g[i][0]-n[0])/20);for(let j=1;j<k;j++){const r=g[i][0]-(g[i][0]-n[0])*j/k;out.push([r,vsAt(r)]);}}}
  const last=out[out.length-1];if(rc<last[0]){const k=Math.ceil((last[0]-rc)/20);for(let j=1;j<=k;j++){const r=last[0]-(last[0]-rc)*j/k;out.push([r,vsAt(r)]);}}
  return out;}
/* 광선 추적: 선속도 p(=r/v 불변)에 대해 각거리 θ(r)를 적분. A=η²-p²를 구간마다 일차식으로 보고 정확히 적분 */
function ray(p,rc){const g=grid(rc);let th=0;const path=[[0,R]];
  for(let i=1;i<g.length;i++){const r1=g[i-1][0],r2=g[i][0];if(r1===r2)continue;
    const A1=(r1/g[i-1][1])**2-p*p;let A2=(r2/g[i][1])**2-p*p;if(A1<=0)return {turn:true,th:th,path};
    if(A2<=0){const rt=r1-(r1-r2)*A1/(A1-A2);const b=A1/(r1-rt);th+=p/((r1+rt)/2)*2*Math.sqrt(A1)/b*180/Math.PI;path.push([th,rt]);return {turn:true,th,path};}
    const b=(A1-A2)/(r1-r2);const d=Math.abs(b)<1e-9?(r1-r2)/Math.sqrt(A1):2*(Math.sqrt(A1)-Math.sqrt(A2))/b;
    th+=p/((r1+r2)/2)*d*180/Math.PI;path.push([th,r2]);}
  return {turn:false,th,path};} // turn=false: 핵에 닿음
function full(p,rc){const r=ray(p,rc);if(!r.turn)return {hit:true,path:r.path,delta:null};
  const T=r.th,up=r.path.slice(0,-1).reverse().map(q=>[2*T-q[0],q[1]]);return {hit:false,path:r.path.concat(up),delta:2*T};}
const pGraze=rc=>rc/vsAt(rc+0.01);
const shadowAt=rc=>full(pGraze(rc)*1.0005,rc).delta;
function pForDelta(D,rc){let lo=pGraze(rc)*1.0005,hi=R/VS[0][1]*0.9999;for(let k=0;k<40;k++){const m=(lo+hi)/2,d=full(m,rc).delta;if(d===null||d>D)lo=m;else hi=m;}return (lo+hi)/2;}
const OBS_S=shadowAt(RC0);

/* --- 그리기 --- */
let cx,cy,sc;
function P(th,r,side){const a=th*Math.PI/180;return [cx+side*r*sc*Math.sin(a),cy-r*sc*Math.cos(a)];}
function txt(s,x,y,col,size,align,w){ctx.font=`${w||700} ${size||13}px "IBM Plex Sans KR",sans-serif`;ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.lineWidth=4;ctx.lineJoin='round';ctx.strokeStyle=css('--card');ctx.strokeText(s,x,y);ctx.fillStyle=col;ctx.fillText(s,x,y);}
function line(pts,side,col,w,dash){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.setLineDash(dash||[]);ctx.beginPath();pts.forEach((q,i)=>{const z=P(q[0],q[1],side);i?ctx.lineTo(z[0],z[1]):ctx.moveTo(z[0],z[1]);});ctx.stroke();ctx.setLineDash([]);}
function band(r0,w,fn,col){ // fn(deg)->0..1
  for(const side of [1,-1])for(let d=0;d<180;d+=1){const a=fn(d+0.5);ctx.globalAlpha=a<0.02?1:a;ctx.strokeStyle=a<0.02?css('--grid2'):col;ctx.lineWidth=a<0.02?2:w;
    ctx.beginPath();const a0=(d-90)*Math.PI/180,a1=(d+1-90)*Math.PI/180;
    if(side>0)ctx.arc(cx,cy,r0,a0,a1);else ctx.arc(cx,cy,r0,Math.PI-a1,Math.PI-a0);ctx.stroke();}
  ctx.globalAlpha=1;}
const ramp=(d,a,b)=>Math.max(0,Math.min(1,(b-d)/(b-a)));
const sObs=d=>d<D3.edge.S?1:ramp(d,D3.edge.S,106)*0.35;
const pObs=d=>d<D3.edge.P?1:d<106?ramp(d,D3.edge.P,106)*0.35:d<D3.edge.PKP-1?(d>114?0.12:0.04):d<D3.edge.PKP?0.5:1;
/* --- 움직임: 경로마다 실제 속도표로 도착 시간을 계산해, 시간 순서대로 그린다 --- */
const VT=D3.vel; // [r,vp,vs] 위→아래
function vAt(r,k){for(let i=1;i<VT.length;i++){const a=VT[i-1],b=VT[i];if(r<=a[0]&&r>=b[0]){if(a[0]===b[0])continue;const va=a[k],vb=b[k];return vb+(va-vb)*(r-b[0])/(a[0]-b[0]);}}return VT[VT.length-1][k];}
function timed(pts,k,vconst){let T=0;const out=[[pts[0][0],pts[0][1],0]];
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],r=(a[1]+b[1])/2,da=(b[0]-a[0])*Math.PI/180*r,ds=Math.hypot(da,b[1]-a[1]);
    let v=vconst||vAt(r,k);if(!(v>0.5))v=vAt(r,1);T+=ds/v;out.push([b[0],b[1],T]);}return out;}
function chord(D){const pts=[];const x1=R*Math.sin(D*Math.PI/180),y1=R*Math.cos(D*Math.PI/180);
  for(let i=0;i<=40;i++){const x=x1*i/40,y=R+(y1-R)*i/40;pts.push([Math.atan2(x,y)*180/Math.PI,Math.hypot(x,y)]);}return pts;}
let cache={},anim=null,lastKey='',raf=0;

function txt(s,x,y,col,size,al,w){ctx.font=`${w||700} ${size||13}px "IBM Plex Sans KR",sans-serif`;ctx.textAlign=al||'center';ctx.textBaseline='middle';ctx.lineWidth=4;ctx.lineJoin='round';ctx.strokeStyle=css('--card');ctx.strokeText(s,x,y);ctx.fillStyle=col;ctx.fillText(s,x,y);}
function geo(){const L=40,R=W-14,secT=26,secH=Math.min(150,H*0.36),gT=secT+secH+34,gB=H-30;
  const kx=(R-L)/310;return {L,R,secT,secH,gT,gB,X:x=>L+x*kx,Z:z=>secT+z*kx*EX,GY:t=>gB-t/50*(gB-gT)};}
function draw(){if(!W)return;ctx.clearRect(0,0,W,H);const g=geo(),{L,R,secT,X,Z,GY,gT,gB}=g;const hm=st.hOk?H_TRUE:(st.q3==='mantle'?st.h:H_TRUE);
  const showMoho=st.q3==='mantle';
  // 단면
  const zb=Math.min(secT+g.secH,Z(60));
  ctx.fillStyle=css('--icore');ctx.globalAlpha=0.35;ctx.fillRect(X(0),secT,X(310)-X(0),zb-secT);ctx.globalAlpha=1;
  const hf=showMoho&&!st.hOk?st.h:H_TRUE;ctx.fillStyle=css('--land');ctx.fillRect(X(0),secT,X(310)-X(0),Math.min(zb,Z(hf))-secT);
  if(showMoho){ctx.strokeStyle=css('--sc');ctx.lineWidth=2;ctx.setLineDash([6,4]);ctx.beginPath();ctx.moveTo(X(0),Z(st.h));ctx.lineTo(X(310),Z(st.h));ctx.stroke();ctx.setLineDash([]);
    txt('모호면(막대로 바꾸는 깊이) '+st.h+' km',X(155),Z(st.h)-9,css('--sc'),12);}
  txt('지각',X(8),Math.max(secT+54,Z(hf*0.5)),css('--ink'),12,'left');txt('맨틀',X(8),Math.min(zb-8,Z(hf)+12),css('--ink'),12,'left');
  ctx.strokeStyle=css('--ink');ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(X(0),secT);ctx.lineTo(X(310),secT);ctx.stroke();
  // 경로(고른 지진계)
  if(st.sel!=null){const x=XS[st.sel];const hh=showMoho?st.h:H_TRUE;
    ctx.strokeStyle=css('--pc');ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(X(0),secT+3);ctx.lineTo(X(x),secT+3);ctx.stroke();
    if(st.q2==='two'&&x>=xCrit(hh)){const a=hh*Math.tan(ic);ctx.strokeStyle=css('--c2');ctx.setLineDash([7,4]);ctx.beginPath();ctx.moveTo(X(0),secT);ctx.lineTo(X(a),Z(hh));ctx.lineTo(X(x-a),Z(hh));ctx.lineTo(X(x),secT);ctx.stroke();ctx.setLineDash([]);}
    if(race){const k=race,e=(performance.now()-k.t0)/1000*k.sp;
      const pD=Math.min(e,tD(x))/tD(x)*x;ctx.fillStyle=css('--pc');ctx.beginPath();ctx.arc(X(pD),secT+3,6,0,7);ctx.fill();
      const tt=tH(x,hh);if(tt<Infinity){const a=hh*Math.tan(ic),s1=Math.hypot(a,hh)/V1,s2=(x-2*a)/V2;let q=Math.min(e,tt),px,pz;
        if(q<s1){px=a*q/s1;pz=hh*q/s1;}else if(q<s1+s2){px=a+(q-s1)*V2;pz=hh;}else{const f=(q-s1-s2)/s1;px=x-a+a*f;pz=hh*(1-f);}
        ctx.fillStyle=css('--c2');ctx.beginPath();ctx.arc(X(px),Z(pz),6,0,7);ctx.fill();}
      txt(`${Math.min(e,Math.max(tD(x),tt<Infinity?tt:0)).toFixed(1)}초`,X(x),secT-14,css('--ink'),12);}
  }
  // 진원·지진계
  ctx.fillStyle=css('--sc');ctx.beginPath();ctx.arc(X(0),secT,6,0,7);ctx.fill();txt('진원',X(0)+8,secT+(st.pts.length<3?34:12),css('--ink'),12,'left');
  XS.forEach((x,i)=>{const on=st.pts.includes(i);ctx.fillStyle=on?css('--accent'):css('--sub');ctx.strokeStyle=st.sel===i?css('--ink'):css('--card');ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(X(x),secT-1);ctx.lineTo(X(x)+9,secT-17);ctx.lineTo(X(x)-9,secT-17);ctx.closePath();ctx.fill();ctx.stroke();});
  const nx=XS.findIndex((_,i)=>!st.pts.includes(i));
  if(nx>=0&&st.pts.length<3){const ph=(performance.now()%1200)/1200,xx=X(XS[nx]);ctx.strokeStyle=css('--sc');ctx.lineWidth=3;ctx.globalAlpha=1-ph;ctx.beginPath();ctx.arc(xx,secT-9,12+ph*12,0,7);ctx.stroke();ctx.globalAlpha=1;
    txt('▲ 여기를 누르세요',xx-10,secT+14,css('--sc'),13,'left');}
  txt(`세로 ${EX}배 과장`,R,zb+10,css('--sub'),11,'right',600);
  // 그래프
  ctx.strokeStyle=css('--grid');ctx.lineWidth=1;for(let x=0;x<=300;x+=25){ctx.beginPath();ctx.moveTo(X(x),gT);ctx.lineTo(X(x),gB);ctx.stroke();}
  for(let t=0;t<=50;t+=5){ctx.beginPath();ctx.moveTo(L,GY(t));ctx.lineTo(X(310),GY(t));ctx.stroke();}
  ctx.strokeStyle=css('--grid2');for(let x=0;x<=300;x+=50){txt(String(x),X(x),gB+12,css('--sub'),12,'center',600);}
  for(let t=0;t<=50;t+=10){txt(String(t),L-6,GY(t),css('--sub'),12,'right',600);}
  txt('진원에서 거리(km)',R,H-6,css('--sub'),11,'right',400);txt('처음 도착 시간(초)',L-30,gT-12,css('--sub'),11,'left',400);
  // 모형선(막대)
  if(showMoho){ctx.lineWidth=2;ctx.strokeStyle=css('--pc');ctx.beginPath();ctx.moveTo(X(0),GY(0));ctx.lineTo(X(310),GY(tD(310)));ctx.stroke();
    const xa=xCrit(st.h);ctx.strokeStyle=css('--c2');ctx.setLineDash([7,4]);ctx.beginPath();ctx.moveTo(X(xa),GY(tH(xa,st.h)));ctx.lineTo(X(310),GY(tH(310,st.h)));ctx.stroke();ctx.setLineDash([]);
    const c=xc(st.h);if(c<310){ctx.fillStyle=css('--ink');ctx.beginPath();ctx.arc(X(c),GY(tD(c)),4,0,7);ctx.fill();}}
  // 관측 점
  for(const i of st.pts){ctx.fillStyle=css('--accent');ctx.strokeStyle=css('--card');ctx.lineWidth=2;ctx.beginPath();ctx.arc(X(XS[i]),GY(obs(i)),5.5,0,7);ctx.fill();ctx.stroke();}
  if(!st.pts.length)txt('위의 ▼ 지진계를 눌러 보세요',X(155),(gT+gB)/2,css('--sub'),14);
  if(st.pts.length<3&&!document.getElementById('tab4').hidden&&!pulse){pulse=true;requestAnimationFrame(()=>{pulse=false;draw();});}
  if(race&&(performance.now()-race.t0)/1000*race.sp<Math.max(tD(XS[st.sel]),(tH(XS[st.sel],showMoho?st.h:H_TRUE)<Infinity?tH(XS[st.sel],showMoho?st.h:H_TRUE):0))+0.3)requestAnimationFrame(draw);else race=null;}
function fit(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);draw();}
window.addEventListener('resize',()=>{if(!document.getElementById('tab4').hidden)fit();});
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,g=geo();if(y>g.secT+g.secH+20)return;
  let best=-1,bd=1e9;XS.forEach((sx,i)=>{const d=Math.abs(g.X(sx)-x);if(d<bd){bd=d;best=i;}});if(best<0)return;
  st.sel=best;if(!st.pts.includes(best))st.pts.push(best);save();cards();draw();});
/* --- 카드 --- */
const fb=(c,t)=>`<div class="fb ${c}">${t}</div>`;
const opts=(q,list)=>`<div class="opts" data-q="${q}">${list.map(([v,l])=>`<button class="${st[q]===v?'picked':''}" data-v="${v}">${l}</button>`).join('')}</div>`;
function cards(){let h='';const n=st.pts.length;
  h+=`<div class="card"><h3>땅속 첫 번째 경계 찾기</h3><p>지진파로 <b>지각의 두께</b>를 알아냅시다. 진원에서 거리가 다른 지진계 12대가 있습니다.</p>
    <p>그림 위쪽의 <b>▼ 지진계</b>(왼쪽부터 25 km 간격)를 하나씩 누르면, 지진파가 <b>처음 도착한 시간</b>이 아래 그래프에 점으로 찍힙니다. (${n}/12)</p>
    <div class="row">${n<12?'<button class="btn primary" data-a="next">▼ 다음 지진계 찍기</button>':''}${n>=4&&n<12?'<button class="btn" data-a="all">나머지 모두 찍기</button>':''}</div></div>`;
  if(n<8){out(h);return;}
  h+=`<div class="card"><h3>1. 점들의 모양</h3><p>그래프의 점들은 어떻게 놓여 있나요?</p>${opts('q2',[['one','하나의 곧은 직선 위에 있다'],['two','기울기가 다른 두 직선으로 나뉜다'],['scatter','규칙 없이 흩어져 있다']])}
    ${st.q2==='two'?fb('ok','맞아요. 가까운 곳과 먼 곳의 기울기가 다릅니다. 기울기는 <b>1 km 가는 데 걸린 시간</b>이에요. 기울기가 작을수록 <b>빠른</b> 파입니다. 먼 곳의 점들은 더 빠른 파가 먼저 도착한 거예요.'):st.q2?fb('hint','가까운 점 몇 개, 먼 점 몇 개에 각각 자를 대 보세요. 한 자로 모두 이어지나요?'):''}</div>`;
  if(st.q2!=='two'){out(h);return;}
  h+=`<div class="card"><h3>2. 먼 곳에 더 빨리 오는 까닭</h3><p>먼 지진계(예: 300 km)를 누르고 <b>[경주 보기]</b>를 눌러 보세요. 파란 점은 지각으로 곧장 가는 파, 주황 점은 아래로 내려갔다 오는 파입니다.</p>
    <button class="btn primary" data-a="race">경주 보기</button>
    <p style="margin-top:8px">먼 곳에서 주황 경로가 먼저 도착하는 까닭은?</p>
    ${opts('q3',[['crust','지각 속에서 파가 점점 빨라지기 때문'],['mantle','아래쪽 <b>더 빠른 층(맨틀)</b>을 따라 돌아오기 때문'],['sens','먼 곳 지진계가 더 예민하기 때문']])}
    ${st.q3==='mantle'?fb('ok','맞아요. 길은 더 멀어도 빠른 맨틀을 따라 달리니 먼저 도착합니다. 가까운 길보다 멀리 돌아가는 <b>고속도로</b>가 더 빠른 것과 같아요. 지각과 맨틀의 경계를 <span class="term">모호면</span>(모호로비치치 불연속면)이라고 합니다. 1909년 이렇게 처음 발견되었어요.'):
      st.q3?fb('hint','[경주 보기]에서 주황 점이 <b>어디를</b> 지날 때 빨라지는지 보세요.'):''}</div>`;
  if(st.q3!=='mantle'){out(h);return;}
  h+=`<div class="card"><h3>3. 지각의 두께 맞히기</h3><p>막대로 <b>모호면 깊이</b>를 바꾸면 그래프의 두 선(파랑: 곧장 온 파, 주황: 맨틀을 따라 온 파)이 바뀝니다. 선이 관측 점과 가장 잘 맞는 깊이를 찾으세요.</p>
    ${st.hOk||ESS_SIM?fb('ok',`찾았어요! 이 지역의 지각 두께는 약 <b>${H_TRUE} km</b>입니다. 두 선이 만나는 곳(검은 점)보다 먼 곳에서는 맨틀을 따라 온 파가 먼저 도착해요. 지각이 두꺼울수록 이 점이 멀어집니다.`):
      `<button class="btn primary" data-a="h">이 깊이로 정하기</button>${st.tries4&&Math.abs(st.h-H_TRUE)>2?fb('hint','주황 선이 점들보다 위에 있나요, 아래에 있나요? 막대를 움직이며 선이 꺾이는 곳(검은 점)이 관측 점이 꺾이는 곳과 맞는지 보세요.'):''}`}</div>`;
  if(st.hOk||ESS_SIM)h+=`<details class="dif"><summary>더 알아보기 · 공식으로 두께 구하기</summary>
    <p>두 직선의 기울기로 지각 속도 V<sub>1</sub>과 맨틀 속도 V<sub>2</sub>를, 두 직선이 만나는 거리(<b>교차 거리</b> x<sub>c</sub>)를 읽으면 지각 두께 h를 계산할 수 있습니다.</p>
    <p style="font-size:18px;text-align:center"><b>h = (x<sub>c</sub> ÷ 2) × √((V<sub>2</sub> − V<sub>1</sub>) ÷ (V<sub>2</sub> + V<sub>1</sub>))</b></p>
    <p>이 모형의 값: V<sub>1</sub> = ${V1} km/s, V<sub>2</sub> = ${V2} km/s, x<sub>c</sub> ≈ ${Math.round(xc(H_TRUE))} km. h를 계산해 보세요.</p>
    <div class="inp"><span>h</span><input id="calc4" type="number" inputmode="decimal" placeholder="숫자" value="${st.calc}" ${st.calcOk?'disabled':''}><span>km</span>${st.calcOk?'':'<button class="btn primary" data-a="calc">확인</button>'}</div>
    ${st.calcOk?fb('ok','맞아요. 막대로 찾은 값과 같습니다.'):st.calc!==''?fb('hint','√ 안을 먼저 계산하세요: (8.0 − 6.2) ÷ (8.0 + 6.2). 그 값의 제곱근에 x<sub>c</sub> ÷ 2를 곱합니다.'):''}</details>`;
  out(h);}
function out(h){document.getElementById('cards4').innerHTML=essSimText(h)+diffHTML(DIFF4);sync();}
function sync(){const s=document.getElementById('slider4');s.hidden=!(ESS_SIM||st.q3==='mantle'&&!st.hOk);const r=document.getElementById('hIn');r.value=st.h;document.getElementById('hVal').textContent=st.h+' km';
  const tg=document.getElementById('tag4');tg.className='tag model';tg.textContent='모형';draw();}
document.getElementById('cards4').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const q=b.parentElement.dataset.q;
  if(q){st[q]=b.dataset.v;save();cards();return;}const a=b.dataset.a;
  if(a==='all'){st.pts=XS.map((_,i)=>i);save();cards();}
  if(a==='next'){const k=XS.findIndex((_,i)=>!st.pts.includes(i));if(k>=0){st.pts.push(k);st.sel=k;save();cards();}}
  if(a==='race'){if(st.sel==null||XS[st.sel]<250)st.sel=11;race={t0:performance.now(),sp:12};draw();cards();}
  if(a==='h'){st.tries4=(st.tries4||0)+1;if(Math.abs(st.h-H_TRUE)<=2){st.hOk=true;st.h=H_TRUE;}save();cards();}
  if(a==='calc'){const v=parseFloat(document.getElementById('calc4').value);st.calc=isFinite(v)?String(v):'';st.calcOk=isFinite(v)&&Math.abs(v-H_TRUE)<=3;save();cards();}});
document.getElementById('hIn').addEventListener('input',e=>{st.h=+e.target.value;document.getElementById('hVal').textContent=st.h+' km';draw();});
document.getElementById('hIn').addEventListener('change',save);
return {show(){cards();fit();},draw(){draw();}};
})();

</script>

  const arc=(r,dash,c,w)=>{ctx.strokeStyle=c;ctx.lineWidth=w;ctx.setLineDash(dash);ctx.beginPath();ctx.arc(g.cx,g.cy,r*g.k,-Math.PI/2-g.half,-Math.PI/2+g.half);ctx.stroke();ctx.setLineDash([]);};
  arc(g.r1,[],css('--ink'),1.5);arc(g.r0,[],css('--ink'),1.5);arc(R-660,[5,4],css('--ink'),1);
  const pt=(fa,r)=>{const a=-g.half+fa*2*g.half;return [g.cx+r*g.k*Math.sin(a),g.cy-r*g.k*Math.cos(a)];};
  const q=pt(0.03,R-660);txt('660 km',q[0]+4,q[1]-9,css('--ink'),11,'left',600);const q2=pt(0.5,3480);txt('맨틀 바닥(외핵과의 경계)',q2[0],q2[1]+12,css('--ink'),12);
  for(const [n,f] of s.marks){const p=pt(f,6346);txt(n,Math.max(34,Math.min(W-34,p[0])),p[1]-12,css('--ink'),12);ctx.fillStyle=css('--ink');ctx.beginPath();ctx.arc(p[0],p[1],3,0,7);ctx.fill();}
  // 범례
  const lx=W/2-90,ly=H-24;for(let i=0;i<180;i++){const c=col(-2+4*i/179);ctx.fillStyle=`rgb(${c})`;ctx.fillRect(lx+i,ly,1,10);}
  txt('느림(뜨거움)',lx-4,ly+5,css('--sc'),12,'right');txt('빠름(차가움)',lx+184,ly+5,css('--accent'),12,'left');txt('−2%   0   +2%',W/2,ly+18,css('--sub'),11,'center',600);
  if(st.pick){const p=pt(st.pick[0],st.pick[1]);ctx.strokeStyle=css('--ink');ctx.lineWidth=2;ctx.beginPath();ctx.arc(p[0],p[1],7,0,7);ctx.stroke();
    const v=sample(s,st.pick[0],st.pick[1]);txt(`깊이 ${Math.round(R-st.pick[1])} km · ${v>0?'+':''}${v.toFixed(1)}% (${Math.abs(v)<0.3?'평균':v>0?'빠름':'느림'})`,W/2,12,css('--ink'),13);}}
function draw(){if(!W)return;ctx.clearRect(0,0,W,H);st.mode==='v'?drawV():drawS();tools();}
function fit(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);imgKey='';draw();}
window.addEventListener('resize',()=>{if(!document.getElementById('tab5').hidden)fit();});
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  if(st.mode==='v'){const g=gv();if(y<g.T||y>g.Bt)return;st.tp=Math.max(0,Math.min(g.dm,g.D(y)));checkFind();save();draw();}
  else{const g=gs(),p=toPolar(x,y,g);if(p.r>=g.r0&&p.r<=g.r1&&p.fa>=0&&p.fa<=1){st.pick=[p.fa,p.r];save();draw();}}});
function checkFind(){const d=st.tp;let hit=null;
  if(!st.zoom){if(Math.abs(d-B.cmb)<150)hit='cmb';else if(Math.abs(d-B.icb)<150&&st.found.cmb)hit='icb';}
  else if(Math.abs(d-B.moho)<12)hit='moho';
  if(hit&&!st.found[hit]){st.found[hit]=true;cards();}}
function tools(){document.querySelectorAll('#m5Seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===st.mode));
  const s=document.getElementById('s5Seg');s.style.display=st.mode==='s'?'':'none';s.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.s===st.sec));
  const z=document.getElementById('z5');z.style.display=st.mode==='v'?'':'none';z.textContent=st.zoom?'전체 깊이 보기':'맨 위 200 km 확대';
  const tg=document.getElementById('tag5'),src=document.getElementById('src5');tg.className='tag real';
  if(st.mode==='v'){tg.textContent='계산값';src.textContent='표준 지구 모형 iasp91(Kennett·Engdahl 1991)의 깊이별 속도 · 그래프를 누르면 그 깊이의 값을 읽어요';}
  else{tg.textContent='실제 자료';src.textContent='지진파 단층 촬영 모형 S40RTS(Ritsema 외 2011) · 평균보다 빠르면 파랑, 느리면 빨강 · 단면을 누르면 값을 읽어요';}}
document.getElementById('m5Seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;st.mode=b.dataset.m;save();draw();});
document.getElementById('s5Seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;st.sec=+b.dataset.s;st.pick=null;save();draw();});
document.getElementById('z5').addEventListener('click',()=>{st.zoom=!st.zoom;st.tp=null;save();draw();});
/* --- 카드 --- */
const fb=(c,t)=>`<div class="fb ${c}">${t}</div>`;
const opts=(q,list)=>`<div class="opts" data-q="${q}">${list.map(([v,l])=>`<button class="${st[q]===v?'picked':''}" data-v="${v}">${l}</button>`).join('')}</div>`;
const ck=b=>b?'✅':'⬜';
function cards(){let h='';const f=st.found;
  h+=`<div class="card"><h3>1. 속도가 갑자기 바뀌는 깊이 찾기</h3><p>위 그래프는 깊이에 따른 <b style="color:var(--pc)">P파</b>와 <b style="color:var(--sc)">S파</b>의 속도입니다. 속도가 <b>갑자기</b> 바뀌는 곳이 땅속 경계면이에요. 그래프에서 그 깊이를 눌러 찾으세요.</p>
    <p>${ck(f.cmb)} S파 속도가 <b>0이 되는</b> 깊이</p><p>${ck(f.icb)} S파가 <b>다시 나타나는</b> 깊이</p>
    <p>${ck(f.moho)} <b>[맨 위 200 km 확대]</b>를 눌러, 속도가 처음으로 갑자기 빨라지는 깊이</p>
    ${f.cmb?fb('ok','약 2900 km: <b>맨틀과 외핵의 경계</b>입니다.'):''}${f.icb?fb('ok','약 5150 km: <b>외핵과 내핵의 경계</b>입니다.'):''}${f.moho?fb('ok','약 35 km: <b>모호면</b>(지각과 맨틀의 경계). ④ 탭에서 찾은 것과 같은 경계예요.'):''}
    ${st.tp!=null&&!(f.cmb&&f.icb&&f.moho)?fb('hint',!f.cmb?'빨간 점선(S파)이 왼쪽 끝 0으로 떨어지는 곳을 누르세요.':!f.icb?'S파 선이 0에서 다시 오른쪽으로 나오는 곳을 누르세요.':st.zoom?'P파·S파 선이 계단처럼 오른쪽으로 꺾이는 곳을 누르세요.':'[맨 위 200 km 확대]를 먼저 누르세요.'):''}</div>`;
  if(!(f.cmb&&f.icb)){out(h);return;}
  h+=`<div class="card"><h3>2. 외핵과 내핵은 어떤 상태일까?</h3><p>S파 속도가 외핵에서는 0이고, 내핵에서는 다시 생깁니다. 무엇을 알 수 있나요?</p>
    ${opts('q1',[['ok','외핵은 액체, 내핵은 고체'],['rev','외핵은 고체, 내핵은 액체'],['both','외핵과 내핵 모두 액체']])}
    ${st.q1==='ok'?fb('ok','맞아요. S파는 액체를 지나가지 못하니 외핵은 액체입니다(③ 탭과 같은 결론). 내핵에서는 S파가 다시 생기므로 고체예요. 내핵은 압력이 아주 커서 온도가 높아도 고체가 됩니다.'):st.q1?fb('hint','① 탭: S파가 지나가지 <b>못하는</b> 것은 액체였어요. S파 속도가 0인 층은 어디인가요?'):''}</div>`;
  if(st.q1!=='ok'){out(h);return;}
  h+=`<div class="card"><h3>3. 같은 깊이인데 속도가 다르다?</h3><p>위에서 <b>[단층 촬영]</b>을 누르세요. 병원의 CT처럼, 수많은 지진파 기록을 모아 지구 속을 단면으로 본 그림입니다. 같은 깊이라도 <b style="color:var(--accent)">파랑(빠름)</b>과 <b style="color:var(--sc)">빨강(느림)</b>이 섞여 있어요. 왜 그럴까요?</p>
    ${opts('qa',[['temp','곳마다 온도가 달라서'],['err','깊이를 잘못 재서'],['liq','빨간 곳만 액체라서']])}
    ${st.qa==='temp'?fb('ok','맞아요. 같은 암석이라도 <b>차가우면 단단해 지진파가 빠르고, 뜨거우면 느립니다.</b> 그래서 단층 촬영으로 맨틀 속의 찬 곳과 뜨거운 곳을 볼 수 있어요.'):st.qa==='liq'?fb('hint','액체라면 S파가 지나가지 못해야 해요. 그런데 빨간 곳에서도 S파 값이 있습니다. 액체가 아니어도 S파가 느려지는 까닭은?'):st.qa?fb('hint','표준 모형(깊이별 속도)은 깊이마다 평균값 하나입니다. 실제 맨틀은 곳마다 무엇이 다를까요?'):''}</div>`;
  if(st.qa!=='temp'){out(h);return;}
  h+=`<div class="card"><h3>4. 한반도 아래</h3><p>[한반도·일본] 단면에서 한반도·중국 아래 <b>깊이 약 600 km</b>를 따라 길게 누운 파란 띠를 찾아보세요. 무엇일까요?</p>
    ${opts('qb',[['slab','일본 해구에서 가라앉은 차가운 판(태평양판)'],['plume','뜨겁게 솟아오르는 플룸'],['magma','녹은 마그마']])}
    ${st.qb==='slab'?fb('ok','맞아요. 태평양판이 일본 해구에서 가라앉아 <b>660 km 경계 근처에 길게 누워</b> 있습니다. 차가워서 빠르게(파랑) 보여요. 판구조론 앱에서 본 \'섭입하는 판이 당기는 힘\'의 실제 모습입니다.'):st.qb?fb('hint','파랑은 빠름 = 차가움입니다. 일본 해구에서 차가운 것이 땅속으로 들어가는 현상은?'):''}</div>`;
  if(st.qb!=='slab'){out(h);return;}
  h+=`<div class="card"><h3>5. 아프리카 아래</h3><p>[아프리카] 단면의 <b>맨틀 바닥</b>(약 2000~2900 km)에 있는 큰 빨간 덩어리는 무엇일까요?</p>
    ${opts('qc',[['plume','뜨거운 거대한 덩어리(플룸이 솟아오르는 곳)'],['slab','가라앉은 차가운 판'],['core','외핵의 일부']])}
    ${st.qc==='plume'?fb('ok','맞아요. 맨틀 바닥의 뜨겁고 느린 거대한 덩어리입니다. 여기서 <b>플룸</b>이 솟아올라 열점 화산을 만든다고 봅니다. 태평양 아래에도 이런 덩어리가 하나 더 있어요.'):st.qc?fb('hint','빨강은 느림 = 뜨거움입니다. 맨틀 바닥에서 뜨거운 물질이 솟아오르는 것을 무엇이라고 했나요?'):''}</div>`;
  out(h);}
function out(h){document.getElementById('cards5').innerHTML=essSimText(h)+diffHTML(DIFF5);tools();}

return {show(){cards();fit();},draw(){imgKey='';draw();}};
