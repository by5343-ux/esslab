    · 0단계는 관측 원리를 익히는 짧은 훈련이에요. 건너뛰어도 됩니다.<br>
    · 1단계는 별마다 망원경 시간 ${BUDGET}시간으로 관측하고, 계산해서 판정해요.<br>
    · 2단계는 1단계를 마치면 열려요. 슬라이더로 생명가능지대를 찾습니다.<br>
    · 예측이 맞으면 별 1개 추가. 근거가 부족한 제출은 감점 없이 반려돼요.</div>
  <div class="rulebox"><b>선생님용</b>
    <div class="ov-actions" style="margin-top:8px">
      <button class="btn" data-act="unlock">${store.unlockAll?'미션 잠금 다시 켜기':'모든 미션 열기'}</button>
      <button class="btn danger" data-act="wipe">전체 기록 지우기</button>
    </div></div>
  <div class="ov-actions"><button class="btn wide" data-close>닫기</button></div>`;
}
/* ---------- 한 줄 기록 ---------- */
let pendingNote = null;
function askNote(key, label, prompt, next){
  pendingNote = {key, next};
  const prev = store.notes[key] ? store.notes[key].text : '';
  openOverlay(`<h2 class="display ov-title">한 줄 기록</h2>
    <p class="ov-text">${prompt}</p>
    <textarea class="notebox" id="noteBox" placeholder="내가 알아낸 것을 한 문장으로">${prev}</textarea>
    <p class="ov-small">쓴 문장은 기록장에 남아요. 맞고 틀림을 채점하지 않아요.</p>
    <div class="ov-actions"><button class="btn primary wide" data-act="notesave">쓰고 설명 보기</button><button class="btn wide" data-act="noteskip">건너뛰기</button></div>`, 'sheet');
  const box = $('#noteBox'); if(box) setTimeout(()=>box.focus({preventScroll:true}), 60);
  if(!pendingNote.label) pendingNote.label = label;
}
function finishNote(saveIt){
  const pn = pendingNote; pendingNote = null;
  if(!pn) return;
  if(saveIt){
    const box = $('#noteBox'), text = box ? box.value.trim() : '';
    if(text){ store.notes[pn.key] = {label:pn.label, text}; store.nbNew = true; }
    save();
  }
  closeOverlay();
  if(pn.next) pn.next();
}

/* ================= actions ================= */
function goMission(i){
  if(!unlocked(i)) return;
  const st = S(STARS[i]);
  store.screen = 'mission'; store.cur = i; store.tab = null;
  store.phase = st.solved ? 'judge' : st.observed.length ? 'observe' : 'brief';
  calc.expr = ''; calc.sel = 'dl';
  save(); render(); window.scrollTo(0,0);
}
function setPhase(p){
  const st = S(STARS[store.cur]);
  if(p==='analyze' && !st.observed.includes('rv')) return;
  store.phase = p; save(); render(); window.scrollTo(0,0);
}
function observe(k){
  const s = STARS[store.cur], st = S(s), m = METHODS[k];
  if(st.observed.includes(k)){ store.tab = k; save(); render(true); const b = $('#dataBox'); if(b) b.scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'start'}); return; }
  if(st.solved || scanning || (k==='ml' && !s.ml)) return;
  if(st.used + m.cost > BUDGET){
    const short = st.used + m.cost - BUDGET;
    openOverlay(`<div class="stamp warn">시간 부족</div>
      <p class="ov-text">${m.name} 관측에는 ${m.cost}시간이 필요해서 <b>${short}시간</b>이 모자라요. 추가 시간을 신청하면 이 미션의 별이 1개 줄어요.</p>
      <div class="ov-actions"><button class="btn primary wide" data-act="extra" data-k="${k}">추가 시간 신청하기</button><button class="btn wide" data-close>다른 방법 생각하기</button></div>`);
    return;
  }
  startScan(k);
}
function startScan(k){
  const s = STARS[store.cur], sid = s.id;
  scanning = k; render(true);
  const b = $('#dataBox'); if(b) b.scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'center'});
  setTimeout(()=>{
    scanning = null;
    const st = store.stars[sid];
    if(!st.observed.includes(k)){ st.observed.push(k); st.used += METHODS[k].cost; }
    store.tab = k; save();
    if(store.screen==='mission' && STARS[store.cur].id===sid){
      render(true);
      const bb = $('#dataBox'); if(bb) bb.scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'start'});
    }
  }, REDUCED ? 250 : 1300);
}
function answerPeriodic(v){
  const s = STARS[store.cur], st = S(s);
  if(st.periodicOk) return;
  const truth = s.rv.type==='signal' ? 'yes' : 'no';
  st.periodic = v;
  if(v===truth){ st.periodicOk = true; st.periodicFb = ''; }
  else if(truth==='yes') st.periodicFb = '다시 보세요. 점들이 일정한 간격으로 올라갔다 내려갔다 하는 모양이 보이지 않나요?';
  else if(s.rv.type==='noisy') st.periodicFb = '점들이 크게 흩어져 있어요. 일정한 간격으로 오르내리는 모양을 찾을 수 있나요?';
  else st.periodicFb = '세로축 눈금을 확인하세요. 점들이 0 근처에 흩어져 있나요, 일정한 간격으로 크게 오르내리나요?';
  save(); render(true);
  if(st.periodicOk && truth==='yes'){ calc.sel = 'dl'; calc.collapsed = false; render(true); }
}
function calcCtx(){
  if(store.screen==='tmission' && TM[store.tcur].type==='calc') return {star:T4_STAR, st:store.t.t4, vr:30, theta:60};
  const s = STARS[store.cur];
  return {star:s, st:S(s), vr:s.rv.vr, theta:s.theta};
}
function putValue(){
  const {st} = calcCtx();
  const v = evalExpr(calc.expr);
  if(v==null){ toast('계산식을 먼저 완성하세요.'); return; }
  const k = calc.sel;
  if(st.slotFb[k] && st.slotFb[k].ok){ toast('이미 맞힌 칸이에요. 다른 칸을 고르세요.'); return; }
  st.slots[k] = v; delete st.slotFb[k];
  const order = ['dl','vr','v'];
  const nxt = order.find(o=>o!==k && st.slots[o]==null && !(st.slotFb[o]&&st.slotFb[o].ok));
  if(nxt) calc.sel = nxt;
  calc.ans = v; calc.expr = '';
  save(); render(true);
  toast('값을 넣었어요.');
}
function checkSlots(){
  const {star:s, st} = calcCtx();
  const A = Math.round(amp(s)*100)/100, vr = s.rv.vr, c = COS[s.theta], v = vr/c;
  const {dl, vr:vrIn, v:vIn} = st.slots;
  if(dl==null && vrIn==null && vIn==null){ toast('칸에 값을 먼저 넣으세요.'); return; }
  const fb = st.slotFb;
  if(!(fb.dl && fb.dl.ok)){
    if(dl==null) fb.dl = {ok:false, msg:'값을 넣지 않았어요.'};
    else if(near(dl,A)) fb.dl = {ok:true};
    else if(near(dl,A*1e-5)) fb.dl = {ok:false, msg:'이 칸은 ×10⁻⁵ nm 단위예요. 그래프 눈금의 숫자를 그대로 넣으세요.'};
    else if(near(Math.abs(dl),A,0.3)) fb.dl = {ok:false, msg:'가까워요. 점들이 모이는 봉우리 높이를 굵은 점선 눈금과 비교해 보세요.'};
    else fb.dl = {ok:false, msg:'그래프에서 파장이 가장 크게 변한 값(봉우리 높이)을 읽어 보세요.'};
  }
  if(!(fb.vr && fb.vr.ok)){
    if(vrIn==null) fb.vr = {ok:false, msg:'값을 넣지 않았어요.'};
    else if(near(vrIn,vr)) fb.vr = {ok:true};
    else if(near(vrIn,vr*1e5)) fb.vr = {ok:false, msg:'Δλ의 단위를 확인하세요. 그래프 값에 10⁻⁵을 곱해야 nm가 돼요.'};
    else fb.vr = {ok:false, msg:'c = 3×10⁸ m/s와 λ₀ = 600 nm를 식에 넣어 다시 계산해 보세요.'};
  }
  if(!(fb.v && fb.v.ok)){
    if(vIn==null) fb.v = {ok:false, msg:'값을 넣지 않았어요.'};
    else if(near(vIn,v) || near(vIn, vr/Math.cos(s.theta*Math.PI/180))) fb.v = {ok:true};
    else if(s.theta!==0 && near(vIn,vr)) fb.v = {ok:false, msg:'시선속도는 실제 속도 가운데 시선 방향 성분뿐이에요. 각도 보정을 했나요?'};
    else if(near(vIn,vr*c)) fb.v = {ok:false, msg:'실제 속도는 시선속도보다 작을 수 없어요. 곱셈과 나눗셈을 확인해 보세요.'};
    else fb.v = {ok:false, msg:'v = vᵣ ÷ cos θ에 이 별의 cos 값을 넣어 보세요.'};
  }
  const allOk = fb.dl.ok && fb.vr.ok && fb.v.ok;
  if(allOk) st.rvcalc = true; else if(st.wrong!=null) st.wrong++;
  else { const nxt = ['dl','vr','v'].find(o=>!fb[o].ok); if(nxt) calc.sel = nxt; }
  save(); render(true);
  toast(allOk ? '계산 완료!' : `${['dl','vr','v'].filter(o=>fb[o].ok).length} / 3칸 정답이에요.`);
}
function evidenceMet(s,st){ return s.evidence.some(e => e==='rvcalc' ? st.rvcalc : st.observed.includes(e)); }
function submitVerdict(){
  const s = STARS[store.cur], st = S(s);
  if(!st.choice) return;
  if(!evidenceMet(s,st)){
    if(st.observed.includes('rv') && s.rv.type==='signal' && !st.rvcalc){
      openOverlay(`<div class="stamp warn">자료 부족</div><p class="ov-text">시선속도 자료가 있어요. 분석 단계에서 별의 실제 속도를 구한 뒤에 판정하세요.</p>
        <div class="ov-actions"><button class="btn primary wide" data-phase="analyze">분석하러 가기</button><button class="btn wide" data-close>닫기</button></div>`);
    }else{
      openOverlay(`<div class="stamp warn">자료 부족</div><p class="ov-text">${st.observed.length ? '지금까지 모은 자료로는 판정의 근거가 부족해요.' : '아직 모은 자료가 없어요.'} 브리핑의 θ, 밝기, 특이 사항을 다시 보고 다른 관측 방법을 생각해 보세요.</p>
        <p class="ov-small">틀린 판정으로 치지 않아요.</p>
        <div class="ov-actions"><button class="btn primary wide" data-phase="observe">관측하러 가기</button><button class="btn wide" data-phase="brief">브리핑 다시 보기</button></div>`);
    }
    return;
  }
  if(st.choice===s.answer){
    st.solved = true;
    const predOk = st.pred && s.evidence.some(e=>(e==='rvcalc'?'rv':e)===st.pred);
    st.predOk = !!predOk;
    st.rating = Math.min(3, Math.max(1, 3 - (st.wrong>0?1:0) - (st.used>BUDGET?1:0)) + (predOk?1:0));
    save();
    const reasons = [st.wrong>0?`틀린 판정 ${st.wrong}번`:'', st.used>BUDGET?'망원경 시간 초과':''].filter(Boolean).join(', ');
    const next = store.cur < STARS.length-1;
    render();
    const predLine = st.pred ? (st.predOk
      ? `<p class="ov-small">예측 적중! ${METHODS[st.pred].name}이(가) 결정적인 증거가 됐어요. 별 1개를 더 받았어요.</p>`
      : `<p class="ov-small">예측은 ${METHODS[st.pred].name}이었지만 결정적인 증거는 달랐어요. 어떤 조건 때문이었는지 정리 설명에서 확인해 보세요.</p>`) : '';
    askNote('s1-'+s.id, `1단계 ${s.id}`, '이 별에서 알아낸 것을 한 줄로 써 보세요.', ()=>
    openOverlay(`<div class="stamp good">판정 승인</div>
      <div class="bigstars" aria-label="별 ${st.rating}개">${[0,1,2].map(i=>`<span class="${i<st.rating?'':'off'}" style="animation-delay:${.3+i*.15}s">★</span>`).join('')}</div>
      <h2 class="display ov-title">${VLABEL[s.answer]}</h2>
      <p class="ov-text">${s.wrap}</p>
      ${reasons?`<p class="ov-small">별이 줄어든 까닭: ${reasons}</p>`:''}
      ${next && !store.unlockAll ? `<p class="ov-small">새 미션 ${STARS[store.cur+1].id}이(가) 열렸어요.</p>` : ''}
      ${stage1Done() ? '<p class="ov-small">1단계를 모두 마쳤어요. 지도에서 2단계가 열렸어요.</p>' : ''}
      ${predLine}
      <div class="ov-actions">${next ? '<button class="btn primary wide" data-next>다음 미션으로</button>' : '<button class="btn primary wide" data-screen="map">탐사 지도 보기</button>'}
      <button class="btn wide" data-close>이 미션 정리 보기</button></div>`));
  }else{
    st.wrong++; save(); render(true);
    openOverlay(`<div class="stamp bad">반려</div>
      <p class="ov-text">${(s.hints && s.hints[st.choice]) || DEFAULT_HINT}</p>
      <p class="ov-small">이번 미션에서 받을 수 있는 별이 1개 줄었어요.</p>
      <div class="ov-actions"><button class="btn primary wide" data-close>다시 살펴보기</button></div>`, 'shake');
  }
}

/* ================= events ================= */
document.addEventListener('click', e=>{
  if(e.target===overlay){ closeOverlay(); return; }
  const t = e.target.closest('button'); if(!t || t.disabled) return;
  const d = t.dataset;
  if(d.simt!=null){ store.tcur = Number(d.simt); save(); render(); window.scrollTo(0,0); return; }
  if(d.close!=null){ closeOverlay(); return; }
  if(d.screen){ closeOverlay(); store.screen = d.screen; save(); render(); window.scrollTo(0,0); return; }
  if(d.go!=null){ goMission(Number(d.go)); return; }
  if(d.zgo!=null){ goZ(Number(d.zgo)); return; }
  if(d.tgo!=null){ goT(Number(d.tgo)); return; }
  if(d.tnext!=null){ closeOverlay(); goT(Math.min(store.tcur+1, TM.length-1)); return; }
  if(d.tmass){ TS().mass = Number(d.tmass); save(); render(true); return; }
  if(d.ttheta){ TS().theta = Number(d.ttheta); save(); render(true); return; }
  if(d.tsize){ TS().size = d.tsize; save(); render(true); return; }
  if(d.tplanet){ TS().sel = d.tplanet; save(); render(true); return; }
  if(d.taxis!=null){ const t = TS(); t.axis = t.axis==='fixed' ? 'auto' : 'fixed'; save(); render(true); return; }
  if(d.fill){ calc.expr = d.fill==='vr' ? '3E8*6E-5/600' : '30/0.5'; calc.sel = d.fill; updateCalcScreen(); render(true); toast('계산기에 식을 넣었어요. = 를 누른 뒤 넣기를 누르세요.'); return; }
  if(d.znext!=null){ closeOverlay(); goZ(Math.min(store.zcur+1, ZM.length-1)); return; }
  if(d.ob){
    if(d.ob==='skip' || d.ob==='done') obDone();
    else obGo(store.ob + (d.ob==='next' ? 1 : -1));
    return;
  }
  if(d.obgo!=null){ obGo(Number(d.obgo)); return; }
  if(d.stage){
    const v = Number(d.stage);
    if(v===2 && !stage2Open()){ toast('1단계 미션 7개를 모두 해결하면 열려요.'); return; }
    store.screen = 'map';
    closeOverlay(); store.stage = v; save(); render(); window.scrollTo(0,0); return;
  }
  if(d.pred){
    const st = S(STARS[store.cur]); st.pred = d.pred; save(); render();
    toast('예측을 기록했어요. 이제 관측해 보세요.');
    return;
  }
  if(d.zpred){
    const zs = store.z[ZM[store.zcur].key]; zs.pred = d.zpred; save(); render();
    toast('예측을 기록했어요. 이제 직접 찾아보세요.');
    return;
  }
  if(d.mark){ zMark(d.mark); return; }
  if(d.nudge){ zNudge(Number(d.nudge)); return; }
  if(d.pchoice){
    const zs = store.z[ZM[store.zcur].key]; zs.pChoice = d.pchoice; save();
    app.querySelectorAll('[data-pchoice]').forEach(b=>b.setAttribute('aria-checked', String(b.dataset.pchoice===d.pchoice)));
    const sb = app.querySelector('[data-act="zplanet"]'); if(sb) sb.disabled = false;
    return;
  }
  if(d.rq){
    const zs = store.screen==='tmission' ? TS() : store.z[ZM[store.zcur].key];
    zs.ans[d.rq] = d.rv; if(zs.fb[d.rq]==='no') delete zs.fb[d.rq];
    save(); render(true); return;
  }
  if(d.cq){
    const zs = store.z[ZM[store.zcur].key]; zs.ans[d.cq] = d.cv; if(zs.fb[d.cq]==='no') delete zs.fb[d.cq];
    save(); render(true); return;
  }
  if(d.cdq){
    const zs = store.z[ZM[store.zcur].key]; zs.ans[d.cdq] = d.cdv; if(zs.fb[d.cdq]==='no') delete zs.fb[d.cdq];
    save(); render(true); return;
  }
  if(d.open==='notebook'){ store.nbNew = false; save(); openOverlay(notebookHTML(),'sheet'); const nav = app.querySelectorAll('[data-open="notebook"]'); nav.forEach(el=>el.classList.remove('dot')); return; }
  if(d.evo){
    closeOverlay();
    const zs = store.z['z-evo']; zs.tab = d.evo; save(); render(true);
    const lab = $('#lab'); if(lab) lab.scrollIntoView({behavior:REDUCED?'auto':'smooth', block:'start'});
    return;
  }
  if(d.next!=null){ closeOverlay(); goMission(Math.min(store.cur+1, STARS.length-1)); return; }
  if(d.phase){ closeOverlay(); setPhase(d.phase); return; }
  if(d.open==='table'){ openOverlay(tableHTML(),'sheet'); return; }
  if(d.open==='help'){ openOverlay(helpHTML(),'sheet'); return; }
  if(d.cam){ setCam(d.cam); return; }
  if(d.obs){ observe(d.obs); return; }
  if(d.tab){ store.tab = d.tab; save(); render(true); return; }
  if(d.periodic){ answerPeriodic(d.periodic); return; }
  if(d.slot){
    const st = calcCtx().st;
    if(st.slotFb[d.slot] && st.slotFb[d.slot].ok){ toast('이미 맞힌 칸이에요.'); return; }
    calc.sel = d.slot;
    render(true);
    return;
  }
  if(d.key){ calcPress(d.key); return; }
  if(d.cst){
    const th = calcCtx().theta;
    calcInsert(d.cst==='c' ? '3E8' : d.cst==='l' ? '600' : String(COS[th]));
    return;
  }
  if(d.verdict){
    const st = S(STARS[store.cur]); st.choice = d.verdict; save();
    app.querySelectorAll('.vcard').forEach(b=>b.setAttribute('aria-checked', String(b.dataset.verdict===d.verdict)));
    const sub = app.querySelector('[data-act="submit"]'); if(sub) sub.disabled = false;
    return;
  }
  switch(d.act){
    case 'submit': submitVerdict(); break;
    case 'put': putValue(); break;
    case 'start': { closeOverlay(); if(store.seenOb){ store.screen = 'map'; } else { store.ob = 0; store.screen = 'onboard'; } save(); render(); window.scrollTo(0,0); break; }
    case 'howto': { closeOverlay(); store.ob = 0; store.screen = 'onboard'; save(); render(); window.scrollTo(0,0); break; }
    case 'notesave': finishNote(true); break;
    case 'noteskip': finishNote(false); break;
    case 'wsreveal': { const zs = store.z[ZM[store.zcur].key]; zs.showLabel = true; save(); render(true); break; }
    case 'zbounds': zCheckBounds(); break;
    case 'zplanet': zSubmitPlanet(); break;
    case 'zrule': zSubmitRule(); break;
    case 'tsubmit': tSubmit(); break;
    case 'tcalcdone': tCalcDone(); break;
    case 'treset': { const m = TM[store.tcur]; store.t[m.key] = tblank(m.type); calc.expr=''; calc.sel='dl'; save(); render(); window.scrollTo(0,0); break; }
    case 'zevo': zSubmitEvo(); break;
    case 'goevoq': { closeOverlay(); const q = $('#evoq'); if(q) q.scrollIntoView({behavior:REDUCED?'auto':'smooth', block:'start'}); break; }
    case 'zcheck': zSubmitCheck(); break;
    case 'zcond': zSubmitCond(); break;
    case 'gopcard': { closeOverlay(); const pc = $('#pcard'); if(pc) pc.scrollIntoView({behavior:REDUCED?'auto':'smooth', block:'start'}); break; }
    case 'zreset': { const m = ZM[store.zcur]; store.z[m.key] = zblank(m.type); save(); render(); window.scrollTo(0,0); break; }
    case 'dock': {
      calc.collapsed = !calc.collapsed;
      const dk = $('#dock');
      if(dk){ dk.classList.toggle('collapsed', calc.collapsed); t.textContent = calc.collapsed ? '계산기 펼치기' : '계산기 접기'; t.setAttribute('aria-expanded', String(!calc.collapsed)); }
      fitDock(); break;
    }
    case 'check': checkSlots(); break;
    case 'extra': closeOverlay(); startScan(d.k); break;
    case 'reset': { const s = STARS[store.cur]; store.stars[s.id] = blank(); store.phase = 'brief'; store.tab = null; calc.expr=''; calc.sel='dl'; save(); render(); window.scrollTo(0,0); break; }
    case 'unlock': store.unlockAll = !store.unlockAll; save(); closeOverlay(); render(); toast(store.unlockAll ? '모든 미션을 열었어요.' : '미션 잠금을 다시 켰어요.'); break;
    case 'wipe':
      openOverlay(`<div class="stamp bad">기록 삭제</div><p class="ov-text">1·2단계의 모든 기록과 별점을 지워요. 되돌릴 수 없어요.</p>
        <div class="ov-actions"><button class="btn primary wide" data-act="wipeYes">모두 지우기</button><button class="btn wide" data-close>취소</button></div>`);
      break;
    case 'wipeYes':
      STARS.forEach(s=>{ store.stars[s.id] = blank(); });
      ZM.forEach(m=>{ store.z[m.key] = zblank(m.type); });
      TM.forEach(m=>{ store.t[m.key] = tblank(m.type); });
      store.tcur = 0;
      store.stage = 1; store.zcur = 0; store.seenOb = false; store.notes = {};
      store.screen = 'title'; store.cur = 0; store.phase = 'brief'; store.tab = null; store.unlockAll = false;
      save(); closeOverlay(); render(); window.scrollTo(0,0); break;
  }
});
document.addEventListener('input', e=>{ if(e.target && e.target.id==='dist') onDist(e.target); });
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && overlay.classList.contains('open')){ closeOverlay(); return; }
  if(!$('#calcExpr') || overlay.classList.contains('open')) return;
  if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const map = {'Enter':'=','=':'=','Backspace':'back','Delete':'C','Escape':'C','e':'E','E':'E','x':'*','X':'*'};
  let k = map[e.key] || e.key;
  if(/^[0-9]$/.test(k) || ['+','-','*','/','.','=','back','C','E'].includes(k)){
    if(k==='=' && document.activeElement && document.activeElement.tagName==='BUTTON' && e.key==='Enter') return;
    e.preventDefault(); calcPress(k);
  }
});
let rz = null;
window.addEventListener('resize', ()=>{ clearTimeout(rz); rz = setTimeout(()=>{ fitDock(); drawAll(); }, 150); });
if(window.matchMedia){ const mq = window.matchMedia('(prefers-color-scheme: dark)'); if(mq.addEventListener) mq.addEventListener('change', drawAll); }
new MutationObserver(drawAll).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
if(document.fonts && document.fonts.ready) document.fonts.ready.then(drawAll);

render();
})();
</script>
