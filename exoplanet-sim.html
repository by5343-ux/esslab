<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>외계행성 탐사 시뮬레이션 (시뮬레이션만)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2fb; --panel:#ffffff; --panel-2:#eaeef8; --ink:#121a3a; --ink-2:#4b5578; --line:#cdd5ea;
  --accent:#a35f00; --accent-ink:#ffffff; --accent-soft:#fbecd2;
  --scan:#0a74a3; --scan-ink:#ffffff; --scan-soft:#dbeff8;
  --good:#0b7a4f; --good-soft:#d8f2e6; --bad:#c0392b; --bad-soft:#fbe1dd; --warn:#8a6300; --warn-soft:#f7edcc;
  --plot-bg:#f8faff; --plot-grid:#dfe5f3; --plot-ink:#121a3a; --plot-dot:#0a74a3; --orbit:#c47400;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1432; --panel:#18224f; --panel-2:#212d63; --ink:#eef1ff; --ink-2:#aeb7dc; --line:#324080;
    --accent:#ffc24b; --accent-ink:#1a1400; --accent-soft:#3d3522;
    --scan:#6fd6ff; --scan-ink:#0b1130; --scan-soft:#18375c;
    --good:#5fe0a8; --good-soft:#15403a; --bad:#ff8574; --bad-soft:#4a232d; --warn:#ffd466; --warn-soft:#3d3522;
    --plot-bg:#0b1130; --plot-grid:#243066; --plot-ink:#eef1ff; --plot-dot:#6fd6ff; --orbit:#ffc24b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1432; --panel:#18224f; --panel-2:#212d63; --ink:#eef1ff; --ink-2:#aeb7dc; --line:#324080;
  --accent:#ffc24b; --accent-ink:#1a1400; --accent-soft:#3d3522;
  --scan:#6fd6ff; --scan-ink:#0b1130; --scan-soft:#18375c;
  --good:#5fe0a8; --good-soft:#15403a; --bad:#ff8574; --bad-soft:#4a232d; --warn:#ffd466; --warn-soft:#3d3522;
  --plot-bg:#0b1130; --plot-grid:#243066; --plot-ink:#eef1ff; --plot-dot:#6fd6ff; --orbit:#ffc24b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  font-size:17px;line-height:1.65;word-break:keep-all;overflow-wrap:break-word}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.display{font-family:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;font-weight:400}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.app{max-width:640px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--panel);
  border-radius:12px;padding:10px 16px;min-height:48px;cursor:pointer;font-weight:600;text-align:center}
.btn:hover:not(:disabled){border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{font-size:1.15rem;min-height:58px;padding:12px 28px;border-radius:16px}
.btn.wide{width:100%}
.btn.small{min-height:40px;padding:6px 12px;font-size:.92rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:active:not(:disabled){transform:translateY(1px)}

/* title */
.title-screen{position:relative;flex:1;display:flex;align-items:center;color:#eef1ff;overflow:hidden;min-height:100vh;min-height:100dvh}
.title-screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.title-inner{position:relative;padding:40px 24px;width:100%}
.title-inner h1{font-size:3.5rem;line-height:1.02;color:#fff;margin-bottom:16px}
.lead{font-size:1.1rem;color:#d3daf6;max-width:30em}
.rules{list-style:none;padding:0;margin:28px 0 32px;display:grid;gap:14px}
.rules li{display:flex;gap:14px;align-items:center;font-size:1.03rem}
.rules .ri{width:44px;height:44px;border-radius:12px;background:rgba(111,214,255,.14);color:#6fd6ff;display:grid;place-items:center;flex-shrink:0}
.rules svg{width:28px;height:28px}
.title-screen .btn.primary{background:#ffc24b;border-color:#ffc24b;color:#1a1400}
.title-screen .btn.ghost{background:transparent;border-color:rgba(255,255,255,.35);color:#eef1ff}
.title-actions{display:flex;flex-wrap:wrap;gap:10px}

/* HUD */
.hud{position:sticky;top:0;z-index:6;display:grid;grid-template-columns:78px 1fr 78px;align-items:center;gap:8px;
  padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.hud-mid{text-align:center;min-width:0}
.hud-title{font-size:1.6rem;line-height:1.05}
.hud-sub{font-size:.88rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .btn{padding:6px 8px}

/* energy */
.energy{display:flex;align-items:center;gap:12px;padding:14px 16px 2px}
.energy-label{font-size:.9rem;font-weight:700;white-space:nowrap}
.cells{display:flex;gap:4px;flex:1}
.cell{flex:1;height:16px;border-radius:5px;background:var(--scan);transition:background .5s}
.cell.used{background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--line)}
.cell.over{background:var(--bad)}
.energy-text{font-size:.9rem;font-weight:700;white-space:nowrap}
.energy-text.over{color:var(--bad)}

/* stepper */
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px 16px}
.stepbtn{border:0;border-bottom:3px solid transparent;background:var(--panel);border-radius:12px;padding:6px 2px;min-height:56px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;color:var(--ink-2);font-weight:600;font-size:.92rem}
.stepbtn .sn{font-family:"Do Hyeon",system-ui,sans-serif;font-size:1.05rem}
.stepbtn .ok{color:var(--good)}
.stepbtn.on{color:var(--ink);background:var(--panel-2);border-bottom-color:var(--accent)}
.stepbtn:disabled{opacity:.38;cursor:not-allowed}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;margin:0 16px 14px}
.h{font-family:"Do Hyeon",system-ui,sans-serif;font-weight:400;font-size:1.45rem;line-height:1.2;margin-bottom:6px}
.note{color:var(--ink-2);font-size:.97rem;margin-bottom:14px}

/* brief */
.hero{display:flex;gap:16px;align-items:center}
.hero-star{width:88px;height:88px;flex-shrink:0;border-radius:50%;
  background:radial-gradient(circle,#fffbe8 0,#ffd46b 26%,rgba(255,190,70,.45) 48%,rgba(255,190,70,0) 70%)}
.hero-star.faint{opacity:.35;transform:scale(.55)}
.tagchip{display:inline-block;background:var(--scan-soft);border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:700}
.brief{margin-top:8px;font-size:1.05rem}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px 14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat.full{grid-column:1 / -1}
.sk{display:block;font-size:.85rem;color:var(--ink-2)}
.sv{display:block;font-size:1.12rem;font-weight:700}
.theta-big{font-family:"Do Hyeon",system-ui,sans-serif;font-size:2.8rem;line-height:1;color:var(--accent);margin:2px 0 8px}
.orbit3d{display:block;width:100%;height:270px;border-radius:14px;touch-action:none;cursor:grab}
.orbit3d:active{cursor:grabbing}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.seg button{border:1.5px solid var(--line);background:var(--panel-2);border-radius:10px;min-height:44px;cursor:pointer;font-weight:600;font-size:.92rem;padding:4px}
.seg button.on{border-color:var(--accent);background:var(--accent-soft)}
.nodir{border:2px dashed var(--line);border-radius:14px;padding:24px 16px;text-align:center;color:var(--ink-2)}

/* observe */
.methods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.method{position:relative;text-align:left;border:2px solid var(--line);background:var(--panel-2);border-radius:18px;padding:14px;cursor:pointer;
  display:flex;flex-direction:column;gap:4px;min-height:164px}
.method:hover:not(:disabled){border-color:var(--scan)}
.method .mi{width:44px;height:44px;color:var(--scan)}
.method .mi svg{width:100%;height:100%}
.method .mn{font-family:"Do Hyeon",system-ui,sans-serif;font-size:1.25rem;line-height:1.15;margin-top:4px;overflow-wrap:normal;white-space:nowrap}
.method .md{font-size:.88rem;color:var(--ink-2);line-height:1.45}
.pips{display:flex;gap:4px;margin-top:auto;padding-top:8px;align-items:center}
.pip{width:14px;height:14px;border-radius:4px;background:var(--scan)}
.pips .pl{font-size:.82rem;font-weight:700;margin-left:4px}
.method .badge{position:absolute;top:10px;right:10px;font-size:.78rem;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--good-soft);color:var(--good)}
.method.done{border-color:var(--good)}
.method.locked{opacity:.5}
.method:disabled{cursor:not-allowed}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--panel-2);border-radius:999px;
  padding:6px 14px;min-height:42px;cursor:pointer;font-weight:600;font-size:.95rem}
.tab svg{width:20px;height:20px}
.tab.on{background:var(--scan);border-color:var(--scan);color:var(--scan-ink)}
.empty{border:2px dashed var(--line);border-radius:14px;padding:26px 16px;text-align:center;color:var(--ink-2)}
.scanning{border-radius:14px;background:var(--scan-soft);padding:22px 16px;text-align:center}
.scanning .sc-title{font-family:"Do Hyeon",system-ui,sans-serif;font-size:1.3rem;margin-bottom:10px}
.scanbar{height:12px;border-radius:6px;background:var(--panel);overflow:hidden}
.scanbar i{display:block;height:100%;width:100%;background:var(--scan)}
@media (prefers-reduced-motion:no-preference){ .scanbar i{width:0;animation:fill 1.2s linear forwards} }
@keyframes fill{to{width:100%}}
canvas.plot{display:block;width:100%;height:240px;border-radius:12px}
canvas.plot.short{height:180px}
canvas.spec{display:block;width:100%;height:54px;border-radius:10px}
canvas.img{display:block;width:100%}
.cap{font-size:.93rem;color:var(--ink-2);margin:8px 0 14px}
.spec-legend{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:.82rem;color:var(--ink-2);margin-top:4px}
.spec-legend b{color:var(--ink);font-size:.9rem;text-align:center}

/* analyze */
.q{font-weight:700;font-size:1.07rem;margin:16px 0 8px}
.choice2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice2 button{border:2px solid var(--line);background:var(--panel-2);border-radius:14px;min-height:58px;padding:8px;font-weight:600;cursor:pointer}
.choice2 button.pick{border-color:var(--bad)}
.choice2 button.ok{border-color:var(--good);background:var(--good-soft)}
.choice2 button:disabled{cursor:default}
.msg{border-radius:14px;padding:12px 14px;margin-top:12px;font-size:.98rem}
.msg.good{background:var(--good-soft)}
.msg.bad{background:var(--bad-soft)}
.msg.warn{background:var(--warn-soft)}
.formula{background:var(--panel-2);border-radius:14px;padding:12px 16px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:1.08rem;line-height:2}
.consts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}
.const{background:var(--panel-2);border-radius:8px;padding:3px 10px;font-size:.95rem}
.const.hl{background:var(--accent-soft);font-weight:700}
.slots{display:grid;gap:8px}
.slot{display:grid;grid-template-columns:1fr auto;align-items:end;gap:0 10px;text-align:left;border:2px solid var(--line);background:var(--panel-2);
  border-radius:14px;padding:8px 14px 10px;cursor:pointer;width:100%}
.slot .sl{grid-column:1 / -1;font-size:.88rem;color:var(--ink-2);font-weight:600}
.slot .sv{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:1.4rem;font-weight:600;line-height:1.3}
.slot .sv.empty{font-family:inherit;font-size:.98rem;font-weight:500;color:var(--ink-2)}
.slot .su{color:var(--ink-2);font-size:.95rem;padding-bottom:3px;white-space:nowrap}
.slot.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.slot.ok{border-color:var(--good);background:var(--good-soft);cursor:default}
.slot.no{border-color:var(--bad)}
.slotmsg{font-size:.9rem;margin:2px 6px 4px;color:var(--bad)}
.calc{margin-top:14px;background:var(--panel-2);border-radius:20px;padding:12px}
.calc-head{display:flex;justify-content:space-between;align-items:center;margin:0 4px 8px;font-weight:700;font-size:.95rem}
.calc-head span{color:var(--ink-2);font-weight:500;font-size:.85rem}
.calc-screen{background:var(--plot-bg);border:1px solid var(--line);border-radius:14px;padding:10px 14px;text-align:right;min-height:88px;
  display:flex;flex-direction:column;justify-content:center}
.calc-expr{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:1.35rem;line-height:1.35;word-break:break-all;min-height:1.35em}
.calc-expr .ph{opacity:.45}
.calc-res{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:1.1rem;color:var(--scan);min-height:1.5em}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.key{min-height:54px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:1.25rem;font-weight:600;padding:0}
.key.op{background:var(--scan-soft)}
.key.fn{font-family:"IBM Plex Sans KR",system-ui,sans-serif;font-size:.95rem}
.key.eq{background:var(--scan);border-color:var(--scan);color:var(--scan-ink)}
.key b{display:block;line-height:1.1}
.key small{display:block;font-family:"IBM Plex Sans KR",system-ui,sans-serif;font-size:.64rem;font-weight:500;opacity:.85;line-height:1.1}
.key.cst{background:var(--accent-soft);font-size:1rem}
.key.put{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-family:"IBM Plex Sans KR",system-ui,sans-serif;font-size:.95rem;font-weight:700}
.key:disabled{opacity:.4;cursor:not-allowed}
/* bottom calculator dock */
.dock{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:640px;z-index:7;background:var(--panel);
  border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;box-shadow:0 -8px 28px rgba(0,0,0,.22);
  padding:0 12px calc(10px + env(safe-area-inset-bottom))}
.dock-handle{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;border:0;background:none;padding:6px 0 4px;cursor:pointer;
  font-weight:700;font-size:.85rem;color:var(--ink-2)}
.dock-handle::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--line)}
.targets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:6px}
.tgt{border:2px solid var(--line);background:var(--panel-2);border-radius:12px;min-height:46px;padding:2px 4px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;min-width:0}
.tgt .tl{font-size:.76rem;color:var(--ink-2);font-weight:600;white-space:nowrap}
.tgt .tv{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.98rem;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgt.sel{border-color:var(--accent);background:var(--accent-soft)}
.tgt.ok{border-color:var(--good);background:var(--good-soft)}
.tgt.no{border-color:var(--bad)}
.tcheck{min-height:46px;border-radius:12px;padding:0 12px}
.dock-hint{font-size:.86rem;color:var(--bad);margin:6px 2px 0;line-height:1.35}
.dock .calc-screen{min-height:54px;padding:4px 12px;margin-top:8px}
.dock .calc-expr{font-size:1.18rem}
.dock .calc-res{font-size:1rem}
.keys6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin-top:8px}
.keys6 .key{min-height:43px;font-size:1.1rem}
.dock.collapsed .dock-body{display:none}
.worknote{background:var(--scan-soft);border-radius:12px;padding:10px 14px;margin-top:12px;font-size:.95rem}
.key:active{transform:translateY(1px)}

/* judge */
.evidence{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.evidence li{display:flex;align-items:center;gap:12px;background:var(--panel-2);border-radius:14px;padding:10px 12px}
.evidence svg{width:28px;height:28px;color:var(--scan);flex-shrink:0}
.evidence b{display:block}
.evidence span{display:block;font-size:.9rem;color:var(--ink-2)}
.rulebox{background:var(--panel-2);border-radius:14px;padding:12px 14px;font-size:.95rem;margin-bottom:12px}
.verdicts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.vcard{border:2px solid var(--line);background:var(--panel-2);border-radius:18px;padding:14px 10px;text-align:center;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;min-height:156px}
.vcard svg{width:52px;height:52px;color:var(--ink-2)}
.vcard .vt{font-family:"Do Hyeon",system-ui,sans-serif;font-size:1.25rem;line-height:1.2;margin-top:4px}
.vcard .vd{font-size:.84rem;color:var(--ink-2);line-height:1.4}
.vcard[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.solved-box{text-align:center}
.solved-box .bigstars{font-size:2.2rem}

/* action bar */
.actionbar{position:sticky;bottom:0;z-index:5;margin-top:auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:var(--bg);border-top:1px solid var(--line)}
.spacer{height:8px}

/* map */
.mapwrap{position:relative;height:760px;overflow:hidden;border-radius:0 0 24px 24px}
.mapwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.mapwrap svg.route{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;background:none;border:0;
  cursor:pointer;color:#eef1ff;width:132px;padding:0}
.node .orb{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font-size:1.2rem;
  background:radial-gradient(circle,#ffffff 0,#bfe6ff 24%,rgba(111,214,255,.38) 48%,rgba(111,214,255,0) 72%)}
.node.solved .orb{background:radial-gradient(circle,#fffbe8 0,#ffd46b 26%,rgba(255,190,70,.45) 48%,rgba(255,190,70,0) 72%)}
.node.locked{cursor:not-allowed}
.node.locked .orb{background:radial-gradient(circle,#59618a 0,rgba(89,97,138,.35) 42%,rgba(89,97,138,0) 70%)}
.node.locked .nid,.node.locked .nt{opacity:.55}
.node .nid{font-family:"Do Hyeon",system-ui,sans-serif;font-size:1.3rem;line-height:1.1}
.node .nt{font-size:.85rem;color:#cfd6f5;line-height:1.3}
.node .ns{font-size:1rem;color:#ffc24b;letter-spacing:1px;line-height:1.3}
.node.next .orb{box-shadow:0 0 0 3px #ffc24b}
.node.locked .ns{color:#aab2d6}
@media (prefers-reduced-motion:no-preference){
  .node.next .orb{animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 3px #ffc24b}50%{box-shadow:0 0 0 9px rgba(255,194,75,.25)}}
}
.mapinfo{margin:14px 16px}
.banner{background:var(--accent-soft);border-radius:16px;padding:14px 16px;margin:14px 16px 0;text-align:center}
.banner .display{font-size:1.6rem}

/* overlay */
.overlay{position:fixed;inset:0;z-index:30;background:rgba(5,8,25,.66);display:none;align-items:center;justify-content:center;padding:16px}
.overlay.open{display:flex}
.ov-card{background:var(--panel);color:var(--ink);width:100%;max-width:460px;max-height:92vh;overflow:auto;border-radius:24px;padding:22px;text-align:center}
.ov-card.sheet{text-align:left}
.ov-title{font-size:1.7rem;line-height:1.2;margin:4px 0 10px}
.ov-text{text-align:left;font-size:1rem;margin-bottom:10px}
.ov-small{text-align:left;font-size:.9rem;color:var(--ink-2);margin-bottom:10px}
.ov-actions{display:grid;gap:8px;margin-top:16px}

function cssv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function gaussFn(r){return function(){let u=0,v=0;while(u===0)u=r();while(v===0)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};}
const amp = s => s.rv.vr*LAMBDA0/C_LIGHT*1e5;
const SUP = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
const sup = str => String(str).split('').map(c=>SUP[c]||c).join('');
function prettyNum(v){
  if(v==null || !isFinite(v)) return '';
  if(v===0) return '0';
  const a = Math.abs(v);
  if(a>=1e6 || a<1e-3){
    let e = Math.floor(Math.log10(a)); let m = v/Math.pow(10,e);
    m = Number(m.toPrecision(4));
    if(Math.abs(m)>=10){ m = m/10; e += 1; }
    return `${m}×10${sup(e)}`;
  }
  return String(Number(v.toPrecision(8)));
}
let toastT = null;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 2600); }

/* ================= calculator ================= */
const NUMRE = /^(\d+\.?\d*|\.\d+)(E-?\d+)?/;
function readNum(m){ return parseFloat(m[1]) * (m[2] ? Math.pow(10, parseInt(m[2].slice(1),10)) : 1); }
function evalExpr(str){
  if(!str) return null;
  const toks = []; let i = 0;
  while(i < str.length){
    const rest = str.slice(i), prev = toks[toks.length-1];
    let m = rest.match(NUMRE);
    if(m){ if(prev && prev.n!=null) return null; toks.push({n:readNum(m)}); i += m[0].length; continue; }
    const c = str[i];
    if(c==='-' && (!prev || prev.op)){
      m = str.slice(i+1).match(NUMRE); if(!m) return null;
      toks.push({n:-readNum(m)}); i += 1 + m[0].length; continue;
    }
    if('+-*/'.includes(c)){ if(!prev || prev.op) return null; toks.push({op:c}); i++; continue; }
    return null;
  }
  if(!toks.length || toks[toks.length-1].op) return null;
  const arr = toks.slice();
  for(let j=1; j<arr.length;){
    if(arr[j].op==='*' || arr[j].op==='/'){
      const a = arr[j-1].n, b = arr[j+1].n;
      if(arr[j].op==='/' && b===0) return null;
      arr.splice(j-1, 3, {n: arr[j].op==='*' ? a*b : a/b});
    }else j += 2;
  }
  let r = arr[0].n;
  for(let j=1; j<arr.length; j+=2) r = arr[j].op==='+' ? r + arr[j+1].n : r - arr[j+1].n;
  return isFinite(r) ? r : null;
}
function numToExpr(v){
  const a = Math.abs(v);
  if(v!==0 && (a>=1e6 || a<1e-3)){
    const [m,e] = v.toExponential(8).split('e');
    return `${Number(m)}E${parseInt(e,10)}`;
  }
  return String(Number(v.toPrecision(10)));
}
function prettyExpr(str){
  if(!str) return '<span class="ph">0</span>';
  let out = '', i = 0;
  while(i < str.length){
    const c = str[i];
    if(c==='E'){
      let j = i+1, ex = '';
      if(str[j]==='-'){ ex += '-'; j++; }
      while(j<str.length && /\d/.test(str[j])){ ex += str[j]; j++; }
      out += '×10' + (ex.replace('-','')==='' ? sup(ex)+'<span class="ph">ⁿ</span>' : sup(ex));
      i = j; continue;
    }
    out += c==='*' ? ' × ' : c==='/' ? ' ÷ ' : c==='+' ? ' + ' : c==='-' ? ((i===0 || '+-*/'.includes(str[i-1])) ? '−' : ' − ') : c;
    i++;
  }
  return out;
}
function calcPress(k){
  let e = calc.expr;
  const lastOp = /[+\-*/]$/.test(e) && !/E-$/.test(e);
  const inExp = /E-?\d*$/.test(e);
  if(k==='C'){ e = ''; }
  else if(k==='back'){ e = e.slice(0,-1); }
  else if(k==='E'){
    if(inExp) {}
    else if(/\d$/.test(e)) e += 'E';
    else if(/\.$/.test(e)) e += '0E';
    else if(e==='' || lastOp) e += '1E';
  }
  else if(k==='-'){
    if(/E$/.test(e)) e += '-';
    else if(e==='') e = calc.ans!=null ? numToExpr(calc.ans)+'-' : '-';
    else if(/[\d.]$/.test(e)) e += '-';
    else if(/[*/]$/.test(e)) e += '-';
    else if(/\+$/.test(e)) e = e.slice(0,-1) + '-';
  }
  else if('+*/'.includes(k)){
    if(e==='' && calc.ans!=null) e = numToExpr(calc.ans);
    if(/[\d.]$/.test(e)) e += k;
    else if(lastOp && e.length>1){ e = e.replace(/[+\-*/]+$/,'') + k; }
  }
  else if(k==='ans'){
    if(calc.ans!=null && (e==='' || lastOp)) e += numToExpr(calc.ans);
  }
  else if(k==='='){
    const v = evalExpr(e);
    if(v==null){ if(e) toast('식을 끝까지 완성하세요.'); }
    else { calc.ans = v; e = numToExpr(v); }
  }
  else if(k==='.'){
    const seg = e.split(/[+\-*/E]/).pop();
    if(inExp) {}
    else if(!seg.includes('.')) e += (seg==='' ? '0.' : '.');
  }
  else if(/^\d$/.test(k)){ e += k; }
  calc.expr = e.slice(0,40);
  updateCalcScreen();
}
function calcInsert(str){
  let e = calc.expr;
  if(/E-?$/.test(e)) return;
  if(/[\d.]$/.test(e)) e += '*';
  calc.expr = (e + str).slice(0,40);
  updateCalcScreen();
}
function updateCalcScreen(){
  const ex = $('#calcExpr'), rs = $('#calcRes'), put = $('#calcPut');
  if(!ex) return;
  ex.innerHTML = prettyExpr(calc.expr);
  const v = evalExpr(calc.expr);
  rs.textContent = v!=null ? '= ' + prettyNum(v) : '';
  if(put) put.disabled = (v==null);
}

/* ================= plotting ================= */
function setup(cv){
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  cv.width = Math.max(1, Math.round(w*dpr)); cv.height = Math.max(1, Math.round(h*dpr));
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx,w,h};
}
function plot(cv,o){
  const {ctx,w,h} = setup(cv);
  const pad = {l:60,r:18,t:12,b:42};
  const pw = w-pad.l-pad.r, ph = h-pad.t-pad.b;
  const X = x => pad.l + (x-o.xMin)/(o.xMax-o.xMin)*pw;
  const Y = y => pad.t + (1-(y-o.yMin)/(o.yMax-o.yMin))*ph;
  const ink2 = cssv('--ink-2'), grid = cssv('--plot-grid');
  ctx.fillStyle = cssv('--plot-bg'); ctx.fillRect(0,0,w,h);
  ctx.lineWidth = 1; ctx.font = '12px "IBM Plex Mono", ui-monospace, monospace';
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  o.yTicks.forEach(t=>{
    const y = Math.round(Y(t.v))+.5;
    ctx.strokeStyle = t.strong ? ink2 : grid; ctx.setLineDash(t.strong ? [5,4] : []);
    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(pad.l+pw,y); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = t.strong ? cssv('--ink') : ink2; ctx.fillText(t.label, pad.l-7, y);
  });
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  o.xTicks.forEach(t=>{
    const x = Math.round(X(t.v))+.5;
    ctx.strokeStyle = grid; ctx.beginPath(); ctx.moveTo(x,pad.t); ctx.lineTo(x,pad.t+ph); ctx.stroke();
    ctx.fillStyle = ink2;
    const tw = ctx.measureText(t.label).width;
    ctx.fillText(t.label, Math.min(Math.max(x, tw/2+2), w-tw/2-2), pad.t+ph+5);
  });
  ctx.font = '13px "IBM Plex Sans KR", system-ui, sans-serif';
  ctx.fillText(o.xLabel, pad.l+pw/2, pad.t+ph+22);
  ctx.save(); ctx.translate(13, pad.t+ph/2); ctx.rotate(-Math.PI/2); ctx.textBaseline = 'middle'; ctx.fillText(o.yLabel,0,0); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(pad.l,pad.t,pw,ph); ctx.clip();
  if(o.mode==='dots'){
    ctx.fillStyle = cssv('--plot-dot');
    o.pts.forEach(p=>{ ctx.beginPath(); ctx.arc(X(p[0]),Y(p[1]),2.1,0,Math.PI*2); ctx.fill(); });
  }else{
    ctx.strokeStyle = cssv('--plot-dot'); ctx.lineWidth = o.lw || 1.2; ctx.lineJoin = 'round';
    ctx.beginPath(); o.pts.forEach((p,i)=>{ const x = X(p[0]), y = Y(p[1]); if(i) ctx.lineTo(x,y); else ctx.moveTo(x,y); }); ctx.stroke();
  }
  if(o.after) o.after(ctx, X, Y, pad, pw, ph);
  ctx.restore();
  ctx.strokeStyle = cssv('--line'); ctx.strokeRect(pad.l+.5,pad.t+.5,pw-1,ph-1);
}
function rvData(s){
  const g = gaussFn(mulberry32(s.seed*13+5)); const pts = [];
  if(s.rv.type==='signal'){
    const A = amp(s);
    for(let t=0;t<=1095;t+=6) pts.push([t, A*Math.sin(2*Math.PI*t/365) + g()*A*0.035]);
    return {pts, yMax:A*1.4, ticks:[{v:A,s:1},{v:A/2},{v:0},{v:-A/2},{v:-A,s:1}]};
  }
  if(s.rv.type==='flat'){
    for(let t=0;t<=1095;t+=6) pts.push([t, g()*0.5]);
    return {pts, yMax:8, ticks:[{v:6},{v:3},{v:0},{v:-3},{v:-6}]};
  }
  for(let t=0;t<=1095;t+=6) pts.push([t, g()*22]);
  return {pts, yMax:70, ticks:[{v:60},{v:30},{v:0},{v:-30},{v:-60}]};
}
function drawRV(cv,s){
  const d = rvData(s);
  plot(cv,{xMin:0,xMax:1095,yMin:-d.yMax,yMax:d.yMax,mode:'dots',
    xTicks:[0,365,730,1095].map(v=>({v,label:String(v)})),
    yTicks:d.ticks.map(t=>({v:t.v,label:fmt(t.v),strong:!!t.s})),
    xLabel:'시간 (일)', yLabel:'Δλ (×10⁻⁵ nm)', pts:d.pts});
}
function lcData(s){
  const g = gaussFn(mulberry32(s.seed*17+3)); const pts = [];
  if(s.lc==='transit' || s.lc==='flat'){
    const centers = s.lc==='transit' ? [120,485,850] : [];
    for(let t=0;t<=1095;t++){ if(centers.some(c=>Math.abs(t-c)<1.5)) continue; pts.push([t, 1+g()*0.0007]); }
    centers.forEach(c=>pts.push([c-0.3,1],[c-0.2,0.99],[c+0.2,0.99],[c+0.3,1]));
    pts.sort((a,b)=>a[0]-b[0]);
    return {pts, yMin:0.984, yMax:1.006, ticks:[0.99,1].map(v=>({v,label:v.toFixed(2)}))};
  }
  if(s.lc==='outburst'){
    for(let t=0;t<=1095;t++){
      let f = 1 + g()*0.004;
      if(t>=418 && t<421) f = 1 + (t-418);
      else if(t>=421) f = 1 + 3*Math.exp(-(t-421)/45) + g()*0.004;
      pts.push([t,f]);
    }
    return {pts, yMin:0.5, yMax:4.5, ticks:[1,2,3,4].map(v=>({v,label:v.toFixed(2)}))};
  }
  for(let t=0;t<=1095;t++) pts.push([t, 1+g()*0.02]);
  return {pts, yMin:0.9, yMax:1.1, ticks:[0.95,1,1.05].map(v=>({v,label:v.toFixed(2)}))};
}
function drawLC(cv,s){
  const d = lcData(s);
  plot(cv,{xMin:0,xMax:1095,yMin:d.yMin,yMax:d.yMax,xTicks:[0,365,730,1095].map(v=>({v,label:String(v)})),

}
function drawLCZoom(cv,s){
  const g = gaussFn(mulberry32(s.seed*19+7)); const pts = [];
  for(let hr=-24; hr<=24; hr+=0.25){
    const x = Math.abs(hr); let f = 1;
    if(x <= 5.5) f = 0.99; else if(x < 6.5) f = 1 - 0.01*(6.5-x);
    pts.push([hr, f + g()*0.0007]);

  plot(cv,{xMin:-24,xMax:24,yMin:0.984,yMax:1.006,xTicks:[-24,-12,0,12,24].map(v=>({v,label:String(v)})),

}
function drawML(cv,s){
  const g = gaussFn(mulberry32(s.seed*23+1)); const pts = [];
  for(let t=0; t<=80.001; t+=0.1){
    const u = Math.hypot(0.15,(t-40)/12);
    let A = (u*u+2)/(u*Math.sqrt(u*u+4));
    A += 1.1*Math.exp(-((t-47.5)**2)/(2*0.18*0.18));
    pts.push([t, A + g()*0.03]);
  }
  plot(cv,{xMin:0,xMax:80,yMin:0,yMax:7.6,xTicks:[0,20,40,60,80].map(v=>({v,label:String(v)})),
    yTicks:[1,2,4,6].map(v=>({v,label:String(v)})),xLabel:'시간 (일)',yLabel:'배경별 밝기 (배)',pts,lw:1.3});
}
function drawDirect(cv,s){

    const r = mulberry32(s.seed*31+k*97);

      ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(cx,cy,size*0.34,0,Math.PI*2); ctx.fill();
      for(let i=0;i<40;i++){ const a = r()*Math.PI*2, rr = size*(0.13+r()*0.12); ctx.fillStyle = `rgba(255,230,180,${0.08+r()*0.2})`; ctx.beginPath(); ctx.arc(cx+Math.cos(a)*rr, cy+Math.sin(a)*rr, 0.6+r()*1.2, 0, Math.PI*2); ctx.fill(); }
      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(cx,cy,size*0.12,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,225,160,.35)'; ctx.lineWidth = 1; ctx.stroke();

function drawSky(cv, seed){
  const {ctx,w,h} = setup(cv);

  g.addColorStop(0,'#1c2658'); g.addColorStop(.55,'#101840'); g.addColorStop(1,'#070b22');
  ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
  const neb = ctx.createRadialGradient(w*0.78,h*0.22,0,w*0.78,h*0.22,Math.max(w,h)*0.5);
  neb.addColorStop(0,'rgba(120,90,210,.28)'); neb.addColorStop(1,'rgba(120,90,210,0)');
  ctx.fillStyle = neb; ctx.fillRect(0,0,w,h);

  for(let i=0;i<n;i++){

    ctx.beginPath(); ctx.arc(x,y,rad,0,Math.PI*2); ctx.fill();
  }
}

/* spectrum strip */
let anims = [], rafId = null;
function addSpec(cv,s){
  const dims = setup(cv);
  const r = mulberry32(s.seed*41);
  let jitter = 0, lastJ = 0;
  anims.push({cv, draw(ts){
    const {ctx,w,h} = dims;
    let val;
    if(s.rv.type==='signal') val = REDUCED ? 0 : Math.sin(2*Math.PI*(ts%7000)/7000);
    else { if(ts-lastJ>120){ jitter = (r()-0.5)*(s.rv.type==='noisy'?1.2:0.06); lastJ = ts; } val = REDUCED ? 0 : jitter; }
    const grd = ctx.createLinearGradient(0,0,w,0);
    grd.addColorStop(0,'#9acd32'); grd.addColorStop(.25,'#ffd400'); grd.addColorStop(.5,'#ff8c00'); grd.addColorStop(.75,'#ff4500'); grd.addColorStop(1,'#c40000');
    ctx.fillStyle = grd; ctx.fillRect(0,0,w,h);
    const x0 = w/2;
    ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.setLineDash([3,3]); ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(x0+.5,0); ctx.lineTo(x0+.5,h); ctx.stroke(); ctx.setLineDash([]);
    if(REDUCED && s.rv.type==='signal'){ ctx.fillStyle = 'rgba(10,10,20,.45)'; ctx.fillRect(x0-w*0.09-1.5,0,3,h); ctx.fillRect(x0+w*0.09-1.5,0,3,h); }
    const x = x0 + val*w*0.09;
    ctx.fillStyle = s.rv.type==='noisy' ? 'rgba(10,10,20,.55)' : '#0a0a14';
    ctx.fillRect(x-2.5,0,5,h);
    const label = $('#specState');
    if(label){
      let txt;
      if(REDUCED && s.rv.type==='signal') txt = '흡수선이 두 위치 사이를 오가요';
      else if(s.rv.type==='noisy') txt = '흡수선이 흐리고 불규칙하게 흔들려요';
      else if(Math.abs(val) < 0.15) txt = '기준 위치 근처';
      else txt = val < 0 ? '← 짧은 파장 쪽 (청색 편이)' : '긴 파장 쪽 (적색 편이) →';
      if(label.textContent !== txt) label.textContent = txt;
    }
  }});
}
function startLoop(){
  if(rafId) return;
  const loop = ts=>{ anims = anims.filter(a=>a.cv.isConnected); anims.forEach(a=>a.draw(ts)); rafId = anims.length ? requestAnimationFrame(loop) : null; };
  rafId = requestAnimationFrame(loop);
}

/* 3D orbit */
const CAM_PRESETS = {oblique:{yaw:-0.9,pitch:0.7}, side:{yaw:0,pitch:0}, observer:{yaw:Math.PI/2,pitch:0}};
const cam = {yaw:-0.9, pitch:0.7, preset:'oblique'};
let orbitCv = null, orbitStar = null, camTween = null;
function drawOrbit3D(cv,s){
  const {ctx,w,h} = setup(cv);
  const th = s.theta*Math.PI/180;
  const U = [0,0,1], W = [Math.cos(th), -Math.sin(th), 0];
  const D = 7, SC = Math.min(w, h*1.35)/5.8;
  const ca = Math.cos(cam.yaw), sa = Math.sin(cam.yaw), cb = Math.cos(cam.pitch), sb = Math.sin(cam.pitch);
  const P = p => { const x = p[0]*ca + p[2]*sa, z = -p[0]*sa + p[2]*ca, y = p[1]; const y2 = y*cb - z*sb, z2 = y*sb + z*cb; const k = D/(D-z2); return [w/2 + x*k*SC, h/2 - y2*k*SC, z2, k]; };
  const inPlane = (r,t) => [0,1,2].map(i=>r*(Math.cos(t)*U[i] + Math.sin(t)*W[i]));
  const ink = cssv('--plot-ink'), ink2 = cssv('--ink-2'), orbit = cssv('--orbit');
  ctx.fillStyle = cssv('--plot-bg'); ctx.fillRect(0,0,w,h);
  const R = 1.6, N = 96;
  const ring = r => { ctx.beginPath(); for(let i=0;i<=N;i++){ const q = P(inPlane(r, i/N*Math.PI*2)); if(i) ctx.lineTo(q[0],q[1]); else ctx.moveTo(q[0],q[1]); } };
  ring(R); ctx.globalAlpha = .22; ctx.fillStyle = orbit; ctx.fill(); ctx.globalAlpha = 1;
  ctx.strokeStyle = orbit; ctx.lineWidth = 2.4; ctx.stroke();
  ring(R*0.5); ctx.globalAlpha = .45; ctx.lineWidth = 1; ctx.stroke();
  ctx.globalAlpha = .35;
  [[0,Math.PI],[Math.PI/2,Math.PI*1.5]].forEach(([a,b])=>{ const A = P(inPlane(R,a)), B = P(inPlane(R,b)); ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.stroke(); });
  ctx.globalAlpha = 1;
  const far = P([2.4,0,0]), st = P([0,0,0]);
  ctx.strokeStyle = ink2; ctx.setLineDash([4,4]); ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(st[0],st[1]); ctx.lineTo(far[0],far[1]); ctx.stroke(); ctx.setLineDash([]);
  const a0 = P([-2.5,0,0]), a1 = P([-0.32,0,0]);
  const len = Math.hypot(a1[0]-a0[0], a1[1]-a0[1]);
  if(s.theta > 0 && len > 18){
    const arm = P(inPlane(R, Math.PI/2));
    ctx.strokeStyle = ink2; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(st[0],st[1]); ctx.lineTo(arm[0],arm[1]); ctx.stroke(); ctx.setLineDash([]);
    const ra = 0.9; ctx.strokeStyle = ink; ctx.lineWidth = 1.8; ctx.beginPath();
    for(let i=0;i<=30;i++){ const f = th*i/30; const q = P([ra*Math.cos(f), -ra*Math.sin(f), 0]); if(i) ctx.lineTo(q[0],q[1]); else ctx.moveTo(q[0],q[1]); }
    ctx.stroke();
    const lq = P([(ra+0.3)*Math.cos(th/2), -(ra+0.3)*Math.sin(th/2), 0]);
    ctx.fillStyle = ink; ctx.font = '600 16px "IBM Plex Sans KR", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('θ', lq[0], lq[1]);
  }
  const sr = 10*st[3];
  const g = ctx.createRadialGradient(st[0],st[1],0,st[0],st[1],sr*2.2);
  g.addColorStop(0,'#fff6d6'); g.addColorStop(.4,'#ffc94d'); g.addColorStop(1,'rgba(255,201,77,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(st[0],st[1],sr*2.2,0,Math.PI*2); ctx.fill();
  ctx.textBaseline = 'middle';
  if(len > 18){
    ctx.strokeStyle = ink; ctx.fillStyle = ink; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(a0[0],a0[1]); ctx.lineTo(a1[0],a1[1]); ctx.stroke();
    const ang = Math.atan2(a1[1]-a0[1], a1[0]-a0[0]), hl = 12;
    ctx.beginPath(); ctx.moveTo(a1[0],a1[1]); ctx.lineTo(a1[0]-hl*Math.cos(ang-0.42), a1[1]-hl*Math.sin(ang-0.42)); ctx.lineTo(a1[0]-hl*Math.cos(ang+0.42), a1[1]-hl*Math.sin(ang+0.42)); ctx.closePath(); ctx.fill();
    const ex = a0[0], ey = a0[1];
    ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(ex-10,ey); ctx.quadraticCurveTo(ex,ey-9,ex+10,ey); ctx.quadraticCurveTo(ex,ey+9,ex-10,ey); ctx.stroke();
    ctx.beginPath(); ctx.arc(ex,ey,2.8,0,Math.PI*2); ctx.fill();
    ctx.font = '600 13px "IBM Plex Sans KR", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('관측자', ex, ey+20);
  }else{
    ctx.fillStyle = ink; ctx.font = '13px "IBM Plex Sans KR", system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('관측자가 보는 모습 (시선 방향은 화면 안쪽)', 12, h-16);
  }
  const lp = P(inPlane(R*1.16, Math.PI*0.75));
  ctx.fillStyle = orbit; ctx.font = '600 13px "IBM Plex Sans KR", system-ui, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('궤도면', lp[0], lp[1]);
}
function syncCamButtons(){ app.querySelectorAll('[data-cam]').forEach(b=>b.classList.toggle('on', b.dataset.cam===cam.preset)); }
function bindOrbit(cv,s){
  orbitCv = cv; orbitStar = s; drawOrbit3D(cv,s);
  if(cv._bound) return; cv._bound = true;
  let drag = null;
  cv.addEventListener('pointerdown', e=>{ drag = {x:e.clientX,y:e.clientY}; try{cv.setPointerCapture(e.pointerId);}catch(_){} if(camTween){cancelAnimationFrame(camTween); camTween=null;} });
  cv.addEventListener('pointermove', e=>{
    if(!drag) return;
    cam.yaw += (e.clientX-drag.x)*0.012;
    cam.pitch = Math.max(-1.45, Math.min(1.45, cam.pitch + (e.clientY-drag.y)*0.012));
    drag = {x:e.clientX,y:e.clientY};
    if(cam.preset){ cam.preset = null; syncCamButtons(); }
    drawOrbit3D(cv,s);
  });
  const end = ()=>{ drag = null; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
}
function setCam(name){
  const target = CAM_PRESETS[name]; if(!target) return;
  cam.preset = name; syncCamButtons();
  const from = cam.yaw % (Math.PI*2);
  let dy = target.yaw - from; dy = ((dy + Math.PI) % (Math.PI*2) + Math.PI*2) % (Math.PI*2) - Math.PI;
  const fp = cam.pitch, dp = target.pitch - fp;
  if(camTween) cancelAnimationFrame(camTween);
  const redraw = ()=>{ if(orbitCv && orbitCv.isConnected) drawOrbit3D(orbitCv, orbitStar); };
  if(REDUCED){ cam.yaw = from+dy; cam.pitch = target.pitch; redraw(); return; }
  const t0 = performance.now(), dur = 450;
  const step = now=>{ const t = Math.min(1,(now-t0)/dur), e = t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; cam.yaw = from+dy*e; cam.pitch = fp+dp*e; redraw(); camTween = t<1 ? requestAnimationFrame(step) : null; };
  camTween = requestAnimationFrame(step);
}

function drawAll(){
  anims = [];
  const s = STARS[store.cur];
  app.querySelectorAll('canvas[data-plot]').forEach(cv=>{
    const k = cv.dataset.plot;
    if(k==='sky') drawSky(cv, 5);
    else if(k==='obcv'){
      if(!anims.some(a=>a.tag==='ob')) anims.push({cv, tag:'ob', draw(ts){
        const c = app.querySelector('canvas[data-plot="obcv"]');
        if(c) drawOb(c, Number(c.dataset.i||0), ts);
      }});
    }
    else if(k==='rv') drawRV(cv,s);
    else if(k==='spec') addSpec(cv,s);
    else if(k==='lc') drawLC(cv,s);
    else if(k==='lcz') drawLCZoom(cv,s);
    else if(k==='img') drawDirect(cv,s);
    else if(k==='ml') drawML(cv,s);
    else if(k==='orbit3d') bindOrbit(cv, store.screen==='tmission' ? {id:'연습별', theta:TS().theta} : s);
    else if(k==='t1sys' || k==='t1spec' || k==='t1rv'){
      if(!anims.some(a=>a.tag==='t1')) anims.push({cv, tag:'t1', draw(ts){
        const t = TS(); if(!t) return;
        const sys = app.querySelector('canvas[data-plot="t1sys"]'), sp = app.querySelector('canvas[data-plot="t1spec"]'), rv = app.querySelector('canvas[data-plot="t1rv"]');
        if(!sys || !sp || !rv) return;
        const frac = drawWobbleSys(sys, t.mass, ts);
        drawSpecStrip(sp, frac*Math.min(1, Math.pow(t.mass/10,0.5)));
        drawLiveRV(rv, 6*t.mass, (ts%7000)/7000, 62);
        const lab = $('#t1state');
        if(lab){ const txt = Math.abs(frac)<0.2 ? '기준 위치 근처' : frac<0 ? '← 청색 편이 (다가옴)' : '적색 편이 (멀어짐) →'; if(lab.textContent!==txt) lab.textContent = txt; }
      }});
    }
    else if(k==='t2rv'){ const t = TS(); drawLiveRV(cv, 6*COS[t.theta], 1, 8); }
    else if(k==='t2lc'){ const t = TS(); drawLC(cv, {seed:9, lc: t.theta<=8 ? 'transit' : 'flat'}); }
    else if(k==='t3sim' || k==='t3lc'){
      if(!anims.some(a=>a.tag==='t3')) anims.push({cv, tag:'t3', draw(ts){
        const t = TS(); if(!t) return;
        const sim = app.querySelector('canvas[data-plot="t3sim"]'), lc = app.querySelector('canvas[data-plot="t3lc"]');
        if(!sim || !lc) return;
        const sz = T_SIZES.find(x=>x[0]===t.size), depth = sz[3]*sz[3];
        const r = drawTransitSim(sim, sz[3], ts);
        drawTransitLC(lc, depth, r.ph, t.axis==='fixed');
      }});
    }
    else if(k==='t3var') drawVarStar(cv);
    else if(k==='t5lc') drawMultiLC(cv);
    else if(k==='t5sim' || k==='t5live'){
      if(!anims.some(a=>a.tag==='t5')) anims.push({cv, tag:'t5', draw(ts){
        const sim = app.querySelector('canvas[data-plot="t5sim"]'), live = app.querySelector('canvas[data-plot="t5live"]');
        if(!sim || !live) return;
        const t = drawT5Sim(sim, ts);
        drawT5Live(live, t);
      }});
    }
    else if(k==='t5zoom') drawMultiZoom(cv, T_PLANETS.find(x=>x.k===TS().sel), TS().axis==='fixed');
    else if(k==='t4rv') drawRV(cv, T4_STAR);
    else if(k==='zplanet'){ const c = labCtx(); if(c) drawZPlanet(cv, c.star, xToD(c.st.x)); }
    else if(k==='zstrip'){ const c = labCtx(); if(c) drawZStrip(cv, c.star, c.st, c.planet); }
    else if(k==='zsum') drawZSummary(cv);
    else if(k==='zchart') drawZChart(cv);
  });
  if(anims.length) startLoop();
}


/* ================= stage 2: helpers & drawing ================= */
const xToD = x => D_MIN*Math.pow(D_RATIO, x/1000);
const hzIn = z => HZ_IN*Math.sqrt(z.L), hzOut = z => HZ_OUT*Math.sqrt(z.L);
const waterState = (d,z) => d < hzIn(z) ? 'steam' : d > hzOut(z) ? 'ice' : 'liquid';
const WLABEL = {steam:'수증기', liquid:'액체', ice:'얼음'};
const WCOLOR = {steam:'#f0a64b', liquid:'#3b8cff', ice:'#d7ecff'};
function fmtAU(d){ return d<0.1 ? d.toFixed(3) : d<10 ? d.toFixed(2) : d.toFixed(1); }
function fmtHZ(v){ return (v>=1 && v<2) ? v.toFixed(2) : v.toPrecision(2); }
function hexRgb(h){ const n = parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function rgba(h,a){ const c = hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
const stage1Done = () => STARS.every(s=>S(s).solved);
const stage2Open = () => store.unlockAll || stage1Done();
const zUnlocked = i => stage2Open() && (store.unlockAll || i===0 || store.z[ZM[i-1].key].solved);
const stage2Stars = () => ZM.reduce((a,m)=>a + (store.z[m.key].solved ? store.z[m.key].rating : 0), 0);
function glowStyle(z, base){

}

function drawZPlanet(cv,z,d){
  const {ctx,w,h} = setup(cv);
  ctx.fillStyle = '#050817'; ctx.fillRect(0,0,w,h);
  const r0 = mulberry32(99);
  for(let i=0;i<60;i++){ ctx.fillStyle = `rgba(255,255,255,${0.15+r0()*0.5})`; ctx.beginPath(); ctx.arc(r0()*w, r0()*h, 0.4+r0()*0.8, 0, Math.PI*2); ctx.fill(); }
  const flux = z.L/(d*d);
  const a = Math.max(0.12, Math.min(0.95, 0.42*Math.pow(flux,0.3)));
  const lg = ctx.createRadialGradient(-w*0.05,h/2,0,-w*0.05,h/2,w*0.85);
  lg.addColorStop(0,rgba(z.color,a)); lg.addColorStop(0.35,rgba(z.color,a*0.35)); lg.addColorStop(1,rgba(z.color,0));
  ctx.fillStyle = lg; ctx.fillRect(0,0,w,h);
  const stt = waterState(d,z);
  const R = Math.min(h*0.38, w*0.26), cx = w*0.6, cy = h/2;
  const rr = mulberry32(7);
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.clip();
  if(stt==='liquid'){
    const og = ctx.createLinearGradient(cx-R,cy-R,cx+R,cy+R); og.addColorStop(0,'#3d8fe0'); og.addColorStop(1,'#154a8c');
    ctx.fillStyle = og; ctx.fillRect(cx-R,cy-R,2*R,2*R);
    for(let i=0;i<6;i++){ ctx.fillStyle = i%2 ? '#5b8f3a' : '#8a7a45'; ctx.beginPath(); ctx.ellipse(cx+(rr()-0.5)*1.6*R, cy+(rr()-0.5)*1.6*R, R*(0.15+rr()*0.25), R*(0.08+rr()*0.15), rr()*3, 0, Math.PI*2); ctx.fill(); }
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = R*0.07; ctx.lineCap = 'round';
    for(let i=0;i<5;i++){ const y = cy-R+(i+0.5)*2*R/5+(rr()-0.5)*R*0.2, x0 = cx-R+rr()*R; ctx.beginPath(); ctx.moveTo(x0,y); ctx.quadraticCurveTo(x0+R*0.4,y-R*0.12,x0+R*(0.6+rr()*0.5),y+R*0.05); ctx.stroke(); }
  }else if(stt==='ice'){
    const ig = ctx.createLinearGradient(cx-R,cy-R,cx+R,cy+R); ig.addColorStop(0,'#f4f9ff'); ig.addColorStop(1,'#a9c4de');
    ctx.fillStyle = ig; ctx.fillRect(cx-R,cy-R,2*R,2*R);
    ctx.strokeStyle = 'rgba(80,120,160,.55)'; ctx.lineWidth = 1.4;
    for(let i=0;i<9;i++){ let x = cx+(rr()-0.5)*2*R, y = cy+(rr()-0.5)*2*R; ctx.beginPath(); ctx.moveTo(x,y); for(let j=0;j<4;j++){ x += (rr()-0.5)*R*0.6; y += (rr()-0.5)*R*0.6; ctx.lineTo(x,y); } ctx.stroke(); }
  }else{
    const sg = ctx.createLinearGradient(cx-R,cy-R,cx+R,cy+R); sg.addColorStop(0,'#f3dfb8'); sg.addColorStop(1,'#b98a4e');
    ctx.fillStyle = sg; ctx.fillRect(cx-R,cy-R,2*R,2*R);
    ctx.lineWidth = R*0.14;
    for(let i=0;i<8;i++){
      const y0 = cy-R+(i+0.5)*2*R/8;
      ctx.strokeStyle = i%2 ? 'rgba(255,248,235,.55)' : 'rgba(214,160,100,.45)';
      ctx.beginPath();
      for(let x=cx-R; x<=cx+R; x+=4){ const y = y0 + Math.sin((x-cx)/R*3+i)*R*0.06; if(x===cx-R) ctx.moveTo(x,y); else ctx.lineTo(x,y); }
      ctx.stroke();
    }
  }
  const sh = ctx.createLinearGradient(cx-R,0,cx+R,0);
  sh.addColorStop(0,'rgba(0,0,0,0)'); sh.addColorStop(0.55,'rgba(0,0,0,.15)'); sh.addColorStop(1,'rgba(0,0,0,.75)');
  ctx.fillStyle = sh; ctx.fillRect(cx-R,cy-R,2*R,2*R);
  ctx.restore();
  ctx.lineWidth = stt==='steam' ? R*0.12 : 2;
  ctx.strokeStyle = stt==='steam' ? 'rgba(255,230,190,.45)' : 'rgba(140,190,255,.35)';
  ctx.beginPath(); ctx.arc(cx,cy,stt==='steam'?R*1.04:R+1.5,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.font = '13px "IBM Plex Sans KR", system-ui, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(`← ${z.id}의 빛`, 12, h-14);
}

function labCtx(){

  if(!m) return null;
  if(m.type==='star') return {m, zs, star:m, st:zs, planet: zs.found ? m.planet : null};
  if(m.type==='evo'){ const E = EVO.find(e=>e.k===zs.tab); return {m, zs, star:Object.assign({id:'HX-1'}, E), st:zs.st[zs.tab], planet:1.0}; }
  return null;
}
function drawZStrip(cv,z,zs,planet){
  const {ctx,w,h} = setup(cv);
  ctx.fillStyle = cssv('--plot-bg'); ctx.fillRect(0,0,w,h);
  const L0 = 42, Rp = 16, ay = h-30;
  const X = d => L0 + Math.log(d/D_MIN)/Math.log(D_RATIO)*(w-L0-Rp);
  ctx.fillStyle = '#070b22'; ctx.beginPath(); ctx.arc(18,ay-16,15,0,Math.PI*2); ctx.fill();
  const sg = ctx.createRadialGradient(18,ay-16,0,18,ay-16,15*Math.min(1,0.6+0.3*z.rs));
  sg.addColorStop(0,'#ffffff'); sg.addColorStop(.45,z.color); sg.addColorStop(1,rgba(z.color,0));
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(18,ay-16,15,0,Math.PI*2); ctx.fill();
  const ink = cssv('--ink'), ink2 = cssv('--ink-2');
  ctx.strokeStyle = ink2; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(L0,ay); ctx.lineTo(w-Rp,ay); ctx.stroke();
  ctx.font = '12px "IBM Plex Mono", ui-monospace, monospace'; ctx.fillStyle = ink2; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  [0.03,0.3,3,30].forEach(t=>{ const x = X(t); ctx.beginPath(); ctx.moveTo(x,ay-2); ctx.lineTo(x,ay+2); ctx.stroke(); });
  [0.01,0.1,1,10,100].forEach(t=>{ const x = X(t); ctx.beginPath(); ctx.moveTo(x,ay-5); ctx.lineTo(x,ay+5); ctx.stroke(); ctx.fillText(String(t), x, ay+7); });
  ctx.textAlign = 'left'; ctx.fillText('AU', 4, ay+7);
  ctx.font = '600 12px "IBM Plex Sans KR", system-ui, sans-serif';
  if(zs.found){
    const x1 = X(hzIn(z)), x2 = X(hzOut(z));
    ctx.fillStyle = cssv('--good-soft'); ctx.fillRect(x1,ay-36,x2-x1,36);
    ctx.strokeStyle = cssv('--good'); ctx.lineWidth = 2; ctx.strokeRect(x1,ay-36,x2-x1,36);
    ctx.fillStyle = cssv('--good'); ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    const lx = Math.min(Math.max((x1+x2)/2, 44), w-44);
    ctx.fillText('생명가능지대', lx, ay-40);
  }else{
    const flag = (d,color,label,right)=>{
      const x = X(d);
      ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(x,ay); ctx.lineTo(x,ay-50); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x,ay-50); ctx.lineTo(x+(right?12:-12),ay-45); ctx.lineTo(x,ay-40); ctx.closePath(); ctx.fill();
      ctx.textBaseline = 'bottom'; ctx.textAlign = right ? 'left' : 'right';
      ctx.fillText(label, x+(right?3:-3), ay-52);
    };
    if(zs.inner!=null) flag(zs.inner, cssv('--bad'), '안쪽', false);
    if(zs.outer!=null) flag(zs.outer, cssv('--scan'), '바깥쪽', true);
  }
  if(planet!=null){
    const xp = X(planet);
    ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.setLineDash([3,2]);
    ctx.beginPath(); ctx.arc(xp,ay-14,11,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
  }
  const d = xToD(zs.x), stt = waterState(d,z), xc = X(d);
  ctx.fillStyle = WCOLOR[stt]; ctx.strokeStyle = '#1d3350'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(xc,ay-14,7,0,Math.PI*2); ctx.fill(); ctx.stroke();
}

function drawZChart(cv){
  const {ctx,w,h} = setup(cv);
  const pad = {l:58,r:12,t:14,b:58};
  const pw = w-pad.l-pad.r, ph = h-pad.t-pad.b;
  const Y = d => pad.t + (1 - Math.log(d/0.1)/Math.log(200))*ph;
  const ink = cssv('--plot-ink'), ink2 = cssv('--ink-2'), grid = cssv('--plot-grid');
  ctx.fillStyle = cssv('--plot-bg'); ctx.fillRect(0,0,w,h);
  ctx.font = '12px "IBM Plex Mono", ui-monospace, monospace'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  [0.1,0.3,1,3,10].forEach(t=>{ const y = Math.round(Y(t))+.5; ctx.strokeStyle = grid; ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(pad.l+pw,y); ctx.stroke(); ctx.fillStyle = ink2; ctx.fillText(String(t), pad.l-7, y); });
  const list = Z_STARS.slice().sort((a,b)=>a.temp-b.temp);
  list.forEach((z,i)=>{
    const x = pad.l + (i+0.5)*pw/list.length;
    const found = store.z['z-'+z.id].found;
    if(found){
      const y1 = Y(hzOut(z)), y2 = Y(hzIn(z));
      ctx.fillStyle = z.color; ctx.fillRect(x-14,y1,28,y2-y1);
      ctx.strokeStyle = ink; ctx.lineWidth = 1.5; ctx.strokeRect(x-14,y1,28,y2-y1);
    }else{
      ctx.strokeStyle = ink2; ctx.setLineDash([3,3]); ctx.strokeRect(x-14,Y(3),28,Y(0.3)-Y(3)); ctx.setLineDash([]);
      ctx.fillStyle = ink2; ctx.textAlign = 'center'; ctx.fillText('?', x, Y(1));
    }
    ctx.fillStyle = ink; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.font = '600 12px "IBM Plex Mono", ui-monospace, monospace';
    ctx.fillText(String(z.temp), x, pad.t+ph+6);
    ctx.fillStyle = ink2; ctx.font = '11px "IBM Plex Sans KR", system-ui, sans-serif';
    ctx.fillText(z.id, x, pad.t+ph+22);
    ctx.font = '12px "IBM Plex Mono", ui-monospace, monospace'; ctx.textBaseline = 'middle';
  });
  ctx.fillStyle = ink2; ctx.font = '13px "IBM Plex Sans KR", system-ui, sans-serif';
  ctx.save(); ctx.translate(13, pad.t+ph/2); ctx.rotate(-Math.PI/2); ctx.textAlign = 'center'; ctx.fillText('별에서의 거리 (AU)', 0, 0); ctx.restore();
  ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText('중심별의 표면 온도 (K)', pad.l+pw/2, pad.t+ph+38);
  ctx.strokeStyle = cssv('--line'); ctx.strokeRect(pad.l+.5,pad.t+.5,pw-1,ph-1);
}

function zPredCard(z,zs){

        : `<div class="choices3" role="radiogroup" aria-label="행성 판정">${['hot','in','cold'].map(k=>`<button class="vcard small" role="radio" aria-checked="${zs.pChoice===k}" data-pchoice="${k}">${PICON[k]}<span class="vt">${PLABEL[k]}</span><span class="vd">${PDESC[k]}</span></button>`).join('')}</div>`}

function onDist(el){
  const c = labCtx(); if(!c) return;

  if(ws && ws.dataset.s!==stt){ ws.dataset.s = stt; ws.className = 'wstate '+stt; ws.innerHTML = `표면의 물<b>${WLABEL[stt]}</b>`; }
  const c1 = app.querySelector('canvas[data-plot="zplanet"]'), c2 = app.querySelector('canvas[data-plot="zstrip"]');
  if(c1) drawZPlanet(c1,m,d);
  if(c2) drawZStrip(c2,m,zs,c.planet);
  saveSoon();
}
function zNudge(dir){
  const c = labCtx(); if(!c) return;
  const zs = c.st;
  const el = $('#dist'); if(!el) return;
  el.value = String(Math.max(0, Math.min(1000, zs.x + dir*4)));
  onDist(el);
}
function zMark(which){
  const c = labCtx(); if(!c) return;

  zs[which] = xToD(zs.x);
  save(); render(true);

}
function zCheckBounds(){
  const c = labCtx(); if(!c) return;
  const {m, zs:ms, star:z, st:zs} = c;
  if(zs.inner==null || zs.outer==null) return;
  if(zs.inner >= zs.outer){
    openOverlay(`<div class="stamp warn">순서 확인</div><p class="ov-text">안쪽 경계가 바깥쪽 경계보다 멀어요. 별에 더 가까운 쪽이 안쪽 경계예요.</p>
      <p class="ov-small">틀린 것으로 치지 않아요.</p><div class="ov-actions"><button class="btn primary wide" data-close>다시 표시하기</button></div>`);
    return;
  }
  const tin = hzIn(z), tout = hzOut(z), tol = Math.log(1.08);
  const okI = Math.abs(Math.log(zs.inner/tin)) <= tol, okO = Math.abs(Math.log(zs.outer/tout)) <= tol;
  if(okI && okO){
    zs.found = true; store.nbNew = true;
    save(); render(true);
    if(m.type==='star'){
      openOverlay(`<div class="stamp good">경계 발견</div>
        <p class="ov-text">${z.id}(${z.temp.toLocaleString('en-US')} K)의 생명가능지대는 약 <b>${fmtHZ(tin)} ~ ${fmtHZ(tout)} AU</b>예요. 기록장에 적어 두었어요.</p>
        <p class="ov-text">이제 이 별을 도는 행성을 판정해 보세요.</p>
        <div class="ov-actions"><button class="btn primary wide" data-act="gopcard">행성 판정하기</button></div>`);
    }else{
      const left = EVO.filter(e=>!ms.st[e.k].found);
      openOverlay(`<div class="stamp good">경계 발견</div>
        <p class="ov-text">${z.stage} 단계 HX-1의 생명가능지대는 약 <b>${fmtHZ(tin)} ~ ${fmtHZ(tout)} AU</b>예요.</p>
        ${left.length ? `<p class="ov-text">이제 ${left[0].stage} 단계의 경계도 찾아보세요.</p><div class="ov-actions"><button class="btn primary wide" data-evo="${left[0].k}">${left[0].stage} 단계로</button></div>`
          : `<p class="ov-text">두 단계를 모두 찾았어요. 아래 질문에 답해 보세요.</p><div class="ov-actions"><button class="btn primary wide" data-act="goevoq">질문 보기</button></div>`}`);
    }
    return;
  }
  const parts = [];
  if(!okI) parts.push(zs.inner < tin ? '안쪽 경계를 별에 너무 가깝게 잡았어요.' : '안쪽 경계를 별에서 너무 멀게 잡았어요.');
  if(!okO) parts.push(zs.outer < tout ? '바깥쪽 경계를 별에 너무 가깝게 잡았어요.' : '바깥쪽 경계를 별에서 너무 멀게 잡았어요.');
  ms.wrongB++; save(); render(true);
  openOverlay(`<div class="stamp bad">다시 측정</div>
    <p class="ov-text">${parts.join(' ')} 물의 상태가 바뀌는 바로 그 거리에서 표시해 보세요. − + 버튼으로 조금씩 옮기면 찾기 쉬워요.</p>
    ${ms.wrongB===1?'<p class="ov-small">이번 미션에서 받을 수 있는 별이 1개 줄었어요.</p>':''}
    <div class="ov-actions"><button class="btn primary wide" data-close>다시 찾기</button></div>`, 'shake');
}

function zSubmitPlanet(){
  const z = ZM[store.zcur], zs = store.z[z.key];

  if(zs.pChoice===z.pAns){
    zs.solved = true;

  <section class="card" id="lab">
    <h2 class="h">행성 거리 조정실</h2>
    ${!st.found ? '<p class="note">이 단계에서 물이 액체로 있을 수 있는 거리 두 경계를 찾으세요. 점선 원은 HX-1의 행성(1 AU) 자리예요.</p>' : '<p class="note">점선 원은 HX-1의 행성(1 AU) 자리예요.</p>'}

function zSubmitEvo(){
  const m = ZM[store.zcur], zs = store.z[m.key];

  EVO_Q.forEach(q=>{ const ok = zs.ans[q.k]===q.ans; zs.fb[q.k] = ok ? 'ok' : 'no'; if(!ok) bad++; });
  if(!bad){

function drawZSummary(cv){
  const rows = summaryRows();
  const RH = 52, top = 10, bottom = 46;
  cv.style.height = (top + rows.length*RH + bottom) + 'px';
  const {ctx,w,h} = setup(cv);
  const L0 = 50, Rp = 18;
  const X = d => L0 + Math.log10(d/0.01)/4*(w-L0-Rp);
  const ink = cssv('--plot-ink'), ink2 = cssv('--ink-2'), grid = cssv('--plot-grid');
  ctx.fillStyle = cssv('--plot-bg'); ctx.fillRect(0,0,w,h);
  const yEnd = top + rows.length*RH;
  [0.03,0.3,3,30].forEach(t=>{ const x = Math.round(X(t))+.5; ctx.strokeStyle = grid; ctx.setLineDash([2,3]); ctx.beginPath(); ctx.moveTo(x,top); ctx.lineTo(x,yEnd); ctx.stroke(); });
  ctx.setLineDash([]);
  [0.01,0.1,1,10,100].forEach(t=>{ const x = Math.round(X(t))+.5; ctx.strokeStyle = grid; ctx.beginPath(); ctx.moveTo(x,top); ctx.lineTo(x,yEnd); ctx.stroke(); });
  ctx.strokeStyle = ink2; ctx.setLineDash([4,3]); ctx.beginPath(); ctx.moveTo(15.5,top); ctx.lineTo(15.5,yEnd); ctx.stroke(); ctx.setLineDash([]);
  rows.forEach((r,i)=>{
    const y0 = top + i*RH, cy = y0 + 34;
    if(i){ ctx.strokeStyle = cssv('--line'); ctx.beginPath(); ctx.moveTo(0,y0+.5); ctx.lineTo(w,y0+.5); ctx.stroke(); }
    ctx.textBaseline = 'top'; ctx.textAlign = 'left';
    ctx.fillStyle = ink; ctx.font = '600 13px "IBM Plex Sans KR", system-ui, sans-serif';
    ctx.fillText(r.name, L0+2, y0+5);
    const nw = ctx.measureText(r.name).width;
    ctx.fillStyle = ink2; ctx.font = '12px "IBM Plex Sans KR", system-ui, sans-serif';
    ctx.fillText(r.sub, L0+nw+8, y0+6);
    ctx.fillStyle = '#070b22'; ctx.beginPath(); ctx.arc(15.5,cy,12,0,Math.PI*2); ctx.fill();
    const gr = 12*Math.max(0.35, Math.min(1.25, r.rs));
    const g = ctx.createRadialGradient(15.5,cy,0,15.5,cy,gr);
    g.addColorStop(0,'#ffffff'); g.addColorStop(.45,r.color); g.addColorStop(1,rgba(r.color,0));
    ctx.save(); ctx.beginPath(); ctx.arc(15.5,cy,12,0,Math.PI*2); ctx.clip(); ctx.fillStyle = g; ctx.fillRect(3,cy-12,25,24); ctx.restore();
    ctx.strokeStyle = cssv('--line'); ctx.beginPath(); ctx.moveTo(L0,cy+.5); ctx.lineTo(w-Rp,cy+.5); ctx.stroke();
    const zin = HZ_IN*Math.sqrt(r.L), zout = HZ_OUT*Math.sqrt(r.L);
    if(r.hz){
      const x1 = X(zin), x2 = X(zout);
      ctx.fillStyle = cssv('--good-soft'); ctx.fillRect(x1,cy-9,Math.max(3,x2-x1),18);
      ctx.strokeStyle = cssv('--good'); ctx.lineWidth = 1.8; ctx.strokeRect(x1,cy-9,Math.max(3,x2-x1),18); ctx.lineWidth = 1;
    }
    if(r.show){
      const stt = r.planet < zin ? 'steam' : r.planet > zout ? 'ice' : 'liquid';
      ctx.fillStyle = WCOLOR[stt]; ctx.strokeStyle = '#1d3350'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(X(r.planet),cy,6.5,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.lineWidth = 1;
    }else{
      ctx.fillStyle = ink2; ctx.font = '12px "IBM Plex Sans KR", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(r.hz ? '행성 판정 전' : '아직 풀지 않은 미션', L0 + (w-L0-Rp)/2, cy);
    }
  });
  ctx.fillStyle = ink2; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.font = '12px "IBM Plex Mono", ui-monospace, monospace';
  [0.01,0.1,1,10,100].forEach(t=>{ const x = X(t); const tw = ctx.measureText(String(t)).width; ctx.fillText(String(t), Math.min(x, w-tw/2-2), yEnd+6); });
  ctx.fillText('0', 15.5, yEnd+6);
  ctx.font = '12px "IBM Plex Sans KR", system-ui, sans-serif';
  ctx.fillText('별에서의 거리 (AU)', L0 + (w-L0-Rp)/2, yEnd+24);
}

    const f = store.z['z-'+z.id].found;
    return `<tr><td>${z.id}</td><td class="mono">${z.temp.toLocaleString('en-US')} K</td><td>${f ? `<span class="mono">${fmtHZ(hzIn(z))} ~ ${fmtHZ(hzOut(z))} AU</span>` : '아직 찾지 않음'}</td></tr>`;
  }).join('');
  const ev = store.z['z-evo'];
  const erows = EVO.filter(e=>e.k!=='ms').map(e=>{
    const st = Object.assign({id:'HX-1'}, e);
    return `<tr><td>HX-1<br><small>${e.stage}</small></td><td class="mono">${e.temp.toLocaleString('en-US')} K</td><td>${ev.st[e.k].found ? `<span class="mono">${fmtHZ(hzIn(st))} ~ ${fmtHZ(hzOut(st))} AU</span>` : '아직 찾지 않음'}</td></tr>`;
  }).join('');
  const noteKeys = Object.keys(store.notes);
  const notes = noteKeys.length
    ? `<ul class="notelist">${noteKeys.map(k=>`<li><b>${store.notes[k].label}</b>${store.notes[k].text}</li>`).join('')}</ul>`
    : '<p class="ov-small">아직 쓴 기록이 없어요. 미션을 마칠 때 한 줄씩 남길 수 있어요.</p>';
  const hzTotal = Z_STARS.length + 2;
  const hzDone = Z_STARS.filter(z=>store.z['z-'+z.id].found).length + (ev.st.rg.found?1:0) + (ev.st.wd.found?1:0);
  const prog = `<div class="nbprog"><b>생명가능지대 기록 ${hzDone} / ${hzTotal}</b><div class="nbbar"><i style="width:${Math.round(hzDone/hzTotal*100)}%"></i></div></div>

  return `<h2 class="display">기록장</h2>
  ${prog}
  <h3 class="display" style="font-size:1.3rem">내가 쓴 한 줄 기록</h3>
  ${notes}
  <h3 class="display" style="font-size:1.3rem;margin-top:16px">내가 찾은 생명가능지대</h3>

}

function multiPts(){
  const g = gaussFn(mulberry32(21)); const pts = []; const dips = [];
  T_PLANETS.forEach(p=>{ for(let t=p.phase; t<=400; t+=p.period) dips.push({t, d:p.depth, p}); });
  for(let t=0;t<=400;t+=0.5){
    if(dips.some(x=>Math.abs(t-x.t)<0.8)) continue;
    pts.push([t, 1+g()*0.00012]);
  }
  dips.forEach(x=>pts.push([x.t-0.35,1],[x.t-0.25,1-x.d],[x.t+0.25,1-x.d],[x.t+0.35,1]));
  pts.sort((a,b)=>a[0]-b[0]);
  return {pts, dips};
}
const T5_A = {A:0.34, B:0.60, C:1.0};
const T5_DUR = 26000;
function t5Geom(w,h){
  const aMax = w/2 - 16;
  const Rs = Math.max(13, aMax*0.15);
  return {cx:w/2, cy:h*0.52, aMax, Rs};
}
function t5Bright(t, w, h){
  const {aMax, Rs} = t5Geom(w,h);
  let f = 1;
  T_PLANETS.forEach(p=>{
    const a = aMax*T5_A[p.k], rp = Math.max(2, Rs*Math.sqrt(p.depth)*3);
    const ph = 2*Math.PI*(t - p.phase)/p.period;
    const x = a*Math.sin(ph), z = a*Math.cos(ph);
    if(z <= 0) return;
    const o = Math.max(0, Math.min(1, (Rs + rp - Math.abs(x))/(2*rp)));
    f -= p.depth*o;
  });
  return f;
}
let t5Cache = null;
function t5Model(w,h){
  if(t5Cache && t5Cache.w===w && t5Cache.h===h) return t5Cache.pts;
  const pts = [];
  for(let t=0;t<=400;t+=0.25) pts.push([t, t5Bright(t,w,h)]);
  t5Cache = {w,h,pts};
  return pts;
}

  const g = ctx.createRadialGradient(cx,cy,0,cx,cy,Rs*1.8);

}

function obLabel(ctx, text, x, y, size, color, align){
  ctx.font = `${size}px "IBM Plex Sans KR", system-ui, sans-serif`;
  ctx.fillStyle = color || 'rgba(255,255,255,.85)';
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
}
function obBg(cv){
  const {ctx,w,h} = setup(cv);
  ctx.clearRect(0,0,w,h);
  const r = mulberry32(88);
  for(let i=0;i<40;i++){ ctx.fillStyle = `rgba(255,255,255,${0.1+r()*0.35})`; ctx.beginPath(); ctx.arc(r()*w, r()*h, 0.4+r()*0.8, 0, Math.PI*2); ctx.fill(); }
  return {ctx,w,h};
}
function drawObGoal(cv, ts){
  const {ctx,w,h} = obBg(cv);
  const cx = w/2, cy = h/2;
  const rIn = Math.min(w,h)*0.26, rOut = Math.min(w,h)*0.36;
  ctx.fillStyle = 'rgba(95,224,168,.16)';
  ctx.beginPath(); ctx.arc(cx,cy,rOut,0,Math.PI*2); ctx.arc(cx,cy,rIn,0,Math.PI*2,true); ctx.fill();
  ctx.strokeStyle = 'rgba(95,224,168,.55)'; ctx.lineWidth = 1.5;
  [rIn,rOut].forEach(r=>{ ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke(); });
  obLabel(ctx, '생명가능지대', cx, cy - rOut - 14, 13, 'rgba(95,224,168,.9)');
  const a1 = 2*Math.PI*((ts%9000)/9000), a2 = 2*Math.PI*((ts%15000)/15000) + 1.1;
  const rA = (rIn+rOut)/2, rB = Math.min(w,h)*0.46;
  ctx.strokeStyle = 'rgba(180,200,255,.25)'; ctx.setLineDash([3,4]);
  [rA,rB].forEach(r=>{ ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke(); }); ctx.setLineDash([]);
  const wob = 5;
  const sx = cx - wob*Math.cos(a1), sy = cy - wob*Math.sin(a1);
  const g = ctx.createRadialGradient(sx,sy,0,sx,sy,30);
  g.addColorStop(0,'#fff8e2'); g.addColorStop(.35,'#ffc94d'); g.addColorStop(1,'rgba(255,201,77,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx,sy,30,0,Math.PI*2); ctx.fill();
  const px = cx + rA*Math.cos(a1), py = cy + rA*Math.sin(a1);
  const pg = ctx.createRadialGradient(px,py,0,px,py,12);
  pg.addColorStop(0,'rgba(120,190,255,.9)'); pg.addColorStop(1,'rgba(120,190,255,0)');
  ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(px,py,12,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#4f9ff5'; ctx.beginPath(); ctx.arc(px,py,7,0,Math.PI*2); ctx.fill();
  const qx = cx + rB*Math.cos(a2), qy = cy + rB*Math.sin(a2);
  ctx.fillStyle = '#dfeaf6'; ctx.beginPath(); ctx.arc(qx,qy,5,0,Math.PI*2); ctx.fill();
  obLabel(ctx, '액체 물 가능', px, py - 18, 12, 'rgba(160,215,255,.95)');
  obLabel(ctx, '너무 차가움', qx, qy - 15, 12, 'rgba(210,225,245,.8)');
}
function drawObTime(cv, ts){
  const {ctx,w,h} = obBg(cv);
  const cyc = 6000, ph = (ts%cyc)/cyc;
  const used = ph < 0.18 ? 0 : ph < 0.45 ? Math.min(4, Math.ceil((ph-0.18)/0.07)) : ph < 0.72 ? Math.min(7, 4 + Math.ceil((ph-0.45)/0.09)) : 7;
  const n = 7, gap = 8, x0 = 30, bw = (w-60-gap*(n-1))/n, y = h*0.38;
  for(let i=0;i<n;i++){
    ctx.fillStyle = i < used ? 'rgba(255,255,255,.18)' : '#6fd6ff';
    const x = x0 + i*(bw+gap);
    ctx.beginPath(); ctx.roundRect(x, y, bw, 22, 6); ctx.fill();
  }
  obLabel(ctx, '망원경 시간', 30, y-16, 13, 'rgba(255,255,255,.8)', 'left');
  obLabel(ctx, `${7-used}시간 남음`, w-30, y-16, 13, '#ffc24b', 'right');
  const label = ph < 0.45 ? '시선속도 관측  4시간' : ph < 0.72 ? '식현상 관측  3시간' : '남은 시간 0시간';
  ctx.fillStyle = 'rgba(255,255,255,.1)';
  ctx.beginPath(); ctx.roundRect(w/2-110, h*0.62, 220, 46, 14); ctx.fill();
  obLabel(ctx, label, w/2, h*0.62+23, 15, '#ffffff');
  obLabel(ctx, ph < 0.72 ? '방법을 고르면 시간이 줄어요' : '무엇이 통할지 먼저 예상하세요', w/2, h*0.86, 13, 'rgba(255,255,255,.7)');
}
function drawObTheta(cv, ts){
  const {ctx,w,h} = obBg(cv);
  const cyc = 9000, ph = (ts%cyc)/cyc;
  const th = 45 - 45*Math.cos(2*Math.PI*ph);
  const rad = th*Math.PI/180;
  const cx = w*0.32, cy = h*0.34, L = Math.min(w*0.2, 52);
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.setLineDash([4,4]); ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(cx-L-30, cy); ctx.lineTo(cx+L+22, cy); ctx.stroke(); ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(cx-L-38,cy); ctx.quadraticCurveTo(cx-L-28,cy-8,cx-L-18,cy); ctx.quadraticCurveTo(cx-L-28,cy+8,cx-L-38,cy); ctx.stroke();
  ctx.strokeStyle = '#ffc24b'; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - L*Math.cos(rad), cy + L*Math.sin(rad));
  ctx.lineTo(cx + L*Math.cos(rad), cy - L*Math.sin(rad));
  ctx.stroke(); ctx.lineCap = 'butt';
  const g = ctx.createRadialGradient(cx,cy,0,cx,cy,16);
  g.addColorStop(0,'#fff8e2'); g.addColorStop(.4,'#ffc94d'); g.addColorStop(1,'rgba(255,201,77,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx,cy,16,0,Math.PI*2); ctx.fill();
  obLabel(ctx, `θ = ${th.toFixed(0)}°`, w*0.75, cy-10, 22, '#ffffff');
  obLabel(ctx, th < 15 ? '옆에서 보는 중' : th > 75 ? '정면에서 보는 중' : '비스듬히 보는 중', w*0.75, cy+18, 13, 'rgba(255,255,255,.75)');
  const gy = h*0.74, amp = 30*Math.cos(rad);
  ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(26,gy); ctx.lineTo(w-26,gy); ctx.stroke();
  ctx.strokeStyle = '#6fd6ff'; ctx.lineWidth = 2.4; ctx.beginPath();
  for(let x=26;x<=w-26;x+=3){ const y = gy - amp*Math.sin((x-26)/(w-52)*4*Math.PI); if(x===26) ctx.moveTo(x,y); else ctx.lineTo(x,y); }
  ctx.stroke();
  obLabel(ctx, '관측되는 시선속도', w/2, gy+44, 13, 'rgba(255,255,255,.7)');
}
function drawObFlow(cv, ts){
  const {ctx,w,h} = obBg(cv);
  const steps = ['브리핑','관측','분석','판정'];
  const sub = ['예측하기','자료 모으기','계산하기','증거로 결론'];
  const cyc = 6400, on = Math.floor((ts%cyc)/(cyc/4));
  const bw = Math.min(70, (w-60)/4), gap = (w-40-bw*4)/3;
  steps.forEach((t,i)=>{
    const x = 20 + i*(bw+gap), y = h*0.3, active = i<=on;
    ctx.fillStyle = active ? 'rgba(255,194,75,.22)' : 'rgba(255,255,255,.07)';
    ctx.beginPath(); ctx.roundRect(x, y, bw, 62, 14); ctx.fill();
    ctx.strokeStyle = i===on ? '#ffc24b' : 'rgba(255,255,255,.15)'; ctx.lineWidth = i===on ? 2.4 : 1;
    ctx.beginPath(); ctx.roundRect(x, y, bw, 62, 14); ctx.stroke();
    obLabel(ctx, String(i+1), x+bw/2, y+20, 15, active ? '#ffc24b' : 'rgba(255,255,255,.5)');
    obLabel(ctx, t, x+bw/2, y+42, 14, active ? '#ffffff' : 'rgba(255,255,255,.5)');
    if(i<3){ ctx.strokeStyle = i<on ? '#ffc24b' : 'rgba(255,255,255,.2)'; ctx.lineWidth = 2;
      const ax = x+bw+gap/2;
      ctx.beginPath(); ctx.moveTo(ax-6, y+31); ctx.lineTo(ax+4, y+31); ctx.moveTo(ax, y+27); ctx.lineTo(ax+4, y+31); ctx.lineTo(ax, y+35); ctx.stroke(); }
  });
  obLabel(ctx, sub[on], w/2, h*0.68, 17, '#ffffff');
  obLabel(ctx, '단계는 위쪽 버튼으로 언제든 오갈 수 있어요', w/2, h*0.84, 13, 'rgba(255,255,255,.7)');
}
function drawObStar(cv, ts){
  const {ctx,w,h} = obBg(cv);
  const cyc = 6000, t = (ts%cyc)/1000;
  const cy = h*0.42;
  for(let i=0;i<3;i++){
    const st = 0.4 + i*0.6;
    const k = Math.max(0, Math.min(1, (t-st)/0.45));
    const sc = k<1 ? 0.4 + 1.1*k - 0.5*k*k : 1;
    if(k<=0) { ctx.fillStyle = 'rgba(255,255,255,.18)'; }
    else ctx.fillStyle = '#ffc24b';
    ctx.save(); ctx.translate(w/2 + (i-1)*58, cy); ctx.scale(sc,sc);
    ctx.font = '44px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('★', 0, 0); ctx.restore();
  }
  if(t > 2.6){
    ctx.fillStyle = 'rgba(95,224,168,.18)';
    ctx.beginPath(); ctx.roundRect(w/2-108, h*0.63, 216, 40, 12); ctx.fill();
    obLabel(ctx, '예측 적중  ★ +1', w/2, h*0.63+20, 15, '#5fe0a8');
  }
  obLabel(ctx, t>4 ? '틀린 판정이나 시간 초과는 ★ 1개씩 감점' : '한 번에 맞히고 시간을 아끼면 ★★★', w/2, h*0.86, 13, 'rgba(255,255,255,.75)');
}
function drawOb(cv, i, ts){
  if(i===0) drawObGoal(cv, ts);
  else if(i===1) drawObTime(cv, ts);
  else if(i===2) drawObTheta(cv, ts);
  else if(i===3) drawObFlow(cv, ts);

}

function obGo(i){

}
function obDone(){
  store.seenOb = true; store.screen = 'map'; save(); render(); window.scrollTo(0,0);
}

const PHASES = [['brief','브리핑'],['observe','관측'],['analyze','분석'],['judge','판정']];
function analyzeDone(st){ return st.rvcalc || (st.periodicOk && st.periodic==='no'); }
function phaseDone(p,st){
  if(p==='observe') return st.observed.length>0;
  if(p==='analyze') return analyzeDone(st);
  if(p==='judge') return st.solved;
  return false;
}
function renderMission(){

  else if(store.phase==='observe') body = phaseObserve(s,st);

function dockVisible(s,st){
  if(store.screen==='tmission') return TM[store.tcur].type==='calc' && !store.t.t4.rvcalc;

function dockHTML(s,st){
  const th = s.theta;
  const v = evalExpr(calc.expr);
  const tgt = (k,label)=>{
    const val = st.slots[k], fb = st.slotFb[k];
    const ok = fb && fb.ok, no = fb && !fb.ok;
    return `<button class="tgt ${calc.sel===k && !ok?'sel':''} ${ok?'ok':''} ${no?'no':''}" data-slot="${k}" aria-pressed="${calc.sel===k}"
      aria-label="${label} 칸${val==null?', 비어 있음':', '+prettyNum(val)}${ok?', 정답':''}">
      <span class="tl">${label}${ok?' ✓':''}</span><span class="tv">${val==null?'–':prettyNum(val)}</span></button>`;
  };
  const selFb = st.slotFb[calc.sel];
  const K = (k,label,cls,aria)=>`<button class="key ${cls||''}" data-key="${k}" aria-label="${aria||label}">${label}</button>`;
  const C = (k,main,subtxt,aria)=>`<button class="key cst" data-cst="${k}" aria-label="${aria}"><b>${main}</b><small>${subtxt}</small></button>`;
  const keys = [
    K('7','7'),K('8','8'),K('9','9'),K('/','÷','op','나누기'),K('C','AC','fn','모두 지우기'),C('c','c','광속','광속 c 넣기'),
    K('4','4'),K('5','5'),K('6','6'),K('*','×','op','곱하기'),K('back','⌫','fn','한 글자 지우기'),C('l','λ₀','기준 파장','기준 파장 600 넣기'),
    K('1','1'),K('2','2'),K('3','3'),K('-','−','op','빼기'),K('E','×10ⁿ','op','곱하기 10의 거듭제곱'),C('cos','cos',`${th}°`,`cos ${th}도 값 넣기`),
    K('0','0'),K('.','.'),K('ans','ANS','fn','직전 결과'),K('+','+','op','더하기'),K('=','=','eq','계산하기'),
    `<button class="key put" id="calcPut" data-act="put" ${v==null?'disabled':''}>넣기</button>`
  ].join('');
  return `<div class="dock ${calc.collapsed?'collapsed':''}" id="dock" role="region" aria-label="계산기">
    <button class="dock-handle" data-act="dock" aria-expanded="${!calc.collapsed}">${calc.collapsed?'계산기 펼치기':'계산기 접기'}</button>
    <div class="targets" role="group" aria-label="값을 넣을 칸">
      ${tgt('dl','Δλ ×10⁻⁵')}${tgt('vr','vᵣ m/s')}${tgt('v','v m/s')}
      <button class="btn tcheck" data-act="check">확인</button>
    </div>
    <div class="dock-body">
      ${selFb && !selFb.ok ? `<p class="dock-hint">${selFb.msg}</p>` : ''}
      <div class="calc-screen"><div class="calc-expr" id="calcExpr" aria-live="polite">${prettyExpr(calc.expr)}</div><div class="calc-res" id="calcRes">${v!=null?'= '+prettyNum(v):''}</div></div>
      <div class="keys6">${keys}</div>
    </div>
  </div>`;
}

function actionButton(s,st){
  const p = store.phase;
  if(p==='brief') return `<button class="btn primary big wide" data-phase="observe">관측하러 가기</button>`;
  if(p==='observe'){
    if(!st.pred && !st.solved) return `<button class="btn primary big wide" disabled>예측을 먼저 고르세요</button>`;
    if(scanning) return `<button class="btn primary big wide" disabled>관측 중…</button>`;
    if(st.observed.includes('rv') && !analyzeDone(st)) return `<button class="btn primary big wide" data-phase="analyze">자료 분석하러 가기</button>`;
    if(st.observed.length) return `<button class="btn primary big wide" data-phase="judge">판정하러 가기</button>`;
    return `<button class="btn primary big wide" disabled>관측 방법을 먼저 고르세요</button>`;
  }
  if(p==='analyze') return `<button class="btn primary big wide" data-phase="judge">판정하러 가기</button>`;
  if(st.solved){
    const next = store.cur < STARS.length-1;
    return next ? `<button class="btn primary big wide" data-next>다음 미션으로</button>` : `<button class="btn primary big wide" data-screen="map">탐사 지도 보기</button>`;
  }
  return `<button class="btn primary big wide" data-act="submit" ${st.choice?'':'disabled'}>판정 제출</button>`;
}

function methodCard(k,s,st){
  const m = METHODS[k];
  const done = st.observed.includes(k);
  const locked = k==='ml' && !s.ml;
  const disabled = !done && (locked || st.solved || !!scanning);
  const pips = locked ? '<span class="pl">사용 불가</span>' : Array.from({length:m.cost},()=>'<span class="pip"></span>').join('') + `<span class="pl">${m.cost}시간</span>`;
  return `<button class="method ${done?'done':''} ${locked?'locked':''}" data-obs="${k}" ${disabled?'disabled':''}
     aria-label="${m.name}, ${locked?'사용 불가':done?'관측 완료, 자료 보기':m.cost+'시간 필요'}">
    ${done?'<span class="badge">자료 보기</span>':''}
    <span class="mi">${ICONS[k]}</span>
    <span class="mn">${m.name}</span>
    <span class="md">${locked?'배경별 정렬 예보가 없어요':m.desc}</span>
    <span class="pips" aria-hidden="true">${pips}</span>
  </button>`;
}
function dataView(k,s){

    <canvas data-plot="rv" class="plot" aria-label="흡수선 파장 변화 그래프"></canvas>
    <p class="cap">${s.rv.type==='noisy'?'별이 어두워 오차가 커요. ':''}3년 동안 잰 파장 변화 Δλ. 0보다 크면 기준보다 긴 파장이에요.</p>`;

    ${s.lc==='transit'?`<canvas data-plot="lcz" class="plot short" aria-label="어두워진 구간 확대 그래프"></canvas><p class="cap">밝기가 줄어든 구간 하나를 48시간 범위로 확대했어요.</p>`:''}`;

    <canvas data-plot="img" class="img" aria-label="별 주변 사진 세 장"></canvas>
    <p class="cap">${s.img==='unresolved' ? '별이 너무 멀어서 별과 그 주변을 나누어 찍을 수 없어요.' : '가운데 검은 원은 별빛을 가리는 가리개예요. 같은 곳을 10년 간격으로 찍었어요.'}</p>`;

const PRED_METHODS = ORDER;
function predCard(s,st){
  return `<section class="card">
    <h2 class="h">먼저 예측하기</h2>
    <p class="note">관측하기 전에, 이 별에서 어떤 방법이 통할 것 같은지 찍어 보세요. 브리핑의 θ와 밝기가 실마리예요. 틀려도 감점이 없고, 맞히면 별을 1개 더 받아요.</p>
    <div class="chips4" role="radiogroup" aria-label="예측">${PRED_METHODS.map(k=>`<button role="radio" aria-checked="false" data-pred="${k}">${METHODS[k].name}</button>`).join('')}</div>
  </section>`;
}
function phaseObserve(s,st){
  if(!st.pred && !st.solved) return predCard(s,st);
  let box;
  if(scanning){
    box = `<div class="scanning"><div class="sc-title">${METHODS[scanning].name} 관측 중</div><div class="scanbar"><i></i></div></div>`;
  }else if(!st.observed.length){
    box = `<div class="empty">아직 자료가 없어요.<br>위에서 관측 방법을 골라 보세요.</div>`;
  }else{
    if(!store.tab || !st.observed.includes(store.tab)) store.tab = st.observed[st.observed.length-1];
    const tabs = st.observed.map(k=>`<button class="tab ${store.tab===k?'on':''}" data-tab="${k}" aria-pressed="${store.tab===k}">${ICONS[k]}${METHODS[k].name}</button>`).join('');
    box = `<div class="tabs" role="group" aria-label="자료 선택">${tabs}</div>${dataView(store.tab,s)}`;
  }
  return `

    <p class="note">${s.theta==null?'궤도면 방향을 모르는 어두운 별이에요.':`θ = ${s.theta}°, 밝기 ${s.bright}.`} 어떤 방법이 통할지 먼저 예상해 보세요.</p>

function phaseAnalyze(s,st){
  const truth = s.rv.type==='signal' ? 'yes' : 'no';
  const pbtn = (v,label)=>{
    let cls = '';
    if(st.periodicOk && st.periodic===v) cls = 'ok';
    else if(!st.periodicOk && st.periodic===v) cls = 'pick';
    return `<button class="${cls}" data-periodic="${v}" ${st.periodicOk?'disabled':''}>${label}</button>`;
  };
  let step1msg = '';
  if(st.periodicOk && truth==='no') step1msg = `<div class="msg good">맞아요. 일정하게 반복되는 신호가 없으니 이 별에는 비교 자료를 쓸 수 없어요. 다른 자료를 근거로 판정하세요.</div>`;
  else if(st.periodicOk) step1msg = `<div class="msg good">맞아요. 동반 천체가 별을 흔들고 있어요. 얼마나 빨리 흔드는지 계산해서 정체를 밝혀 봐요.</div>`;
  else if(st.periodicFb) step1msg = `<div class="msg bad">${st.periodicFb}</div>`;

  let step2 = '';
  if(st.periodicOk && truth==='yes'){
    const th = s.theta;
    const slot = (k,label,unit)=>{
      const v = st.slots[k], fb = st.slotFb[k];
      const ok = fb && fb.ok, no = fb && !fb.ok;
      return `<button class="slot ${calc.sel===k && !ok?'sel':''} ${ok?'ok':''} ${no?'no':''}" data-slot="${k}" ${ok?'aria-disabled="true"':''}>
        <span class="sl">${label}${ok?' ✓':''}</span>
        <span class="sv ${v==null?'empty':''}">${v==null?'탭해서 고른 뒤 계산기로 넣기':prettyNum(v)}</span>
        <span class="su">${unit}</span></button>${no?`<div class="slotmsg">${fb.msg}</div>`:''}`;
    };
    step2 = `
    <section class="card" id="calcCard">
      <h2 class="h">2. 실제 속도 계산</h2>
      <div class="formula">vᵣ = c × Δλ ÷ λ₀<br>v = vᵣ ÷ cos θ</div>
      <div class="consts">
        <span class="const">c = 3×10⁸ m/s</span><span class="const">λ₀ = 600 nm</span>
        <span class="const hl">θ = ${th}°</span><span class="const hl">cos ${th}° ≈ ${COS[th]}</span>
      </div>
      <div class="slots">
        ${slot('dl','① 그래프에서 읽은 가장 큰 Δλ','×10⁻⁵ nm')}
        ${slot('vr','② 시선속도 vᵣ','m/s')}
        ${slot('v','③ 별의 실제 속도 v','m/s')}
      </div>
      ${st.rvcalc
        ? `<div class="msg good"><b>계산 완료!</b> 별의 실제 속도는 <b class="mono">${fmt(s.rv.vr/COS[th])} m/s</b>예요. 비교 자료의 사례들과 견주어 보세요.<div style="margin-top:8px"><button class="btn small" data-open="table">비교 자료 보기</button></div></div>`
        : `<div class="worknote">아래 계산기에서 넣을 칸을 고르고, 계산한 값을 <b>넣기</b>로 채운 뒤 <b>확인</b>을 누르세요. 그래프를 보려면 화면을 위로 올리면 돼요. 계산기는 그대로 있어요.</div>`}
    </section>`;
  }
  return `
  <section class="card">
    <h2 class="h">1. 흡수선 기록 읽기</h2>
    <canvas data-plot="rv" class="plot" aria-label="흡수선 파장 변화 그래프"></canvas>
    <p class="q">흡수선 파장이 일정한 주기로 오르내리나요?</p>
    <div class="choice2">${pbtn('yes','주기적으로 반복된다')}${pbtn('no','반복되는 변화가 없다')}</div>
    ${step1msg}
  </section>
  ${step2}`;
}

function evidenceItems(s,st){
  if(!st.observed.length) return '<div class="empty">아직 모은 증거가 없어요.</div>';
  return '<ul class="evidence">' + st.observed.map(k=>{
    let sub;
    if(k==='rv'){
      if(st.rvcalc) sub = `별의 실제 속도 ${fmt(s.rv.vr/COS[s.theta])} m/s`;
      else if(st.periodicOk && st.periodic==='no') sub = '일정하게 반복되는 신호 없음';
      else if(st.periodicOk) sub = '반복 신호 있음, 계산 전';
      else sub = '아직 분석하지 않음';
    }
    else if(k==='transit') sub = '3년 광도곡선';
    else if(k==='direct') sub = '10년 간격 사진 3장';
    else sub = '80일 배경별 광도곡선';
    return `<li>${ICONS[k]}<div><b>${METHODS[k].name}</b><span>${sub}</span></div></li>`;
  }).join('') + '</ul>';
}
function phaseJudge(s,st){

    return `<section class="card solved-box">
      <div class="stamp good" style="animation:none">판정 승인</div>
      <div class="bigstars" aria-label="별 ${st.rating}개">${[0,1,2].map(i=>`<span class="${i<st.rating?'':'off'}">★</span>`).join('')}</div>

      <p class="ov-text">${s.wrap}</p>
      <div class="ov-actions"><button class="btn" data-act="reset">이 미션 처음부터 다시 하기</button></div>
    </section>`;
  }
  const cards = VERDICTS.map(v=>`<button class="vcard" role="radio" aria-checked="${st.choice===v.k}" data-verdict="${v.k}">
      ${VICON[v.k]}<span class="vt">${v.t}</span><span class="vd">${v.d}</span></button>`).join('');
  return `
  <section class="card">

      <div style="margin-top:8px"><button class="btn small" data-open="table">비교 자료 보기</button></div></div>
    <div class="verdicts" role="radiogroup" aria-label="판정">${cards}</div>
  </section>`;
}
